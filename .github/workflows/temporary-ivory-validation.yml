name: Temporary Ivory differential and visual validation

on:
  push:
    branches: [implementation/ivory-clean-room]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_bootstrap_only
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: storm_match_ci
      DB_USER: storm_orogeny
      DB_PASSWORD: ci_application_only
      DB_SSL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c5460de51034069f56f05329109fcbe86f04a05
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9d848dc1399a4b7d2d9d0e9dfacb79d474ff28c
          path: implementation
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bootstrap non-superuser UTF-8 database
        env:
          PGPASSWORD: ci_bootstrap_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE storm_orogeny LOGIN PASSWORD 'ci_application_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE storm_match_ci OWNER storm_orogeny ENCODING 'UTF8' TEMPLATE template0;
          SQL
          test "$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "SELECT rolsuper FROM pg_roles WHERE rolname='storm_orogeny'")" = f
      - name: Install unchanged baseline and candidate
        run: |
          (cd baseline && npm ci)
          (cd implementation && npm ci)
          test "$(git -C implementation rev-parse e9d848dc1399a4b7d2d9d0e9dfacb79d474ff28c^{tree})" = e7d9da95b79721d30865615df514ca4e2ae34aef
          test -z "$(git -C implementation diff e9d848dc1399a4b7d2d9d0e9dfacb79d474ff28c HEAD -- public/ivory src test package.json package-lock.json docs)"
      - name: Differential unchanged historical files 60 repetitions per tree
        env:
          PGPASSWORD: ci_bootstrap_only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/differential"
          for iteration in $(seq 1 60); do
            for tree in baseline implementation; do
              psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE storm_match_ci WITH (FORCE);
          CREATE DATABASE storm_match_ci OWNER storm_orogeny ENCODING 'UTF8' TEMPLATE template0;
          SQL
              log="$RUNNER_TEMP/differential/${tree}-${iteration}.log"
              code=0
              (cd "$tree" && node --test --test-concurrency=1 test/2f-pilotage.test.js test/3d-public-access.test.js test/2s-privacy-batch5.test.js) > "$log" 2>&1 || code=$?
              echo "DIFFERENTIAL $tree iteration=$iteration exit=$code"
              grep '^not ok' "$log" || true
              echo "$tree,$iteration,$code" >> "$RUNNER_TEMP/differential/exits.csv"
            done
          done
          python3 - <<'PYTHON'
          import pathlib,json,re,os,collections
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'differential'
          summary={}
          for tree in ['baseline','implementation']:
            logs=list(root.glob(tree+'-*.log'));counter=collections.Counter();failed=0;skips=0
            for log in logs:
              text=log.read_text();failures=re.findall(r'^not ok \d+ - (.*)$',text,re.M)
              failed+=bool(failures);counter.update(failures)
              skips+=sum(map(int,re.findall(r'^# skipped (\d+)$',text,re.M)))
            summary[tree]={'repetitions':len(logs),'failedRuns':failed,'skippedTests':skips,'failureCounts':dict(counter)}
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('DIFFERENTIAL_SUMMARY='+json.dumps(summary,ensure_ascii=False))
          PYTHON
      - name: Reset same service for clean acceptance execution
        env:
          PGPASSWORD: ci_bootstrap_only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE storm_match_ci WITH (FORCE);
          CREATE DATABASE storm_match_ci OWNER storm_orogeny ENCODING 'UTF8' TEMPLATE template0;
          SQL
      - name: Focused Ivory and public boundary gates
        working-directory: implementation
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/3b-ivory-horizontal-rail.test.js test/2e-ivory.test.js | tee "$RUNNER_TEMP/focused.log"
      - name: Identity public access and Storm Match regression gates
        continue-on-error: true
        working-directory: implementation
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/storm-match-runtime.test.js test/storm-match-project-corpus.test.js test/2d-publication.test.js test/3d-public-access.test.js test/3e-publication-prereq-bugfix.test.js | tee "$RUNNER_TEMP/regression.log"
      - name: Fresh application database before the single full suite
        env:
          PGPASSWORD: ci_bootstrap_only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE storm_match_ci WITH (FORCE);
          CREATE DATABASE storm_match_ci OWNER storm_orogeny ENCODING 'UTF8' TEMPLATE template0;
          SQL
      - name: Full deterministic suite 830 tests
        working-directory: implementation
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/*.test.js | tee "$RUNNER_TEMP/full.log"
          grep -Eq '^(#|ℹ) pass 830$' "$RUNNER_TEMP/full.log"
          grep -Eq '^(#|ℹ) skipped 0$' "$RUNNER_TEMP/full.log"
      - name: Scope and whitespace
        working-directory: implementation
        run: |
          git diff --check 8c5460de51034069f56f05329109fcbe86f04a05 HEAD
          test -z "$(git diff --name-only 8c5460de51034069f56f05329109fcbe86f04a05 HEAD -- src/domain/stormMatch/ test/storm-match-eval/ db/migrations/ package.json package-lock.json)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-differential-validation
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/differential/
          retention-days: 7
