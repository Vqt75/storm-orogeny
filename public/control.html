<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Control — Orogeny V1</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{--canvas:#f6f6f3;--surface:#fff;--ink:#111;--graphite:#2f2f32;--muted:#77777b;--quiet:#96969a;--gold:#c2af7e;--ease:cubic-bezier(.22,1,.36,1);--shadow-soft:0 18px 50px rgba(17,17,17,.075);--radius-xl:30px}
*{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 14% -12%,rgba(255,255,255,.98),transparent 35%),radial-gradient(circle at 92% 4%,rgba(194,175,126,.07),transparent 23%),var(--canvas);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif}button{font:inherit;color:inherit}[hidden]{display:none!important}.shell{min-height:100vh;padding:22px 28px 132px}.topbar{position:sticky;top:16px;z-index:30;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.36);backdrop-filter:blur(24px) saturate(175%) contrast(102%);-webkit-backdrop-filter:blur(24px) saturate(175%) contrast(102%);border-radius:20px;box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.78),inset 0 -1px 0 rgba(17,17,17,.04);overflow:hidden}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:720;letter-spacing:-.035em}.brand span{color:var(--muted);font-weight:560}.top-actions{display:flex;align-items:center;gap:6px}.home-link,.avatar-btn,.account-action{border:0;cursor:pointer}.home-link{padding:9px 12px;border-radius:12px;background:transparent;font-size:13px;font-weight:670}.home-link:hover,.home-link:focus-visible{background:rgba(255,255,255,.52)}.avatar-wrap{position:relative}.avatar-btn{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}.account-popover{position:absolute;right:0;top:48px;width:250px;padding:9px;border-radius:18px;border:1px solid rgba(255,255,255,.64);background:rgba(249,249,247,.68);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 22px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.82);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.985);transform-origin:top right;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s}.account-popover.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.account-head{padding:12px}.account-head strong{display:block;font-size:14px;margin-bottom:3px}.account-head span{display:block;color:var(--muted);font-size:12px}.account-action{width:100%;padding:10px 12px;border-radius:11px;background:transparent;text-align:left;font-size:13px}.account-action:hover{background:rgba(17,17,17,.045)}.home-link:focus-visible,.avatar-btn:focus-visible,.account-action:focus-visible,.command-button:focus-visible{outline:3px solid rgba(17,17,17,.12);outline-offset:3px}main{width:min(1240px,100%);margin:0 auto;padding-top:96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-bottom:64px}.eyebrow{margin:0 0 14px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(56px,7vw,102px);line-height:.9;letter-spacing:-.067em;font-weight:630}.hero-copy{margin:20px 0 0;max-width:580px;color:var(--muted);font-size:16px;line-height:1.55}.scope-mark{align-self:start;margin-top:14px;min-width:140px;padding:15px 17px 16px;border-radius:22px;background:rgba(17,17,17,.94);color:#f6f6f3;box-shadow:var(--shadow-soft)}.scope-mark small{display:block;color:rgba(246,246,243,.55);font-size:10px;font-weight:760;letter-spacing:.11em;text-transform:uppercase;margin-bottom:14px}.scope-mark strong{display:block;font-size:20px;letter-spacing:-.035em}.section{margin-bottom:48px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px;padding:0 4px}.section-head h2{margin:0;font-size:24px;letter-spacing:-.04em;font-weight:690}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.section-count{color:var(--quiet);font-size:13px;font-weight:680}.collection{display:grid;gap:10px}.project-cell,.member-cell{width:100%;border:0;border-radius:24px;background:rgba(255,255,255,.72);box-shadow:0 1px 0 rgba(255,255,255,.82) inset,0 10px 30px rgba(17,17,17,.035);text-align:left}.project-cell{min-height:106px;padding:18px 20px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:18px;align-items:center}.project-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#111;color:#fff;font-size:18px;font-weight:760}.project-name{margin:0 0 5px;font-size:19px;font-weight:690;letter-spacing:-.03em}.project-meta{color:var(--muted);font-size:12px}.status-pill,.bundle-pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(17,17,17,.055);color:var(--graphite);font-size:11px;font-weight:700;white-space:nowrap}.member-cell{min-height:92px;padding:16px 18px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center}.member-avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;font-weight:760}.member-name{margin:0 0 4px;font-size:16px;font-weight:680}.member-email{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.member-right{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}.bundle-pill{background:rgba(194,175,126,.15);color:#5e5438}.empty-state,.error-state,.loading-state{min-height:260px;border-radius:28px;background:rgba(255,255,255,.48);display:flex;align-items:flex-end;padding:28px}.empty-state strong,.error-state strong{display:block;margin-bottom:7px;font-size:21px}.empty-state span,.error-state p{display:block;margin:0;max-width:480px;color:var(--muted);font-size:14px;line-height:1.5}.skeleton-list{width:100%;display:grid;gap:10px}.skeleton-row{height:100px;border-radius:24px;background:linear-gradient(105deg,rgba(255,255,255,.36) 18%,rgba(255,255,255,.82) 38%,rgba(255,255,255,.36) 58%);background-size:220% 100%;animation:storm-skeleton 1.25s linear infinite}@keyframes storm-skeleton{to{background-position-x:-220%}}.command-layer{position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);width:min(520px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.72);border-radius:20px;background:rgba(244,244,242,.48);backdrop-filter:blur(28px) saturate(190%) contrast(103%);-webkit-backdrop-filter:blur(28px) saturate(190%) contrast(103%);box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(17,17,17,.045)}.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}.command-button{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:transparent;cursor:pointer;font-size:13px;font-weight:690}.command-button.active{background:rgba(255,255,255,.78);box-shadow:0 7px 18px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.92)}.command-message{padding:0 12px;text-align:center;font-size:13px;color:var(--graphite)}.command-message strong{color:var(--ink);font-weight:720}.command-retry{background:#111;color:#fff}@media(max-width:780px){.shell{padding:14px 14px 126px}.topbar{top:10px;height:58px;padding-left:15px}.brand span,.home-link{display:none}main{padding-top:72px}.hero{grid-template-columns:1fr;margin-bottom:48px}h1{font-size:clamp(50px,16vw,76px)}.scope-mark{display:none}.project-cell,.member-cell{grid-template-columns:48px minmax(0,1fr)}.project-cell .status-pill,.member-right{grid-column:2;justify-self:start}.command-layer{bottom:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><strong>Storm</strong><span>Control</span></div><div class="top-actions"><button class="home-link" id="homeLink" type="button">Storm Home</button><div class="avatar-wrap"><button class="avatar-btn" id="avatarBtn" type="button" aria-label="Compte" aria-expanded="false">VC</button><div class="account-popover" id="accountPopover"><div class="account-head"><strong id="accountName">Utilisateur Storm</strong><span id="accountOrg">Storm</span></div><button class="account-action" id="accountHome" type="button">Storm Home</button></div></div></div></header>
<main>
<section class="hero"><div><p class="eyebrow">Storm Control</p><h1 id="controlTitle">Parella.</h1><p class="hero-copy">Gouvernance de votre organisation.</p></div><div class="scope-mark"><small>Organisation</small><strong id="scopeOrg">Parella</strong></div></section>
<section class="section" id="projectsSection"><div class="section-head"><div><h2>Projets</h2><p>Les projets rattachés à l’organisation.</p></div><span class="section-count" id="projectsCount"></span></div><div id="projectsContent"></div></section>
<section class="section" id="membersSection" hidden><div class="section-head"><div><h2>Membres</h2><p>Les personnes rattachées à l’organisation.</p></div><span class="section-count" id="membersCount"></span></div><div id="membersContent"></div></section>
</main></div>
<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer"><div class="command-state" id="commandState" aria-live="polite"></div></div>
<script>
const CAP={CONTROL:'control.access',PROJECTS:'projects.view_all',MEMBERS:'organization.members.manage'};const state={me:null,visibleSections:[],activeSection:null,projects:{status:'idle',data:[],error:null},members:{status:'idle',data:[],error:null},commandLocked:false};const controlTitle=document.getElementById('controlTitle'),scopeOrg=document.getElementById('scopeOrg'),accountName=document.getElementById('accountName'),accountOrg=document.getElementById('accountOrg'),avatarBtn=document.getElementById('avatarBtn'),accountPopover=document.getElementById('accountPopover'),projectsSection=document.getElementById('projectsSection'),membersSection=document.getElementById('membersSection'),projectsContent=document.getElementById('projectsContent'),membersContent=document.getElementById('membersContent'),projectsCount=document.getElementById('projectsCount'),membersCount=document.getElementById('membersCount'),commandLayer=document.getElementById('commandLayer'),commandState=document.getElementById('commandState');
function devHeaders(){const d=new URLSearchParams(location.search).get('devUser');return d?{'X-Storm-Dev-User':d}:{}}function homeUrl(){const d=new URLSearchParams(location.search).get('devUser');return d?`/?devUser=${encodeURIComponent(d)}`:'/'}function initials(n='Storm User'){return n.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('')||'S'}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function has(me,c){return Array.isArray(me?.organization?.capabilities)&&me.organization.capabilities.includes(c)}function bundle(b){return ({organization_admin:'Administrateur de l’organisation',member:'Membre'})[b]||'Membre'}function status(s){return ({active:'Actif',archived:'Archivé',suspended:'Suspendu'})[s]||s||'—'}async function getJson(url){const r=await fetch(url,{headers:{Accept:'application/json',...devHeaders()},credentials:'same-origin'});if(!r.ok){const e=new Error(`HTTP ${r.status}`);e.status=r.status;throw e}return r.json()}
function setCommand(html){commandState.innerHTML=html;wireCommand()}function normalCommand(){if(state.visibleSections.length===1){return `<span class="command-message"><strong>${state.visibleSections[0]==='projects'?'Projets':'Membres'}</strong></span>`}return state.visibleSections.map(s=>`<button class="command-button${state.activeSection===s?' active':''}" type="button" data-section="${s}" aria-pressed="${state.activeSection===s}">${s==='projects'?'Projets':'Membres'}</button>`).join('')}function renderCommand(){if(state.commandLocked)return;const a=state.activeSection,x=a==='members'?state.members:state.projects;if(x?.status==='loading'){setCommand(`<span class="command-message">Chargement de <strong>${a==='members'?'vos membres':'vos projets'}</strong>…</span>`);return}if(x?.status==='error'){setCommand(`<span class="command-message">Impossible de charger cette vue.</span><button class="command-button command-retry" data-command="retry" type="button">Réessayer</button>`);return}setCommand(normalCommand())}function wireCommand(){commandState.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>setSection(b.dataset.section)));commandState.querySelector('[data-command="retry"]')?.addEventListener('click',()=>state.activeSection==='members'?loadMembers():loadProjects())}commandLayer.addEventListener('focusin',()=>state.commandLocked=true);commandLayer.addEventListener('focusout',e=>{if(commandLayer.contains(e.relatedTarget))return;state.commandLocked=false;renderCommand()});
function setSection(s){if(!state.visibleSections.includes(s))return;state.activeSection=s;projectsSection.hidden=s!=='projects';membersSection.hidden=s!=='members';renderCommand();if(s==='projects'&&state.projects.status==='idle')loadProjects();if(s==='members'&&state.members.status==='idle')loadMembers()}
function loading(){return `<div class="loading-state"><div class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div></div>`}function err(noun){return `<div class="error-state" role="alert"><div><strong>Storm n’arrive pas à charger ${noun}.</strong><p>Votre organisation n’a pas été modifiée. Vous pouvez réessayer depuis la Command Layer.</p></div></div>`}function empty(t){return `<div class="empty-state"><div><strong>${t==='projects'?'Aucun projet.':'Aucun membre.'}</strong><span>${t==='projects'?'Les projets rattachés à cette organisation apparaîtront ici.':'Les membres rattachés à cette organisation apparaîtront ici.'}</span></div></div>`}function project(p){return `<div class="project-cell"><div class="project-mark">${esc((p.name||'P')[0].toUpperCase())}</div><div><div class="project-name">${esc(p.name||'Projet')}</div><div class="project-meta">Projet Storm</div></div><span class="status-pill">${esc(status(p.status))}</span></div>`}function member(m){return `<div class="member-cell"><div class="member-avatar">${esc(initials(m.displayName||m.email))}</div><div><div class="member-name">${esc(m.displayName||m.email||'Membre')}</div><div class="member-email">${esc(m.email||'')}</div></div><div class="member-right"><span class="bundle-pill">${esc(bundle(m.permissionBundle))}</span><span class="status-pill">${esc(status(m.status))}</span></div></div>`}
function renderProjects(){const x=state.projects;projectsCount.textContent=x.status==='ready'?`${x.data.length} projet${x.data.length>1?'s':''}`:'';projectsContent.innerHTML=x.status==='loading'?loading():x.status==='error'?err('les projets'):x.status==='ready'&&!x.data.length?empty('projects'):x.status==='ready'?`<div class="collection">${x.data.map(project).join('')}</div>`:''}function renderMembers(){const x=state.members;membersCount.textContent=x.status==='ready'?`${x.data.length} membre${x.data.length>1?'s':''}`:'';membersContent.innerHTML=x.status==='loading'?loading():x.status==='error'?err('les membres'):x.status==='ready'&&!x.data.length?empty('members'):x.status==='ready'?`<div class="collection">${x.data.map(member).join('')}</div>`:''}
async function loadProjects(){state.projects={...state.projects,status:'loading',error:null};renderProjects();renderCommand();try{const d=await getJson('/api/control/projects');state.projects={status:'ready',data:Array.isArray(d)?d:[],error:null}}catch(e){state.projects={status:'error',data:[],error:e}}renderProjects();renderCommand()}async function loadMembers(){state.members={...state.members,status:'loading',error:null};renderMembers();renderCommand();try{const d=await getJson('/api/control/members');state.members={status:'ready',data:Array.isArray(d)?d:[],error:null}}catch(e){state.members={status:'error',data:[],error:e}}renderMembers();renderCommand()}
function renderIdentity(me){const n=me?.displayName||'Utilisateur Storm',o=me?.organization?.name||'Organisation';controlTitle.textContent=`${o}.`;scopeOrg.textContent=o;accountName.textContent=n;accountOrg.textContent=`Storm · ${o}`;avatarBtn.textContent=initials(n)}function sections(me){const s=[];if(has(me,CAP.PROJECTS))s.push('projects');if(has(me,CAP.MEMBERS))s.push('members');return s}async function hydrate(){setCommand('<span class="command-message">Ouverture de <strong>Storm Control</strong>…</span>');try{const me=await getJson('/api/me');state.me=me;renderIdentity(me);if(!has(me,CAP.CONTROL)){projectsSection.hidden=membersSection.hidden=true;setCommand('<span class="command-message">Vous n’avez pas accès à Storm Control.</span>');return}state.visibleSections=sections(me);if(!state.visibleSections.length){projectsSection.hidden=membersSection.hidden=true;setCommand('<span class="command-message">Aucun périmètre de gouvernance disponible.</span>');return}setSection(state.visibleSections[0])}catch(e){projectsSection.hidden=membersSection.hidden=true;setCommand('<span class="command-message">Impossible d’ouvrir Storm Control.</span><button class="command-button command-retry" type="button" data-command="bootstrap">Réessayer</button>');commandState.querySelector('[data-command="bootstrap"]')?.addEventListener('click',hydrate)}}
document.getElementById('homeLink').addEventListener('click',()=>location.assign(homeUrl()));document.getElementById('accountHome').addEventListener('click',()=>location.assign(homeUrl()));avatarBtn.addEventListener('click',e=>{e.stopPropagation();const o=accountPopover.classList.toggle('open');avatarBtn.setAttribute('aria-expanded',String(o))});document.addEventListener('click',e=>{if(!e.target.closest('.avatar-wrap')){accountPopover.classList.remove('open');avatarBtn.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&accountPopover.classList.contains('open')){accountPopover.classList.remove('open');avatarBtn.setAttribute('aria-expanded','false');avatarBtn.focus()}});hydrate();
</script>
</body></html>
