<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Studio — Homepage · Orogeny</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{
  --canvas:#f6f6f3;--ink:#111;--graphite:#353539;--muted:#77777c;--quiet:#a2a2a7;
  --line:rgba(17,17,17,.08);--danger:#b42318;--glass:rgba(247,247,244,.50);
  --ease:cubic-bezier(.22,1,.36,1)
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--canvas)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 10% -8%,rgba(255,255,255,.98),transparent 34%),
    radial-gradient(circle at 88% 3%,rgba(17,17,17,.035),transparent 25%),
    var(--canvas);
  -webkit-font-smoothing:antialiased
}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.shell{min-height:100vh;padding:22px 28px 154px}
.topbar{
  z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.75);border-radius:20px;
  background:rgba(255,255,255,.37);backdrop-filter:blur(24px) saturate(175%);
  box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.82)
}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:720;letter-spacing:-.035em}
.brand-project{color:var(--muted);font-weight:560}.top-actions{display:flex;align-items:center;gap:6px}
.project-link{border:0;background:transparent;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:670}
.project-link:hover{background:rgba(255,255,255,.55)}
.avatar{width:38px;height:38px;border:0;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}
main{width:min(1280px,100%);margin:0 auto;padding-top:84px}
.studio-grid{display:grid;grid-template-columns:190px minmax(0,860px);gap:58px;align-items:start}
.studio-nav{
  padding:7px;border:1px solid rgba(255,255,255,.72);border-radius:22px;
  background:rgba(247,247,244,.44);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:0 12px 38px rgba(17,17,17,.065),inset 0 1px 0 rgba(255,255,255,.82)
}
.nav-item{
  width:100%;min-height:43px;padding:0 13px;border:0;border-radius:15px;background:transparent;text-align:left;
  color:var(--muted);font-size:13px;font-weight:650
}
.nav-item:hover{color:var(--ink);background:rgba(255,255,255,.42)}
.nav-item.active{color:var(--ink);background:rgba(255,255,255,.86);box-shadow:0 7px 18px rgba(17,17,17,.055)}
.page-head{position:relative;margin-bottom:42px}
.page-head:after{content:"";position:absolute;z-index:-1;width:280px;height:280px;right:-50px;top:-110px;border-radius:50%;background:rgba(17,17,17,.028)}
.eyebrow{margin:0 0 13px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}
h1{margin:0;font-size:clamp(54px,6.2vw,88px);line-height:.9;letter-spacing:-.064em;font-weight:630}
.lead{max-width:650px;margin:19px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
.editor{
  border-radius:30px;background:rgba(255,255,255,.77);padding:34px;
  box-shadow:0 1px 0 rgba(255,255,255,.88) inset,0 14px 38px rgba(17,17,17,.045)
}
.section{padding:0 0 30px}.section+.section{padding-top:30px;border-top:1px solid var(--line)}
.field-label{display:block;margin-bottom:8px;color:var(--quiet);font-size:10px;font-weight:760;letter-spacing:.1em;text-transform:uppercase}
.section h2{margin:0;font-size:20px;letter-spacing:-.03em}.section-copy{margin:7px 0 16px;color:var(--muted);font-size:12px;line-height:1.55;max-width:650px}
.edit{outline:0;border-radius:18px;background:rgba(17,17,17,.035);color:var(--graphite)}
.message-edit{min-height:150px;padding:18px;font-size:17px;line-height:1.58}
.prompt-edit{min-height:52px;padding:14px 16px;font-size:14px}
.edit:empty:before{content:attr(data-placeholder);color:#b2b2b6;pointer-events:none}
.segmented{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.segment{
  min-height:58px;padding:12px 14px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.58);
  text-align:left;font-size:12px;font-weight:690
}
.segment:hover{background:#fff}.segment.active{background:#111;color:#fff;border-color:#111}
.article-picker{margin-top:12px;display:grid;gap:8px}
.article-option{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;
  min-height:58px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(246,246,243,.72);
  text-align:left
}
.article-option:hover{background:#fff}.article-option.active{box-shadow:0 0 0 2px #111 inset}
.article-option small{display:block;margin-bottom:4px;color:var(--quiet);font-size:10px;font-weight:760;text-transform:uppercase;letter-spacing:.09em}
.article-option strong{display:block;font-size:13px;line-height:1.35}.check{font-size:15px}
.toggle-card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 18px;border-radius:19px;background:rgba(246,246,243,.72)}
.toggle-copy strong{display:block;font-size:14px}.toggle-copy span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}
.switch{position:relative;width:50px;height:30px;border:0;border-radius:999px;background:rgba(17,17,17,.12);flex:0 0 auto}
.switch:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(17,17,17,.18);transition:.2s var(--ease)}
.switch.on{background:#111}.switch.on:before{transform:translateX(20px)}
.subfield{margin-top:12px}.hint{margin-top:9px;color:var(--quiet);font-size:11px;line-height:1.45}
.derived-note{margin-top:12px;padding:13px 15px;border-radius:16px;background:rgba(17,17,17,.035);color:var(--muted);font-size:11px;line-height:1.5}
.loading{padding:24px;color:var(--muted);font-size:13px}
.command-layer{
  position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);
  width:min(640px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.74);
  border-radius:20px;background:var(--glass);backdrop-filter:blur(28px) saturate(190%);
  box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.9)
}
.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
.command-message{padding:0 12px;text-align:center;color:var(--graphite);font-size:13px}
.command-message strong{color:var(--ink);font-weight:720}
.command-button{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:transparent;font-size:13px;font-weight:690}
.command-button:hover{background:rgba(255,255,255,.44)}.command-button.primary{background:#111;color:#fff}.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}.state-dot-success{background:#1f8a52}.state-dot-warning{background:#b57a12}.state-dot-error{background:#c23a2e}.command-link{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:15px;color:#343438;font-size:13px;font-weight:690;text-decoration:none}.command-link:hover{background:rgba(255,255,255,.44)}
@media(max-width:900px){
  .shell{padding:14px 14px 146px}.topbar{top:10px}.brand-project,.project-link{display:none}
  main{padding-top:66px}.studio-grid{grid-template-columns:1fr;gap:30px}
  .studio-nav{position:relative;top:auto;display:flex;gap:4px;overflow:auto;scrollbar-width:none}
  .studio-nav::-webkit-scrollbar{display:none}.nav-item{width:auto;flex:0 0 auto}.editor{padding:24px}
  .segmented{grid-template-columns:1fr}.command-layer{bottom:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><strong>Storm</strong><span class="brand-project" id="brandProject">Projet</span></div>
    <div class="top-actions"><button class="project-link" id="projectLink" type="button">Projet</button><button class="avatar" id="avatarBtn" type="button" aria-label="Compte">VC</button></div>
  </header>

  <main>
    <div class="studio-grid">
      <nav class="studio-nav" aria-label="Studio">
        <button class="nav-item active" data-domain="homepage" type="button" aria-current="page">Homepage</button>
        <button class="nav-item" data-domain="project" type="button">Le projet</button>
        <button class="nav-item" data-domain="spaces" type="button">Espaces</button>
        <button class="nav-item" data-domain="news" type="button">Actualités</button>
        <button class="nav-item" data-domain="ambassadors" type="button">Ambassadeurs</button>
        <button class="nav-item" data-domain="questions" type="button">Questions</button>
      </nav>

      <section>
        <header class="page-head">
          <p class="eyebrow">Studio</p>
          <h1>Homepage</h1>
          <p class="lead">Composez la page d’accueil du projet et choisissez les contenus à mettre en avant.</p>
        </header>
        <article class="editor" id="editor"></article>
      </section>
    </div>
  </main>
</div>

<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer">
  <div class="command-state" id="commandState" aria-live="polite"></div>
</div>

<script>
/*
STORM STUDIO — HOMEPAGE · PRODUCT HANDOFF V3
=============================================

TARGET PRODUCT ROLE
Homepage is the editorial composition layer for Ivory's landing page.
It DOES NOT duplicate News, Milestones or Questions content.
It stores editorial intent and lets the future Publication compiler resolve it.

TARGET CONCEPTUAL FIELDS (names MUST be verified/adapted to backend conventions):
{
  message: string,
  featuredArticleMode: "latest" | "manual",
  featuredArticleId: uuid | null,
  showMilestones: boolean,
  showAskPrompt: boolean,
  askPrompt: string
}

CURRENT BACKEND BEFORE DELTA:
GET/PATCH /api/projects/:id/studio/section-content/homepage
currently accepts only message + askPrompt and replaces fields as a whole.
This handoff therefore represents the TARGET UX and the integration skeleton after the backend delta is approved.

RELATED DATA:
GET /api/projects/:id/studio/articles   // selection source for manual featured article
Milestones remain owned by "Le projet"; Homepage only stores showMilestones.
Questions remain owned by Questions; Homepage only stores showAskPrompt + askPrompt.

COMPILER INTENT:
- featuredArticleMode=latest -> resolve latest eligible article at publication.
- featuredArticleMode=manual + featuredArticleId -> resolve chosen article.
- if chosen article is missing/deleted, backend/compiler behavior must be defined during delta implementation.
- showMilestones=true -> compiler derives current + next milestones.
- showAskPrompt=true -> Ivory renders question invitation using askPrompt, with compiler fallback only if draft is blank.
*/

const state={
  context:null,me:null,articles:[],
  fields:{
    message:"",
    featuredArticleMode:"latest",
    featuredArticleId:null,
    showMilestones:true,
    showAskPrompt:true,
    askPrompt:""
  },
  version:null,updatedAt:null,
  load:"loading",save:"saved",error:null,unpublished:false,
  timer:null,inflight:false,queued:false,commandLocked:false
};

const editor=document.getElementById("editor");
const commandLayer=document.getElementById("commandLayer");
const commandState=document.getElementById("commandState");

const projectId=(()=>{
  const m=location.pathname.match(/^\/projects\/([^/]+)\/studio(?:\/homepage)?\/?$/);
  return m?decodeURIComponent(m[1]):"";
})();

function devHeaders(){
  const d=new URLSearchParams(location.search).get("devUser");
  return d?{"X-Storm-Dev-User":d}:{};
}
function preserveDev(url){
  const d=new URLSearchParams(location.search).get("devUser");
  return d?url+(url.includes("?")?"&":"?")+"devUser="+encodeURIComponent(d):url;
}
function hasCap(cap){return state.context?.membership?.capabilities?.includes(cap)}
function esc(v=""){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

async function api(url,options={}){
  const headers={Accept:"application/json",...devHeaders(),...(options.headers||{})};
  if(options.body && !headers["Content-Type"])headers["Content-Type"]="application/json";
  const res=await fetch(url,{...options,credentials:"same-origin",headers});
  const type=res.headers.get("content-type")||"";
  const body=res.status===204?null:(type.includes("application/json")?await res.json():await res.text());
  if(!res.ok){
    const e=new Error(body?.error?.message||body?.message||`HTTP ${res.status}`);
    e.status=res.status;e.body=body;throw e;
  }
  return body;
}

function renderEditor(){
  if(state.load==="loading"){editor.innerHTML='<div class="loading">Storm ouvre la Homepage…</div>';return}
  if(state.load==="error"){editor.innerHTML='<div class="loading">Storm n’arrive pas à ouvrir la Homepage.</div>';return}

  const f=state.fields;
  editor.innerHTML=`
    <section class="section">
      <span class="field-label">Accueil</span>
      <h2>Message d’accueil</h2>
      <p class="section-copy">Ce texte accueille les collaborateurs lorsqu’ils arrivent sur le projet.</p>
      <div class="edit message-edit" contenteditable="true" data-field="message" data-placeholder="Écrivez le message d’accueil…">${esc(f.message||"")}</div>
    </section>

    <section class="section">
      <span class="field-label">Actualité à la une</span>
      <h2>Quelle actualité mettre en avant ?</h2>
      <p class="section-copy">L’article reste géré dans Actualités. Homepage ne conserve que votre choix de mise en avant.</p>
      <div class="segmented">
        <button class="segment ${f.featuredArticleMode==="latest"?"active":""}" data-mode="latest" type="button">Automatique — dernière actualité</button>
        <button class="segment ${f.featuredArticleMode==="manual"?"active":""}" data-mode="manual" type="button">Choisir une actualité</button>
      </div>
      <div class="article-picker" ${f.featuredArticleMode==="manual"?"":"hidden"}>
        ${state.articles.length ? state.articles.map(a=>`
          <button class="article-option ${String(f.featuredArticleId)===String(a.id)?"active":""}" data-article="${esc(a.id)}" type="button">
            <span><small>${esc(a.tag||"Actualité")}</small><strong>${esc(a.title||"Sans titre")}</strong></span>
            <span class="check">${String(f.featuredArticleId)===String(a.id)?"✓":""}</span>
          </button>`).join("") :
          `<div class="derived-note">Aucune actualité disponible pour le moment.</div>`}
      </div>
    </section>

    <section class="section">
      <span class="field-label">Avancement</span>
      <div class="toggle-card">
        <div class="toggle-copy">
          <strong>Afficher les jalons du projet</strong>
          <span>La Homepage reprendra automatiquement le jalon courant et le prochain depuis « Le projet ».</span>
        </div>
        <button class="switch ${f.showMilestones?"on":""}" id="milestonesToggle" type="button" role="switch" aria-checked="${f.showMilestones}"></button>
      </div>
      <div class="derived-note">Les jalons ne sont jamais ressaisis ici. Ils restent édités dans « Le projet ».</div>
    </section>

    <section class="section">
      <span class="field-label">Questions</span>
      <div class="toggle-card">
        <div class="toggle-copy">
          <strong>Inviter les collaborateurs à poser une question</strong>
          <span>Affiche un point d’entrée vers les questions du projet.</span>
        </div>
        <button class="switch ${f.showAskPrompt?"on":""}" id="askToggle" type="button" role="switch" aria-checked="${f.showAskPrompt}"></button>
      </div>
      <div class="subfield" ${f.showAskPrompt?"":"hidden"}>
        <div class="edit prompt-edit" contenteditable="true" data-field="askPrompt" data-placeholder="Écrivez l’invitation…">${esc(f.askPrompt||"")}</div>
        <div class="hint">Exemple : « Une question sur le projet ? »</div>
      </div>
    </section>
  `;
  wireEditor();
}

function wirePlain(el,key,{singleLine=false}={}){
  if(!el)return;
  el.addEventListener("input",()=>{syncDom();markDirty()});
  el.addEventListener("keydown",e=>{if(singleLine&&e.key==="Enter")e.preventDefault()});
  el.addEventListener("paste",e=>{
    e.preventDefault();
    let t=(e.clipboardData||window.clipboardData).getData("text/plain");
    if(singleLine)t=t.replace(/\n+/g," ");
    document.execCommand("insertText",false,t);
  });
}

function syncDom(){
  const message=editor.querySelector('[data-field="message"]');
  const ask=editor.querySelector('[data-field="askPrompt"]');
  if(message)state.fields.message=message.textContent||"";
  if(ask)state.fields.askPrompt=(ask.textContent||"").replace(/\n+/g," ");
}

function wireEditor(){
  wirePlain(editor.querySelector('[data-field="message"]'),"message");
  wirePlain(editor.querySelector('[data-field="askPrompt"]'),"askPrompt",{singleLine:true});

  editor.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    syncDom();
    state.fields.featuredArticleMode=b.dataset.mode;
    if(b.dataset.mode==="latest")state.fields.featuredArticleId=null;
    markDirty();renderEditor();
  });

  editor.querySelectorAll("[data-article]").forEach(b=>b.onclick=()=>{
    syncDom();
    state.fields.featuredArticleMode="manual";
    state.fields.featuredArticleId=b.dataset.article;
    markDirty();renderEditor();
  });

  document.getElementById("milestonesToggle").onclick=()=>{
    syncDom();state.fields.showMilestones=!state.fields.showMilestones;markDirty();renderEditor();
  };
  document.getElementById("askToggle").onclick=()=>{
    syncDom();state.fields.showAskPrompt=!state.fields.showAskPrompt;markDirty();renderEditor();
  };
}

function markDirty(){
  state.save="dirty";state.unpublished=true;renderCommand();
  clearTimeout(state.timer);
  state.timer=setTimeout(queueSave,800);
}

async function queueSave(){
  if(state.inflight){state.queued=true;return}
  state.inflight=true;state.save="saving";renderCommand();syncDom();

  // IMPORTANT: target backend remains full-resource replacement.
  // Once the backend delta exists, ALWAYS send every Homepage field.
  const fullFields={
    message:state.fields.message||"",
    featuredArticleMode:state.fields.featuredArticleMode||"latest",
    featuredArticleId:state.fields.featuredArticleMode==="manual" ? (state.fields.featuredArticleId||null) : null,
    showMilestones:!!state.fields.showMilestones,
    showAskPrompt:!!state.fields.showAskPrompt,
    askPrompt:state.fields.askPrompt||""
  };

  try{
    const body={fields:fullFields};
    if(state.version!==null&&state.version!==undefined)body.version=state.version;

    const updated=await api(`/api/projects/${encodeURIComponent(projectId)}/studio/section-content/homepage`,{
      method:"PATCH",
      body:JSON.stringify(body)
    });

    // Adopt lock metadata only. Never overwrite newer local composition from a stale response.
    state.version=updated.version;
    state.updatedAt=updated.updatedAt;
    state.save="saved";renderCommand();
  }catch(e){
    state.save=e.status===409?"conflict":"error";state.error=e;renderCommand();
  }finally{
    state.inflight=false;
    if(state.queued){state.queued=false;queueMicrotask(queueSave)}
  }
}

function setCommand(html){
  commandState.innerHTML=html;
  commandState.querySelector('[data-cmd="reload"]')?.addEventListener("click",hydrate);
  commandState.querySelector('[data-cmd="retry"]')?.addEventListener("click",queueSave);
  commandState.querySelector('[data-cmd="publish"]')?.addEventListener("click",doPublish);
  commandState.querySelector('[data-cmd="close"]')?.addEventListener("click",renderCommand);
}
async function doPublish(){
  setCommand('<span class="command-message">Publication…</span>');
  let res,data;
  try{res=await fetch(`/api/projects/${projectId}/publications`,{method:"POST",headers:devHeaders()});data=await res.json().catch(()=>({}))}
  catch(e){setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Connexion impossible. Le brouillon reste enregistré.</span><button class="command-button" data-cmd="close" type="button">Fermer</button>');return}
  if(res.status===201){
    state.unpublished=false;
    state.publishedUrl=`/public/projects/${projectId}`;
    const warn=(data.warnings||[]).map(w=>`<br><span class="command-message"><span class="state-dot state-dot-warning"></span>${esc(w.message)}</span>`).join("");
    setCommand(`<span class="command-message"><span class="state-dot state-dot-success"></span><strong>Publication n°${data.revision}</strong> publiée.</span>${warn}<a class="command-link" href="${esc(state.publishedUrl)}" target="_blank" rel="noopener">Voir le site publié</a><button class="command-button" data-cmd="close" type="button">Fermer</button>`);
    return;
  }
  if(res.status===422){setCommand(`<span class="command-message"><span class="state-dot state-dot-error"></span>Compilation impossible : ${esc(data.failureDetail||"erreur inconnue")}. Le brouillon reste enregistré.</span><button class="command-button" data-cmd="close" type="button">Fermer</button>`);return}
  if(res.status===403){setCommand(`<span class="command-message"><span class="state-dot state-dot-error"></span>${esc(data.error?.message||"Cette action nécessite une capability que vous n'avez pas.")}</span><button class="command-button" data-cmd="close" type="button">Fermer</button>`);return}
  setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Publication impossible pour le moment. Le brouillon reste enregistré.</span><button class="command-button" data-cmd="close" type="button">Fermer</button>');
}
function renderCommand(){
  if(state.commandLocked)return;
  if(state.load==="loading")return setCommand('<span class="command-message">Chargement…</span>');
  if(state.save==="dirty"||state.save==="saving")return setCommand('<span class="command-message">Enregistrement…</span>');
  if(state.save==="conflict")return setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span><strong>La Homepage a changé ailleurs.</strong></span><button class="command-button primary" data-cmd="reload" type="button">Recharger</button>');
  if(state.save==="error")return setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Impossible d’enregistrer.</span><button class="command-button primary" data-cmd="retry" type="button">Réessayer</button>');
  if(state.unpublished&&hasCap("publication.publish"))return setCommand('<span class="command-message"><span class="state-dot state-dot-warning"></span>Tout est enregistré</span><button class="command-button primary" data-cmd="publish" type="button">Publier</button>');
  return setCommand(`<span class="command-message"><span class="state-dot state-dot-success"></span><strong>Homepage</strong> · Tout est enregistré</span>${state.publishedUrl?` <a class="command-link" href="${esc(state.publishedUrl)}" target="_blank" rel="noopener">Voir le site publié</a>`:""}`);
}

commandLayer.addEventListener("focusin",()=>state.commandLocked=true);
commandLayer.addEventListener("focusout",e=>{
  if(commandLayer.contains(e.relatedTarget))return;
  state.commandLocked=false;renderCommand();
});

function normalizeHomepage(home){
  const src=home?.fields||{};
  return {
    message:src.message??"",
    featuredArticleMode:src.featuredArticleMode==="manual"?"manual":"latest",
    featuredArticleId:src.featuredArticleId??null,
    showMilestones:src.showMilestones!==false,
    showAskPrompt:src.showAskPrompt!==false,
    askPrompt:src.askPrompt??""
  };
}

async function hydrate(){
  state.load="loading";state.error=null;renderEditor();renderCommand();
  try{
    const [ctx,me,home,articles]=await Promise.all([
      api(`/api/projects/${encodeURIComponent(projectId)}/context`),
      api("/api/me"),
      api(`/api/projects/${encodeURIComponent(projectId)}/studio/section-content/homepage`),
      api(`/api/projects/${encodeURIComponent(projectId)}/studio/articles`)
    ]);

    state.context=ctx;state.me=me;
    if(!hasCap("content.edit"))throw Object.assign(new Error("Forbidden"),{status:403});

    document.getElementById("brandProject").textContent=ctx.project?.name||"Projet";
    document.getElementById("avatarBtn").textContent=(me.displayName||"SU").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();

    state.fields=normalizeHomepage(home);
    state.version=home?.version??null;
    state.updatedAt=home?.updatedAt??null;
    state.articles=Array.isArray(articles)?articles:[];
    try{const pub=await api(`/api/projects/${encodeURIComponent(projectId)}/publications/active`);state.publishedUrl=pub?`/public/projects/${projectId}`:null}catch(e){state.publishedUrl=null}
    state.load="ready";state.save="saved";
    renderEditor();renderCommand();
  }catch(e){
    state.load="error";state.save="error";state.error=e;renderEditor();renderCommand();
  }
}

document.getElementById("projectLink").onclick=()=>location.assign(preserveDev(`/projects/${encodeURIComponent(projectId)}`));
const STUDIO_DOMAIN_PATHS={homepage:"",project:"project",spaces:"spaces",news:"news",ambassadors:"ambassadors",questions:""};
document.querySelectorAll(".nav-item").forEach(btn=>btn.addEventListener("click",()=>{
  if(btn.dataset.domain==="homepage")return;
  const seg=STUDIO_DOMAIN_PATHS[btn.dataset.domain];
  location.assign(preserveDev(`/projects/${projectId}/studio${seg?"/"+seg:""}`));
}));

hydrate();
</script>
</body>
</html>
