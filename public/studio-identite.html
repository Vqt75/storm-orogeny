<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Storm Studio — Identité · Orogeny</title><link rel="stylesheet" href="/fonts/roboto.css">
<style>
:root{--c:#f6f6f3;--i:#111;--m:#77777c;--q:#a2a2a7;--l:rgba(17,17,17,.08);--g:rgba(247,247,244,.5)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--c);color:var(--i);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.shell{padding:22px 28px 150px}.top{z-index:20;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border-radius:20px;background:rgba(255,255,255,.42);backdrop-filter:blur(24px);box-shadow:0 10px 34px rgba(17,17,17,.07)}button{font:inherit;color:inherit;cursor:pointer}.brand{display:flex;gap:10px;font-size:19px;font-weight:720}.brand span{color:var(--m);font-weight:560}.avatar{width:38px;height:38px;border:0;border-radius:12px;background:#111;color:#fff;font-size:12px}.project{border:0;background:transparent}.acts{display:flex;gap:6px;align-items:center}main{width:min(1320px,100%);margin:auto;padding-top:84px}.grid{display:grid;grid-template-columns:190px minmax(0,940px);gap:58px}nav{padding:7px;border-radius:22px;background:rgba(247,247,244,.5)}nav button{width:100%;min-height:43px;border:0;border-radius:15px;background:transparent;text-align:left;padding:0 13px;color:var(--m);font-size:13px;font-weight:650}nav button.active{background:#fff;color:#111}.eyebrow{margin:0 0 13px;color:var(--m);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(54px,6.2vw,88px);line-height:.9;letter-spacing:-.064em;font-weight:630}.lead{max-width:690px;margin:19px 0 34px;color:var(--m);font-size:15px;line-height:1.55}.stack{display:grid;gap:16px}.panel{border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 14px 38px rgba(17,17,17,.045);overflow:hidden}.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--l)}.panel-head h2{margin:0;font-size:18px;letter-spacing:-.02em}.panel-body{padding:22px 24px 24px}.logo-row{display:flex;gap:18px;align-items:center}.logo-box{width:72px;height:72px;border-radius:18px;background:#f1f1ee;border:1px solid var(--l);display:grid;place-items:center;overflow:hidden;font-size:20px;font-weight:800;flex:0 0 auto}.logo-box img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid rgba(17,17,17,.14);background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:720;cursor:pointer;display:inline-flex;align-items:center}.action:hover{background:#f6f6f4}.action.danger{color:#c23a2e}.file{display:none}.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.color-field{border:1px solid var(--l);border-radius:16px;background:#fafaf8;padding:14px;display:flex;align-items:center;gap:10px}.color-field input[type="color"]{width:36px;height:36px;padding:0;border:0;background:transparent;flex:0 0 auto}.color-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);font-weight:760;margin-bottom:6px}.hex{border:0;outline:0;background:transparent;width:100%;color:var(--i);font-size:14px;font-weight:700}.type-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.type-sample{border:1px solid var(--l);border-radius:16px;background:#fafaf8;padding:16px}.type-meta{font-size:11px;color:var(--m);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}.type-name{font-size:15px;font-weight:750;margin-bottom:6px}.type-display{font-size:24px;letter-spacing:-.03em;line-height:1.2}.type-glyphs{margin-top:8px;color:var(--m);font-size:11px;line-height:1.4}.secondary-block{margin-top:24px;padding-top:22px;border-top:1px solid var(--l)}.secondary-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.secondary-copy{color:var(--m);font-size:12px;margin-top:3px}.secondary-editor{margin-top:16px}.note{margin-top:14px;padding:12px 14px;border-radius:15px;background:rgba(17,17,17,.035);color:var(--m);font-size:11px;line-height:1.5}.cmd{position:fixed;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,calc(100vw - 28px));min-height:58px;padding:6px;border-radius:20px;background:var(--g);backdrop-filter:blur(28px);box-shadow:0 18px 54px rgba(17,17,17,.16)}.cmdin{min-height:46px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px}.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}.state-dot-success{background:#1f8a52}.state-dot-warning{background:#b57a12}.state-dot-error{background:#c23a2e}.cb{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:#111;color:#fff}
@media(max-width:900px){.shell{padding:14px 14px 140px}.top{top:10px}.brand span,.project{display:none}main{padding-top:66px}.grid{grid-template-columns:1fr;gap:30px}nav{position:relative;top:auto;display:flex;gap:4px;overflow:auto}nav button{width:auto;flex:0 0 auto}.panel-body{padding:18px}.color-grid,.type-row{grid-template-columns:1fr}.cmd{bottom:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body><div class="shell"><header class="top"><div class="brand"><strong>Storm</strong><span id="brandProject">Projet</span></div><div class="acts"><button class="project" id="projectLink">Projet</button><button class="avatar" id="avatarBtn">VC</button></div></header><main><div class="grid"><nav aria-label="Studio"><button data-domain="homepage">Homepage</button><button data-domain="project">Le projet</button><button data-domain="spaces">Espaces</button><button data-domain="news">Actualités</button><button data-domain="ambassadors">Ambassadeurs</button><button data-domain="questions">Questions</button><button class="active" data-domain="identity">Identité</button></nav><section><p class="eyebrow">Studio</p><h1>Identité</h1><p class="lead">Définissez le logo, les couleurs et la police du projet — ce que verront les visiteurs sur le site publié.</p><div class="stack" id="stack"></div></section></div></main></div><div class="cmd" id="commandLayer"><div class="cmdin" id="commandState" aria-live="polite"></div></div><input id="logoInput" class="file" type="file" accept="image/png,image/jpeg"><input id="fontPrimaryInput" class="file" type="file" accept=".woff2,.woff,.ttf,.otf"><input id="fontSecondaryInput" class="file" type="file" accept=".woff2,.woff,.ttf,.otf">
<script>
// STUDIO — IDENTITÉ (logo, couleurs, police réelle).
// Modèle cible strict : 1 police = partout ; 2 polices = principale +
// rôle secondaire. La police principale est obligatoire (aucune route
// de suppression n'existe pour elle) ; retirer la secondaire revient
// immédiatement au régime "principale partout" dès la prochaine
// publication (voir compileBranding, src/domain/publication/compiler.js).
//
// Le fichier de police est réellement envoyé au serveur (POST multipart)
// — jamais seulement son nom. L'aperçu instantané via FontFace (API
// navigateur) sert uniquement de retour visuel immédiat pendant que
// l'upload réel a lieu en tâche de fond ; ce n'est plus, comme avant
// cette passe, le SEUL endroit où le fichier existe.
const state={context:null,me:null,identity:null,load:"loading",save:"saved",unpublished:false,publishedUrl:null,colorTimer:null};
const stack=document.getElementById("stack"),commandState=document.getElementById("commandState");
const logoInput=document.getElementById("logoInput"),fontPrimaryInput=document.getElementById("fontPrimaryInput"),fontSecondaryInput=document.getElementById("fontSecondaryInput");
const projectId=(()=>{const m=location.pathname.match(/^\/projects\/([^/]+)\/studio\/identity\/?$/);return m?decodeURIComponent(m[1]):""})();
function devHeaders(){const d=new URLSearchParams(location.search).get("devUser");return d?{"X-Storm-Dev-User":d}:{}}
function preserve(u){const d=new URLSearchParams(location.search).get("devUser");return d?u+(u.includes("?")?"&":"?")+"devUser="+encodeURIComponent(d):u}
function esc(v=""){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function has(c){return state.context?.membership?.capabilities?.includes(c)}
async function api(url,opt={}){const h={Accept:"application/json",...devHeaders(),...(opt.headers||{})};if(opt.body&&!(opt.body instanceof FormData))h["Content-Type"]="application/json";const r=await fetch(url,{...opt,credentials:"same-origin",headers:h});const t=r.headers.get("content-type")||"";const b=r.status===204?null:(t.includes("application/json")?await r.json():await r.text());if(!r.ok){const e=new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);e.status=r.status;throw e}return b}
function cmd(h){commandState.innerHTML=h;commandState.querySelector('[data-reload]')?.addEventListener("click",hydrate);commandState.querySelector('[data-cmd="publish"]')?.addEventListener("click",doPublish);commandState.querySelector('[data-cmd="close"]')?.addEventListener("click",renderCmd)}
async function doPublish(){
  cmd("Publication…");
  let res,data;
  try{res=await fetch(`/api/projects/${projectId}/publications`,{method:"POST",headers:devHeaders()});data=await res.json().catch(()=>({}))}
  catch(e){cmd('<span class="state-dot state-dot-error"></span>Connexion impossible. Le brouillon reste enregistré. <button class="cb" data-cmd="close">Fermer</button>');return}
  if(res.status===201){
    state.unpublished=false;
    state.publishedUrl=`/public/projects/${projectId}`;
    const warn=(data.warnings||[]).map(w=>`<br><span class="state-dot state-dot-warning"></span>${esc(w.message)}`).join("");
    cmd(`<span class="state-dot state-dot-success"></span><strong>Publication n°${data.revision}</strong> publiée.${warn} <a href="${esc(state.publishedUrl)}" target="_blank" rel="noopener" class="cb" style="text-decoration:none;display:inline-flex;align-items:center">Voir le site publié</a> <button class="cb" data-cmd="close">Fermer</button>`);
    return;
  }
  if(res.status===422){cmd(`<span class="state-dot state-dot-error"></span>Compilation impossible : ${esc(data.failureDetail||"erreur inconnue")}. Le brouillon reste enregistré. <button class="cb" data-cmd="close">Fermer</button>`);return}
  if(res.status===403){cmd(`<span class="state-dot state-dot-error"></span>${esc(data.error?.message||"Cette action nécessite une capability que vous n'avez pas.")} <button class="cb" data-cmd="close">Fermer</button>`);return}
  cmd('<span class="state-dot state-dot-error"></span>Publication impossible pour le moment. Le brouillon reste enregistré. <button class="cb" data-cmd="close">Fermer</button>');
}
function renderCmd(){
  if(state.load==="loading")return cmd("Chargement…");
  if(state.save==="saving")return cmd("Enregistrement…");
  if(state.save==="conflict")return cmd('<span class="state-dot state-dot-error"></span><strong>L\u2019identité a changé ailleurs.</strong><button class="cb" data-reload>Recharger</button>');
  if(state.save==="error")return cmd('<span class="state-dot state-dot-error"></span>Impossible d\u2019enregistrer.');
  if(state.unpublished&&has("publication.publish"))return cmd('<span class="state-dot state-dot-warning"></span>Tout est enregistré <button class="cb" data-cmd="publish">Publier</button>');
  cmd(`<span class="state-dot state-dot-success"></span><strong>Identité</strong> · Tout est enregistré${state.publishedUrl?` <a href="${esc(state.publishedUrl)}" target="_blank" rel="noopener" style="margin-left:8px">Voir le site publié</a>`:""}`);
}

function initials(name){return String(name||"P").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"P"}

function render(){
  const id=state.identity||{};
  const projectName=state.context?.project?.name||"Projet";
  stack.innerHTML=`
    <article class="panel">
      <div class="panel-head"><h2>Logo</h2></div>
      <div class="panel-body">
        <div class="logo-row">
          <div class="logo-box" id="logoBox">${id.logoAssetId?`<img src="/api/assets/${esc(id.logoAssetId)}" alt="">`:esc(initials(projectName))}</div>
          <div class="actions">
            <button class="action" id="replaceLogo" type="button">Remplacer</button>
            ${id.logoAssetId?'<button class="action danger" id="removeLogo" type="button">Retirer</button>':""}
          </div>
        </div>
      </div>
    </article>

    <article class="panel">
      <div class="panel-head"><h2>Couleurs</h2></div>
      <div class="panel-body">
        <div class="color-grid">
          <div class="color-field">
            <input id="primaryPicker" type="color" value="${esc(id.primaryColor||"#1E1D1E")}">
            <div style="flex:1"><div class="color-label">Principale</div><input id="primaryHex" class="hex" value="${esc((id.primaryColor||"#1E1D1E").toUpperCase())}"></div>
          </div>
          <div class="color-field">
            <input id="secondaryPicker" type="color" value="${esc(id.secondaryColor||id.primaryColor||"#1E1D1E")}">
            <div style="flex:1"><div class="color-label">Secondaire</div><input id="secondaryHex" class="hex" value="${esc((id.secondaryColor||id.primaryColor||"#1E1D1E").toUpperCase())}"></div>
          </div>
        </div>
      </div>
    </article>

    <article class="panel">
      <div class="panel-head"><h2>Typographie</h2></div>
      <div class="panel-body">
        <div class="type-row">
          <div class="type-sample">
            <div class="type-meta">Police principale</div>
            <div class="type-name" id="fontPrimaryName">${esc(id.fontPrimary||"Aucune police importée")}</div>
            <div class="type-display" id="fontPrimarySample" style="${id.fontPrimary?`font-family:'${esc(id.fontPrimary)}',sans-serif`:""}">${esc(projectName)}</div>
            <div class="type-glyphs">Aa Bb Cc · 0123456789</div>
          </div>
          <div><button class="action" id="replaceFontPrimary" type="button">${id.fontPrimaryAssetId?"Remplacer":"Importer"}</button></div>
        </div>
        <p class="note" id="fontPrimaryNote" hidden></p>

        <div class="secondary-block">
          <div class="secondary-head">
            <div>
              <div class="type-meta">Police secondaire</div>
              <div class="secondary-copy">${id.fontSecondaryAssetId?esc(id.fontSecondary||""):"Même police que la principale — utilisée partout tant qu\u2019aucune secondaire n\u2019est importée."}</div>
            </div>
            <div class="actions">
              <button class="action" id="replaceFontSecondary" type="button">${id.fontSecondaryAssetId?"Remplacer":"Utiliser une autre police"}</button>
              ${id.fontSecondaryAssetId?'<button class="action danger" id="removeFontSecondary" type="button">Retirer</button>':""}
            </div>
          </div>
          ${id.fontSecondaryAssetId?`
          <div class="type-row secondary-editor">
            <div class="type-sample">
              <div class="type-meta">Aperçu du rôle secondaire</div>
              <div class="type-display" style="font-family:'${esc(id.fontSecondary||"")}',sans-serif">Septembre 2026</div>
              <div class="type-glyphs">Utilisée pour les éléments éditoriaux secondaires d\u2019Ivory (dates, jalons).</div>
            </div>
          </div>` : ""}
        </div>
      </div>
    </article>
  `;

  document.getElementById("replaceLogo").onclick=()=>{logoInput.value="";logoInput.click()};
  document.getElementById("removeLogo")?.addEventListener("click",removeLogo);
  document.getElementById("replaceFontPrimary").onclick=()=>{fontPrimaryInput.value="";fontPrimaryInput.click()};
  document.getElementById("replaceFontSecondary").onclick=()=>{fontSecondaryInput.value="";fontSecondaryInput.click()};
  document.getElementById("removeFontSecondary")?.addEventListener("click",removeFontSecondary);

  const pp=document.getElementById("primaryPicker"),ph=document.getElementById("primaryHex");
  const sp=document.getElementById("secondaryPicker"),sh=document.getElementById("secondaryHex");
  const onColorChange=()=>{
    if(/^#[0-9a-fA-F]{6}$/.test(ph.value))pp.value=ph.value;
    if(/^#[0-9a-fA-F]{6}$/.test(sh.value))sp.value=sh.value;
    ph.value=pp.value.toUpperCase();sh.value=sp.value.toUpperCase();
    queueColorSave(pp.value,sp.value);
  };
  pp.addEventListener("input",()=>{ph.value=pp.value.toUpperCase();queueColorSave(pp.value,sp.value)});
  sp.addEventListener("input",()=>{sh.value=sp.value.toUpperCase();queueColorSave(pp.value,sp.value)});
  ph.addEventListener("change",onColorChange);
  sh.addEventListener("change",onColorChange);
}

function queueColorSave(primaryColor,secondaryColor){
  state.save="saving";state.unpublished=true;renderCmd();
  clearTimeout(state.colorTimer);
  state.colorTimer=setTimeout(()=>saveColors(primaryColor,secondaryColor),700);
}
async function saveColors(primaryColor,secondaryColor){
  try{
    const updated=await api(`/api/projects/${projectId}/identity`,{method:"PATCH",body:JSON.stringify({primaryColor,secondaryColor,version:state.identity.version})});
    state.identity.primaryColor=primaryColor;state.identity.secondaryColor=secondaryColor;state.identity.version=updated.version;
    state.save="saved";renderCmd();
  }catch(e){state.save=e.status===409?"conflict":"error";renderCmd()}
}

logoInput.onchange=async()=>{
  const file=logoInput.files?.[0];if(!file)return;
  const fd=new FormData();fd.append("logo",file);
  try{await api(`/api/projects/${projectId}/logo`,{method:"POST",body:fd});state.unpublished=true;await hydrate()}
  catch(e){state.save="error";renderCmd()}
};
async function removeLogo(){
  // Aucune route de suppression du logo n'existe (hors scope de cette
  // passe, jamais construite avant) — remplacer par un nouveau fichier
  // reste le seul chemin. On ne construit pas de route factice ici.
  state.save="error";renderCmd();
}

fontPrimaryInput.onchange=async()=>{
  const file=fontPrimaryInput.files?.[0];if(!file)return;
  await previewFontLocally(file,"fontPrimarySample","fontPrimaryName");
  const fd=new FormData();fd.append("font",file);
  try{await api(`/api/projects/${projectId}/identity/fonts/primary`,{method:"POST",body:fd});state.unpublished=true;await hydrate()}
  catch(e){
    const note=document.getElementById("fontPrimaryNote");
    if(note){note.hidden=false;note.textContent="Ce fichier n\u2019a pas pu être importé (format non reconnu ou fichier corrompu).";}
  }
};
fontSecondaryInput.onchange=async()=>{
  const file=fontSecondaryInput.files?.[0];if(!file)return;
  const fd=new FormData();fd.append("font",file);
  try{await api(`/api/projects/${projectId}/identity/fonts/secondary`,{method:"POST",body:fd});state.unpublished=true;await hydrate()}
  catch(e){state.save="error";renderCmd()}
};
async function removeFontSecondary(){
  try{await api(`/api/projects/${projectId}/identity/fonts/secondary`,{method:"DELETE"});state.unpublished=true;await hydrate()}
  catch(e){state.save="error";renderCmd()}
}

// Aperçu instantané via l'API FontFace du navigateur -- retour visuel
// immédiat pendant que l'upload réel a lieu en tâche de fond (voir
// commentaire d'en-tête). Purement local, jamais un substitut à
// l'upload réel qui suit immédiatement cet appel.
async function previewFontLocally(file,sampleId,nameId){
  try{
    const family="StormIdentityPreview_"+Date.now();
    const face=new FontFace(family,await file.arrayBuffer());
    await face.load();document.fonts.add(face);
    const sample=document.getElementById(sampleId);
    if(sample)sample.style.fontFamily=`'${family}',sans-serif`;
    const nameEl=document.getElementById(nameId);
    if(nameEl)nameEl.textContent=file.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ");
  }catch(e){/* silencieux -- l'upload réel reste la source de vérité */}
}

async function hydrate(){
  state.load="loading";renderCmd();
  try{
    const[ctx,me]=await Promise.all([api(`/api/projects/${projectId}/context`),api("/api/me")]);
    state.context=ctx;state.me=me;
    if(!has("project.manage"))throw Object.assign(new Error("Forbidden"),{status:403});
    state.identity=ctx.identity||{primaryColor:null,secondaryColor:null,fontPrimary:null,fontSecondary:null,version:1};
    document.getElementById("brandProject").textContent=ctx.project?.name||"Projet";
    document.getElementById("avatarBtn").textContent=(me.displayName||"SU").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
    try{const pub=await api(`/api/projects/${projectId}/publications/active`);state.publishedUrl=pub?`/public/projects/${projectId}`:null}catch(e){state.publishedUrl=null}
    state.load="ready";state.save="saved";
    render();renderCmd();
  }catch(e){
    state.load="error";state.save="error";
    stack.innerHTML=e.status===403?'<p style="color:var(--m)">Vous n\u2019avez pas les droits nécessaires pour modifier l\u2019identité de ce projet.</p>':'<p style="color:var(--m)">Storm n\u2019arrive pas à ouvrir Identité.</p>';
    renderCmd();
  }
}
document.getElementById("projectLink").onclick=()=>location.assign(preserve(`/projects/${projectId}`));
const STUDIO_DOMAIN_PATHS={homepage:"homepage",project:"project",spaces:"spaces",news:"news",ambassadors:"ambassadors",questions:"",identity:""};
document.querySelectorAll("nav button[data-domain]").forEach(b=>b.onclick=()=>{
  if(b.dataset.domain==="identity")return;
  const seg=STUDIO_DOMAIN_PATHS[b.dataset.domain];
  location.assign(preserve(`/projects/${projectId}/studio${seg?"/"+seg:""}`));
});
hydrate();
</script></body></html>
