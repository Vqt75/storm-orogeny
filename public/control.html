<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Control — Orogeny V2</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{--canvas:#f6f6f3;--surface:#fff;--ink:#111;--graphite:#2f2f32;--muted:#77777b;--quiet:#96969a;--gold:#c2af7e;--green:#2c7a58;--amber:#9b6b19;--red:#a7372d;--line:rgba(17,17,17,.08);--ease:cubic-bezier(.22,1,.36,1);--shadow-soft:0 18px 50px rgba(17,17,17,.075);--radius-xl:30px}
*{box-sizing:border-box}html{background:var(--canvas)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 14% -12%,rgba(255,255,255,.98),transparent 35%),radial-gradient(circle at 92% 4%,rgba(194,175,126,.07),transparent 23%),var(--canvas);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit;color:inherit}[hidden]{display:none!important}button{border:0;cursor:pointer}
.shell{min-height:100vh;padding:22px 28px 132px}
.topbar{position:sticky;top:16px;z-index:30;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.36);backdrop-filter:blur(24px) saturate(175%) contrast(102%);-webkit-backdrop-filter:blur(24px) saturate(175%) contrast(102%);border-radius:20px;box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.78),inset 0 -1px 0 rgba(17,17,17,.04);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:720;letter-spacing:-.035em}.brand span{color:var(--muted);font-weight:560}
.top-actions{display:flex;align-items:center;gap:6px}.home-link{padding:9px 12px;border-radius:12px;background:transparent;font-size:13px;font-weight:670}.home-link:hover,.home-link:focus-visible{background:rgba(255,255,255,.52)}
.avatar-wrap{position:relative}.avatar-btn{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}
.account-popover{position:absolute;right:0;top:48px;width:250px;padding:9px;border-radius:18px;border:1px solid rgba(255,255,255,.64);background:rgba(249,249,247,.68);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 22px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.82);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.985);transform-origin:top right;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s}
.account-popover.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.account-head{padding:12px}.account-head strong{display:block;font-size:14px;margin-bottom:3px}.account-head span{display:block;color:var(--muted);font-size:12px}.account-action{width:100%;padding:10px 12px;border-radius:11px;background:transparent;text-align:left;font-size:13px}.account-action:hover{background:rgba(17,17,17,.045)}
.home-link:focus-visible,.avatar-btn:focus-visible,.account-action:focus-visible,.command-button:focus-visible{outline:3px solid rgba(17,17,17,.12);outline-offset:3px}
main{width:min(1240px,100%);margin:0 auto;padding-top:96px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-bottom:64px}.eyebrow{margin:0 0 14px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}
.detail-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:0;background:transparent;color:var(--muted);font-size:13px;font-weight:680}.detail-back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(56px,7vw,102px);line-height:.9;letter-spacing:-.067em;font-weight:630}.hero-copy{margin:20px 0 0;max-width:580px;color:var(--muted);font-size:16px;line-height:1.55}
.status-hero{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.stabilization{background:var(--amber)}.dot.archived{background:var(--quiet)}
.scope-mark{align-self:start;margin-top:14px;min-width:140px;padding:15px 17px 16px;border-radius:22px;background:rgba(17,17,17,.94);color:#f6f6f3;box-shadow:var(--shadow-soft)}.scope-mark small{display:block;color:rgba(246,246,243,.55);font-size:10px;font-weight:760;letter-spacing:.11em;text-transform:uppercase;margin-bottom:14px}.scope-mark strong{display:block;font-size:20px;letter-spacing:-.035em}
.section{margin-bottom:48px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px;padding:0 4px}.section-head h2{margin:0;font-size:24px;letter-spacing:-.04em;font-weight:690}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.section-count{color:var(--quiet);font-size:13px;font-weight:680}
.subhead{margin:30px 3px 12px;color:var(--quiet);font-size:11px;font-weight:780;letter-spacing:.10em;text-transform:uppercase}
.collection{display:grid;gap:10px}.cell{width:100%;border-radius:24px;background:rgba(255,255,255,.72);box-shadow:0 1px 0 rgba(255,255,255,.82) inset,0 10px 30px rgba(17,17,17,.035);text-align:left;border:1px solid transparent;transition:transform .2s var(--ease),border-color .2s ease,box-shadow .2s ease}.cell.clickable{cursor:pointer}.cell.clickable:hover{transform:translateY(-2px);border-color:rgba(17,17,17,.08);box-shadow:0 18px 38px rgba(17,17,17,.055)}
.project-cell{min-height:106px;padding:18px 20px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:18px;align-items:center}.project-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#111;color:#fff;font-size:18px;font-weight:760;overflow:hidden}.project-mark img{width:100%;height:100%;object-fit:cover}.project-name{display:block;margin:0 0 5px;font-size:19px;font-weight:690;letter-spacing:-.03em}.project-meta{display:block;color:var(--muted);font-size:12px}
.cell-right{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}.status-pill,.bundle-pill,.source-pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(17,17,17,.055);color:var(--graphite);font-size:11px;font-weight:700;white-space:nowrap}.status-pill.stabilization{background:rgba(155,107,25,.10);color:#755019}.status-pill.archived{color:var(--quiet)}.bundle-pill{background:rgba(194,175,126,.15);color:#5e5438}.source-pill{background:rgba(17,17,17,.035);color:var(--muted)}
.member-cell{min-height:92px;padding:16px 18px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center}.member-avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;font-weight:760}.member-name{display:block;margin:0 0 4px;font-size:16px;font-weight:680}.member-email{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.member-sub{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric-card{padding:22px;border-radius:24px;background:rgba(255,255,255,.68);min-height:122px}.metric-card strong{display:block;font-size:30px;letter-spacing:-.055em;margin-top:22px}.metric-card span{font-size:12px;color:var(--muted);font-weight:680}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info-card{padding:22px;border-radius:24px;background:rgba(255,255,255,.68)}.info-card small{display:block;color:var(--quiet);font-size:10px;font-weight:780;letter-spacing:.11em;text-transform:uppercase;margin-bottom:12px}.info-card strong{display:block;font-size:18px;letter-spacing:-.025em}.info-card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.access-source{padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.7);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}.access-source strong{display:block;font-size:15px;margin-bottom:4px}.access-source p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.source-actions{display:flex;gap:8px}.mini-action{padding:8px 11px;border-radius:11px;background:rgba(17,17,17,.045);font-size:11px;font-weight:700}.mini-action:hover{background:rgba(17,17,17,.075)}.mini-action.danger{color:var(--red);background:rgba(167,55,45,.07)}
.lifecycle-card{padding:24px;border-radius:26px;background:rgba(255,255,255,.72)}.lifecycle-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.lifecycle-top h3{margin:0;font-size:22px;letter-spacing:-.04em}.lifecycle-top p{margin:8px 0 0;max-width:620px;color:var(--muted);font-size:13px;line-height:1.55}.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.primary-action,.secondary-action,.danger-action{min-height:42px;padding:0 15px;border-radius:13px;font-size:12px;font-weight:720}.primary-action{background:#111;color:#fff}.secondary-action{background:rgba(17,17,17,.055)}.danger-action{background:rgba(167,55,45,.08);color:var(--red)}.danger-action:disabled{opacity:.5;cursor:not-allowed}.danger-zone{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.notice{padding:16px 18px;border-radius:18px;background:rgba(194,175,126,.11);color:#5f553a;font-size:12px;line-height:1.5}.notice strong{color:#443b25}
.provider-cell{padding:18px 20px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:15px;align-items:center}.provider-mark{width:44px;height:44px;border-radius:14px;background:#111;color:white;display:grid;place-items:center;font-weight:780;font-size:12px}.provider-cell strong{display:block;font-size:15px;margin-bottom:4px}.provider-cell p{margin:0;color:var(--muted);font-size:12px}
.empty-state,.error-state,.loading-state{min-height:200px;border-radius:28px;background:rgba(255,255,255,.48);display:flex;align-items:flex-end;padding:24px}.empty-state strong,.error-state strong{display:block;margin-bottom:7px;font-size:19px}.empty-state span,.error-state p{display:block;margin:0;max-width:480px;color:var(--muted);font-size:13px;line-height:1.5}
.skeleton-list{width:100%;display:grid;gap:10px}.skeleton-row{height:90px;border-radius:24px;background:linear-gradient(105deg,rgba(255,255,255,.36) 18%,rgba(255,255,255,.82) 38%,rgba(255,255,255,.36) 58%);background-size:220% 100%;animation:storm-skeleton 1.25s linear infinite}@keyframes storm-skeleton{to{background-position-x:-220%}}
.command-layer{position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);width:min(620px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.72);border-radius:20px;background:rgba(244,244,242,.48);backdrop-filter:blur(28px) saturate(190%) contrast(103%);-webkit-backdrop-filter:blur(28px) saturate(190%) contrast(103%);box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(17,17,17,.045)}.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.command-button{min-height:42px;padding:0 16px;border-radius:15px;background:transparent;font-size:13px;font-weight:690}.command-button.active{background:rgba(255,255,255,.78);box-shadow:0 7px 18px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.92)}.command-button.back{margin-right:auto}.command-message{padding:0 12px;text-align:center;font-size:13px;color:var(--graphite)}.command-message strong{color:var(--ink);font-weight:720}.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}.state-dot-success{background:#1f8a52}.state-dot-warning{background:#b57a12}.state-dot-error{background:#c23a2e}.command-retry{background:#111;color:#fff}
.modal-backdrop{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.18);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);padding:26px;border-radius:28px;background:#fdfdfb;box-shadow:0 28px 80px rgba(17,17,17,.25)}.modal h3{margin:0;font-size:26px;letter-spacing:-.045em}.modal p{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.confirm-input{width:100%;margin-top:16px;padding:12px 14px;border:1px solid rgba(17,17,17,.12);border-radius:13px;background:white;outline:0}.confirm-input:focus{border-color:#111}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.form-field{margin-top:14px}.form-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}.form-field select,.form-field input{width:100%;padding:11px 13px;border:1px solid rgba(17,17,17,.12);border-radius:12px;background:white}
.toast{position:fixed;z-index:90;left:50%;top:30px;transform:translate(-50%,-10px);padding:12px 16px;border-radius:14px;background:#111;color:white;font-size:12px;font-weight:680;opacity:0;visibility:hidden;transition:.2s var(--ease)}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(max-width:900px){.metric-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
@media(max-width:780px){.shell{padding:14px 14px 126px}.topbar{top:10px;height:58px;padding-left:15px}.brand span,.home-link{display:none}main{padding-top:72px}.hero{grid-template-columns:1fr;margin-bottom:48px}h1{font-size:clamp(50px,16vw,76px)}.scope-mark{display:none}.project-cell,.member-cell,.provider-cell{grid-template-columns:48px minmax(0,1fr)}.cell-right{grid-column:2;justify-self:start}.command-layer{bottom:12px}.lifecycle-top{display:block}.action-row{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><strong>Storm</strong><span>Control</span></div><div class="top-actions"><button class="home-link" id="homeLink" type="button">Storm Home</button><div class="avatar-wrap"><button class="avatar-btn" id="avatarBtn" type="button" aria-label="Compte" aria-expanded="false">VC</button><div class="account-popover" id="accountPopover"><div class="account-head"><strong id="accountName">Utilisateur Storm</strong><span id="accountOrg">Storm</span></div><button class="account-action" id="accountHome" type="button">Storm Home</button></div></div></div></header>
<main id="app"></main>
</div>
<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer"><div class="command-state" id="commandState" aria-live="polite"></div></div>
<div class="modal-backdrop" id="modalBackdrop" hidden></div>
<div class="toast" id="toast"></div>
<script>
const CAP={CONTROL:'control.access',VIEW_ALL:'projects.view_all',MEMBERS:'organization.members.manage',MANAGE_MEMBERSHIPS:'projects.manage_memberships',LIFECYCLE:'projects.manage_lifecycle',DELETE:'projects.delete_permanently',EXTERNAL:'organization.external_identity.manage'};
const app=document.getElementById('app'),commandState=document.getElementById('commandState'),commandLayer=document.getElementById('commandLayer'),toast=document.getElementById('toast'),modal=document.getElementById('modalBackdrop'),avatarBtn=document.getElementById('avatarBtn'),accountPopover=document.getElementById('accountPopover'),accountName=document.getElementById('accountName'),accountOrg=document.getElementById('accountOrg');

function devHeaders(){const d=new URLSearchParams(location.search).get('devUser');return d?{'X-Storm-Dev-User':d}:{}}
function homeUrl(){const d=new URLSearchParams(location.search).get('devUser');return d?`/?devUser=${encodeURIComponent(d)}`:'/'}
function initials(n){n=n||'Storm';return n.trim().split(/\s+/).slice(0,2).map(p=>p[0]?p[0].toUpperCase():'').join('')||'S'}
function esc(v){v=v||'';return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function has(me,c){return Array.isArray(me&&me.organization&&me.organization.capabilities)&&me.organization.capabilities.includes(c)}
function statusLabel(s){return ({active:'Actif',stabilization:'Stabilisation',archived:'Archivé'})[s]||s||'—'}
function statusClass(s){return s==='stabilization'?'stabilization':s==='archived'?'archived':''}
function pillStatus(s){return `<span class="status-pill ${statusClass(s)}">${esc(statusLabel(s))}</span>`}
function sourceLabel(s){
  if(s.sourceType==='external_group_mapping')return `Via ${esc(s.externalProvider||'un groupe')}`;
  return 'Accès direct';
}
function bundleLabel(b){return ({contributor:'Contributeur',editor:'Éditeur',pilot:'Pilote',project_admin:'Administrateur du projet',member:'Membre',organization_admin:'Administrateur de l’organisation'})[b]||b}
function invitationStatusLabel(s){return ({pending:'En attente',accepted:'Acceptée',revoked:'Révoquée',expired:'Expirée'})[s]||s}
async function getJson(url){const r=await fetch(url,{headers:Object.assign({Accept:'application/json'},devHeaders()),credentials:'same-origin'});if(!r.ok){const e=new Error(`HTTP ${r.status}`);e.status=r.status;throw e}return r.json()}
async function postJson(url,body){const r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},devHeaders()),credentials:'same-origin',body:body?JSON.stringify(body):undefined});let data=null;try{data=await r.json()}catch(_){}if(!r.ok){const e=new Error(`HTTP ${r.status}`);e.status=r.status;e.body=data;throw e}return data}
async function deleteReq(url){const r=await fetch(url,{method:'DELETE',headers:devHeaders(),credentials:'same-origin'});if(!r.ok){let data=null;try{data=await r.json()}catch(_){}const e=new Error(`HTTP ${r.status}`);e.status=r.status;e.body=data;throw e}return true}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function closeModal(){modal.hidden=true;modal.innerHTML=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)closeModal();else accountPopover.classList.remove('open')}});
avatarBtn.addEventListener('click',e=>{e.stopPropagation();const o=accountPopover.classList.toggle('open');avatarBtn.setAttribute('aria-expanded',String(o))});
document.addEventListener('click',e=>{if(!e.target.closest('.avatar-wrap')){accountPopover.classList.remove('open');avatarBtn.setAttribute('aria-expanded','false')}});
document.getElementById('homeLink').addEventListener('click',()=>location.assign(homeUrl()));
document.getElementById('accountHome').addEventListener('click',()=>location.assign(homeUrl()));

const state={me:null,view:'projects',detail:null,detailTab:'overview',commandLocked:false,
  projects:{status:'idle',data:[]}, members:{status:'idle',data:[]}, access:{status:'idle',data:null},
  detailAccess:{status:'idle',data:null}, memberAccess:{status:'idle',data:null}};

function loading(){return `<div class="loading-state"><div class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div></div>`}
function errState(noun){return `<div class="error-state" role="alert"><div><strong>Storm n’arrive pas à charger ${esc(noun)}.</strong><p>Votre organisation n’a pas été modifiée. Vous pouvez réessayer depuis la Command Layer.</p></div></div>`}
function emptyState(title,copy){return `<div class="empty-state"><div><strong>${esc(title)}</strong><span>${esc(copy)}</span></div></div>`}

function hero(title,copy,status){return `<section class="hero"><div>${state.detail?'<button class="detail-back" type="button" data-back>← Retour</button>':''}<p class="eyebrow">Storm Control</p><h1>${esc(title)}</h1><p class="hero-copy">${esc(copy)}</p>${status?`<div class="status-hero"><span class="dot ${statusClass(status)}"></span>${esc(statusLabel(status))}</div>`:''}</div>${!state.detail?`<div class="scope-mark"><small>Organisation</small><strong>${esc(state.me&&state.me.organization?state.me.organization.name:'—')}</strong></div>`:''}</section>`}

function projectCell(p){
  const logo=p.logoAssetId?`<img data-asset-id="${esc(p.logoAssetId)}" alt="">`:esc((p.name||'P')[0].toUpperCase());
  const bg=p.logoAssetId?'':(p.primaryColor||'#111');
  const meta=p.pendingInvitationsCount>0
    ? `${p.peopleCount} personne${p.peopleCount>1?'s':''} ${p.peopleCount>1?'ont':'a'} accès · ${p.pendingInvitationsCount} invitation${p.pendingInvitationsCount>1?'s':''} en attente`
    : `${p.peopleCount} personne${p.peopleCount>1?'s':''} ${p.peopleCount>1?'ont':'a'} accès`;
  return `<button class="cell clickable project-cell" type="button" data-project="${esc(p.id)}"><span class="project-mark" style="background:${esc(bg)}">${logo}</span><span><span class="project-name">${esc(p.name)}</span><span class="project-meta">${meta}</span></span><span class="cell-right">${pillStatus(p.status)}</span></button>`;
}

function renderProjects(){
  const x=state.projects;
  if(x.status==='loading'){app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+`<section class="section"><div class="section-head"><div><h2>Projets</h2><p>Les projets actifs et en stabilisation.</p></div></div>${loading()}</section>`;return}
  if(x.status==='error'){app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+`<section class="section">${errState('les projets')}</section>`;return}
  const current=x.data.filter(p=>p.status!=='archived'),archived=x.data.filter(p=>p.status==='archived');
  app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+
    `<section class="section"><div class="section-head"><div><h2>Projets</h2><p>Les projets actifs et en stabilisation.</p></div><span class="section-count">${current.length} projet${current.length>1?'s':''}</span></div>${current.length?`<div class="collection">${current.map(projectCell).join('')}</div>`:emptyState('Aucun projet actif.','Les projets rattachés à cette organisation apparaîtront ici.')}${archived.length?`<div class="subhead">Archivés</div><div class="collection">${archived.map(projectCell).join('')}</div>`:''}</section>`;
  loadAssetImages(app);
}

function renderProjectDetail(){
  const p=state.projects.data.find(x=>x.id===state.detail);
  if(!p){ state.detail=null; render(); return; }
  const tab=state.detailTab;
  let body='';
  const access=state.detailAccess;

  if(tab==='overview'){
    body=`<section class="section"><div class="metric-grid"><div class="metric-card"><span>Personnes</span><strong>${p.peopleCount}</strong></div><div class="metric-card"><span>Invitations en attente</span><strong>${p.pendingInvitationsCount}</strong></div><div class="metric-card"><span>Statut</span><strong style="font-size:20px">${esc(statusLabel(p.status))}</strong></div></div></section>
    <section class="section"><div class="section-head"><div><h2>Projet</h2><p>Repères essentiels de gouvernance.</p></div></div><div class="info-grid"><div class="info-card"><small>Créé le</small><strong>${new Date(p.createdAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</strong></div><div class="info-card"><small>Site collaborateur</small><strong>Ivory</strong><p>La disponibilité du site publié reste indépendante du lifecycle du projet -- archiver ce projet ne coupe jamais sa dernière publication.</p></div></div></section>`;
  } else if(tab==='access'){
    if(access.status==='loading'||access.status==='idle'){body=loading();}
    else if(access.status==='error'){body=errState('les accès du projet');}
    else{
      const a=access.data;
      body=`<section class="section"><div class="section-head"><div><h2>Accès</h2><p>Qui peut accéder à ${esc(p.name)}, avec quel niveau, et pourquoi.</p></div><span class="section-count">${a.peopleCount} personne${a.peopleCount>1?'s':''}</span></div>${a.people.length?`<div class="collection">${projectSourcesBody(a)}</div>`:emptyState('Personne n’a encore accès.','Invitez quelqu’un pour lui donner accès à ce projet.')}</section>
      <section class="section"><div class="section-head"><div><h2>Invitations</h2><p>Une invitation n’est pas encore un accès durable.</p></div><button class="secondary-action" type="button" data-invite>+ Inviter</button></div>${a.invitations.length?`<div class="collection">${a.invitations.map(i=>`<div class="cell member-cell"><span class="member-avatar">${esc(initials(i.email))}</span><span><span class="member-name">${esc(i.email)}</span><span class="member-sub">${esc(bundleLabel(i.permissionBundle))}</span></span><span class="cell-right"><span class="status-pill ${i.status==='pending'?'stabilization':i.status==='accepted'?'':'archived'}">${esc(invitationStatusLabel(i.status))}</span>${i.status==='pending'?`<button class="mini-action" type="button" data-revoke-invitation="${esc(p.id)}|${esc(i.id)}">Révoquer</button>`:''}</span></div>`).join('')}</div>`:emptyState('Aucune invitation en attente.','Les invitations envoyées apparaîtront ici.')}</section>`;
    }
  } else if(tab==='lifecycle'){
    const descr=p.status==='active'?'Le projet est en cours. Les équipes continuent à travailler selon leurs droits.':p.status==='stabilization'?'Le déploiement principal est terminé. Le projet reste vivant pour le suivi, Pilotage et le REX.':'Le projet est sorti du quotidien. Il reste gouvernable depuis Storm Control.';
    const actions=p.status==='active'
      ? `<button class="primary-action" type="button" data-lifecycle="stabilize">Passer en stabilisation</button><button class="secondary-action" type="button" data-lifecycle="archive">Archiver</button>`
      : p.status==='stabilization'
      ? `<button class="primary-action" type="button" data-lifecycle="reactivate">Reprendre le projet</button><button class="secondary-action" type="button" data-lifecycle="archive">Archiver</button>`
      : `<button class="primary-action" type="button" data-lifecycle="restore">Restaurer en ${p.previousStatus==='stabilization'?'Stabilisation':'Actif'}</button>`;
    body=`<section class="section"><div class="lifecycle-card"><div class="lifecycle-top"><div><h3>${esc(statusLabel(p.status))}</h3><p>${esc(descr)}</p></div>${pillStatus(p.status)}</div><div class="action-row">${actions}</div>${p.status==='archived'?`<div class="danger-zone"><div class="notice"><strong>Suppression définitive</strong><br>Cette action est distincte de l’archivage et nécessite une permission dédiée. Le mécanisme technique de purge/rétention relève du chantier séparé Storm Privacy &amp; Data Lifecycle -- non implémenté à ce stade.</div><div class="action-row"><button class="danger-action" type="button" data-delete-project ${has(state.me,CAP.DELETE)?'':'disabled title="Capability non accordée"'}>Supprimer définitivement</button></div></div>`:''}</div></section>`;
  }

  app.innerHTML=hero(`${p.name}.`,'Gouvernance du projet.',p.status)+body;
  loadAssetImages(app);
}

    <section class="section"><div class="section-head"><div><h2>Projets</h2><p>Niveaux effectifs et sources d’accès.</p></div></div>${projects.length?`<div class="collection">${projects.map(p=>{const dominant=p.sources.map(s=>s.permissionBundle).sort((a,b)=>order.indexOf(a)-order.indexOf(b))[0];return `<div class="cell member-cell"><span class="member-avatar" style="border-radius:16px">${esc((p.projectName||'P')[0].toUpperCase())}</span><span><span class="member-name">${esc(p.projectName)}</span><span class="member-sub">${esc(bundleLabel(dominant))}</span></span><span class="cell-right">${p.sources.map(s=>`<span class="source-pill">${esc(sourceLabel(s))}</span>`).join('')}</span></div>`}).join('')}</div>`:emptyState('Aucun accès projet actif.','Les projets auxquels cette personne a accès apparaîtront ici.')}</section>`;

function setCommand(html){commandState.innerHTML=html;wireCommand()}
function renderCommand(){
  if(state.commandLocked)return;
  if(state.detail && state.projects.data.some(p=>p.id===state.detail)){
    setCommand(`<button class="command-button back" type="button" data-back>← Projets</button>${['overview','access','lifecycle'].map(t=>`<button class="command-button ${state.detailTab===t?'active':''}" type="button" data-detail-tab="${t}">${t==='overview'?'Aperçu':t==='access'?'Accès':'Cycle de vie'}</button>`).join('')}`);
    return;
  }
  if(state.detail && state.members.data.some(m=>m.id===state.detail)){
    setCommand(`<button class="command-button back" type="button" data-back>← Membres</button><span class="command-message"><strong>Fiche membre</strong></span>`);
    return;
  }
  const views=[];
  if(has(state.me,CAP.VIEW_ALL))views.push('projects');
  if(has(state.me,CAP.MEMBERS))views.push('members');
  if(has(state.me,CAP.MANAGE_MEMBERSHIPS)||has(state.me,CAP.EXTERNAL))views.push('access');
  setCommand(views.map(v=>`<button class="command-button ${state.view===v?'active':''}" type="button" data-root="${v}">${v==='projects'?'Projets':v==='members'?'Membres':'Accès'}</button>`).join(''));
}
function wireCommand(){
  commandState.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>goRoot(b.dataset.root));
  const backBtn=commandState.querySelector('[data-back]');
  if(backBtn)backBtn.addEventListener('click',()=>goRoot(state.projects.data.some(p=>p.id===state.detail)?'projects':'members'));
  commandState.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.detailTab;state.commandLocked=false;if(state.detailTab==='access'&&state.detailAccess.status==='idle')loadDetailAccess();render()});
}
commandLayer.addEventListener('focusin',()=>state.commandLocked=true);
commandLayer.addEventListener('focusout',e=>{if(commandLayer.contains(e.relatedTarget))return;state.commandLocked=false;renderCommand()});

async function loadProjects(){state.projects=Object.assign({},state.projects,{status:'loading'});render();try{const d=await getJson('/api/control/projects');state.projects={status:'ready',data:d}}catch(e){state.projects={status:'error',data:[]}}render()}
async function loadMembers(){state.members=Object.assign({},state.members,{status:'loading'});render();try{const d=await getJson('/api/control/members');state.members={status:'ready',data:d}}catch(e){state.members={status:'error',data:[]}}render()}
async function loadAccess(){state.access={status:'loading',data:null};render();try{const invitations=await getJson('/api/control/invitations');const mappings=await getJson('/api/control/external-group-mappings');state.access={status:'ready',data:{invitations:invitations,mappings:mappings}}}catch(e){state.access={status:'error',data:null}}render()}
async function loadDetailAccess(){state.detailAccess={status:'loading',data:null};render();try{const d=await getJson(`/api/control/projects/${state.detail}/access`);state.detailAccess={status:'ready',data:d}}catch(e){state.detailAccess={status:'error',data:null}}render()}
async function loadMemberAccess(){state.memberAccess={status:'loading',data:null};render();try{const d=await getJson(`/api/control/members/${state.detail}/access`);state.memberAccess={status:'ready',data:d}}catch(e){state.memberAccess={status:'error',data:null}}render()}

async function loadAssetImages(root){
  const imgs=root.querySelectorAll('img[data-asset-id]:not([data-loaded])');
  for(const img of imgs){
    img.setAttribute('data-loaded','1');
    const assetId=img.dataset.assetId;
    try{
      const res=await fetch(`/api/assets/${encodeURIComponent(assetId)}`,{headers:devHeaders(),credentials:'same-origin'});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const blob=await res.blob();
      img.src=URL.createObjectURL(blob);
    }catch(e){ img.remove(); }
  }
}

function render(){
  if(state.detail && state.projects.data.some(p=>p.id===state.detail))renderProjectDetail();
  else if(state.detail && state.members.data.some(m=>m.id===state.detail))renderMemberDetail();
  else if(state.view==='members')renderMembers();
  else if(state.view==='access')renderAccess();
  else renderProjects();
  renderCommand();
  wire();
}
function goRoot(view){
  state.view=view; state.detail=null; state.detailTab='overview'; state.commandLocked=false;
  // Démarrer le chargement AVANT le premier render() -- loadX() pose
  // status='loading' de façon synchrone avant son premier await, donc
  // le render() qui suit ne voit jamais status='idle' (data=null non
  // encore géré défensivement, voir aussi le garde-fou ajouté dans
  // renderAccess() -- ceinture et bretelles après un vrai bug trouvé
  // ici : l'ordre inverse provoquait une exception silencieuse sur
  // "Cannot read properties of null").
  if(view==='projects'&&state.projects.status==='idle')loadProjects();
  else if(view==='members'&&state.members.status==='idle')loadMembers();
  else if(view==='access'&&state.access.status==='idle')loadAccess();
  else render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function wire(){
  document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.project;state.detailTab='overview';state.detailAccess={status:'idle',data:null};render();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.member;state.memberAccess={status:'idle',data:null};loadMemberAccess();window.scrollTo({top:0,behavior:'smooth'})});
  const backBtn=document.querySelector('[data-back]');
  if(backBtn)backBtn.addEventListener('click',()=>goRoot(state.projects.data.some(p=>p.id===state.detail)?'projects':'members'));

  document.querySelectorAll('[data-lifecycle]').forEach(b=>b.onclick=()=>confirmLifecycle(b.dataset.lifecycle));
  const delBtn=document.querySelector('[data-delete-project]');
  if(delBtn)delBtn.addEventListener('click',openDeleteModal);
  const inviteBtn=document.querySelector('[data-invite]');
  if(inviteBtn)inviteBtn.addEventListener('click',openInviteModal);
  document.querySelectorAll('[data-revoke-invitation]').forEach(b=>b.onclick=()=>{const parts=b.dataset.revokeInvitation.split('|');confirmRevokeInvitation(parts[0],parts[1])});
  document.querySelectorAll('[data-view-sources]').forEach(b=>b.onclick=()=>openSourcesModal(b.dataset.viewSources));
}

const LIFECYCLE_LABEL={stabilize:'Passer en stabilisation',reactivate:'Reprendre le projet',archive:'Archiver',restore:'Restaurer'};
function confirmLifecycle(action){
  if(state.commandLocked)return;
  setCommand(`<span class="command-message">${esc(LIFECYCLE_LABEL[action])} ce projet ?</span><button class="command-button primary" type="button" data-confirm-lifecycle="${action}">Confirmer</button><button class="command-button" type="button" data-cancel>Annuler</button>`);
  commandState.querySelector('[data-confirm-lifecycle]').onclick=()=>runLifecycle(action);
  commandState.querySelector('[data-cancel]').onclick=renderCommand;
}
async function runLifecycle(action){
  setCommand(`<span class="command-message">${esc(LIFECYCLE_LABEL[action])}…</span>`);
  try{
    await postJson(`/api/control/projects/${state.detail}/${action}`);
    setCommand(`<span class="command-message"><span class="state-dot state-dot-success"></span>Fait.</span>`);
    await new Promise(r=>setTimeout(r,600));
    await loadProjects();
    state.detailTab='lifecycle';
    render();
  }catch(e){
    setCommand(`<span class="command-message"><span class="state-dot state-dot-error"></span>Action impossible.</span><button class="command-button command-retry" type="button" data-cancel>Fermer</button>`);
    commandState.querySelector('[data-cancel]').onclick=renderCommand;
  }
}

function confirmRevokeInvitation(projectId,invitationId){
  if(state.commandLocked)return;
  setCommand(`<span class="command-message">Révoquer cette invitation ?</span><button class="command-button primary" type="button" data-confirm-revoke>Confirmer</button><button class="command-button" type="button" data-cancel>Annuler</button>`);
  commandState.querySelector('[data-confirm-revoke]').onclick=async()=>{
    setCommand(`<span class="command-message">Révocation…</span>`);
    try{
      await postJson(`/api/control/projects/${projectId}/invitations/${invitationId}/revoke`);
      showToast('Invitation révoquée.');
      if(state.view==='access')await loadAccess();
      if(state.detail===projectId)await loadDetailAccess();
      await loadProjects();
      renderCommand();
    }catch(e){ showToast('Impossible de révoquer cette invitation.'); renderCommand(); }
  };
  commandState.querySelector('[data-cancel]').onclick=renderCommand;
}

function openInviteModal(){
  modal.hidden=false;
  modal.innerHTML=`<div class="modal"><h3>Inviter quelqu’un</h3><p>La personne recevra un accès dès acceptation de l’invitation.</p><div class="form-field"><label>Email</label><input type="email" id="inviteEmail" placeholder="prenom.nom@exemple.com"></div><div class="form-field"><label>Niveau d’accès</label><select id="inviteBundle"><option value="contributor">Contributeur</option><option value="editor">Éditeur</option><option value="pilot">Pilote</option><option value="project_admin">Administrateur du projet</option></select></div><div class="modal-actions"><button class="secondary-action" type="button" data-close-modal>Annuler</button><button class="primary-action" type="button" id="confirmInviteBtn">Envoyer l’invitation</button></div></div>`;
  modal.querySelector('[data-close-modal]').onclick=closeModal;
  modal.querySelector('#confirmInviteBtn').onclick=async()=>{
    const email=modal.querySelector('#inviteEmail').value.trim();
    const permissionBundle=modal.querySelector('#inviteBundle').value;
    if(!email.includes('@')){showToast('Adresse email invalide.');return}
    try{
      await postJson(`/api/control/projects/${state.detail}/invitations`,{email:email,permissionBundle:permissionBundle,locale:'fr'});
      closeModal();
      showToast('Invitation envoyée.');
      await loadDetailAccess();
      await loadProjects();
      render();
    }catch(e){ showToast('Impossible d’envoyer cette invitation.'); }
  };
}

function openSourcesModal(userId){
  const a=state.detailAccess.data;
  const person=a?a.people.find(p=>p.userId===userId):null;
  if(!person)return;
  modal.hidden=false;
  modal.innerHTML=`<div class="modal"><h3>${esc(person.displayName)}</h3><p>${esc(person.email)}</p>${person.sources.map(s=>`<div class="access-source" style="margin-top:14px"><div><strong>${esc(sourceLabel(s))}</strong><p>${esc(bundleLabel(s.permissionBundle))}${s.sourceType==='external_group_mapping'?` · ${esc(s.externalGroupId)}`:''}</p></div><div class="source-actions"><button class="mini-action danger" type="button" data-revoke-grant="${esc(s.grantId)}">Retirer cette source</button></div></div>`).join('')}<div class="modal-actions"><button class="secondary-action" type="button" data-close-modal>Fermer</button></div></div>`;
  modal.querySelector('[data-close-modal]').onclick=closeModal;
  modal.querySelectorAll('[data-revoke-grant]').forEach(b=>b.onclick=async()=>{
    try{
      await deleteReq(`/api/control/projects/${state.detail}/grants/${b.dataset.revokeGrant}`);
      closeModal();
      showToast('Source d’accès retirée. Les autres accès restent inchangés.');
      await loadDetailAccess();
      await loadProjects();
      render();
    }catch(e){
      const msg=e.status===403?'Impossible de retirer ce dernier accès administrateur -- transférez d’abord l’administration.':'Impossible de retirer cette source.';
      showToast(msg);
    }
  });
}

function openDeleteModal(){
  const p=state.projects.data.find(x=>x.id===state.detail);
  modal.hidden=false;
  modal.innerHTML=`<div class="modal"><h3>Supprimer ${esc(p.name)} ?</h3><p>La suppression définitive n’est pas encore implémentée dans Storm. Ce chantier attend Storm Privacy &amp; Data Lifecycle (catégories de données, rétention, anonymisation, purge, audit survivant).</p><div class="modal-actions"><button class="secondary-action" type="button" data-close-modal>Fermer</button></div></div>`;
  modal.querySelector('[data-close-modal]').onclick=closeModal;
}

async function hydrate(){
  setCommand('<span class="command-message">Ouverture de <strong>Storm Control</strong>…</span>');
  try{
    const me=await getJson('/api/me');
    state.me=me;
    accountName.textContent=me.displayName||'Utilisateur Storm';
    accountOrg.textContent=`Storm · ${me.organization?me.organization.name:'—'}`;
    avatarBtn.textContent=initials(me.displayName);

    if(!has(me,CAP.CONTROL)){
      app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+`<section class="section">${emptyState('Accès non disponible.','Vous n’avez pas accès à Storm Control.')}</section>`;
      setCommand('<span class="command-message">Vous n’avez pas accès à Storm Control.</span>');
      return;
    }

    if(has(me,CAP.VIEW_ALL)){ await loadProjects(); }
    else if(has(me,CAP.MEMBERS)){ state.view='members'; await loadMembers(); }
    else if(has(me,CAP.MANAGE_MEMBERSHIPS)||has(me,CAP.EXTERNAL)){ state.view='access'; await loadAccess(); }
    else { app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+`<section class="section">${emptyState('Aucun périmètre de gouvernance.','Aucune capability ne vous donne accès à une vue de Storm Control.')}</section>`; }
    renderCommand();
  }catch(e){
    app.innerHTML=hero((state.me&&state.me.organization?state.me.organization.name:'Storm')+'.','Gouvernance de votre organisation.')+`<section class="section">${errState('Storm Control')}</section>`;
    setCommand('<span class="command-message">Impossible d’ouvrir Storm Control.</span><button class="command-button command-retry" type="button" data-command="bootstrap">Réessayer</button>');
    const retryBtn=commandState.querySelector('[data-command="bootstrap"]');
    if(retryBtn)retryBtn.addEventListener('click',hydrate);
  }
}

hydrate();
</script>
</body>
</html>
