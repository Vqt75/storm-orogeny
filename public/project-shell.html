<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Project Shell — Orogeny V1</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{--canvas:#f6f6f3;--surface:#fff;--ink:#111;--muted:#76767b;--accent:#8a8a8d;--accent-rgb:138,138,141;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 20px 58px rgba(17,17,17,.09)}
*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--canvas)}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 12% -12%,#fff,transparent 34%),radial-gradient(circle at 84% 4%,rgba(var(--accent-rgb),.08),transparent 28%),var(--canvas);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif}button{font:inherit;color:inherit}.shell{min-height:100vh;padding:22px 28px 138px}.topbar{position:sticky;top:16px;z-index:30;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.36);backdrop-filter:blur(24px) saturate(175%);-webkit-backdrop-filter:blur(24px) saturate(175%);border-radius:20px;box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.78)}.brand{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:720;letter-spacing:-.035em}.brand-project{color:var(--muted);font-weight:560;max-width:min(42vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;gap:6px;align-items:center}.home-link,.avatar-btn,.account-action,.destination-card,.command-button{border:0;cursor:pointer}.home-link{padding:9px 12px;border-radius:12px;background:transparent;font-size:13px;font-weight:670}.home-link:hover{background:rgba(255,255,255,.52)}.avatar-wrap{position:relative}.avatar-btn{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}.account-popover{position:absolute;right:0;top:48px;width:250px;padding:9px;border-radius:18px;border:1px solid rgba(255,255,255,.64);background:rgba(249,249,247,.7);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 22px 54px rgba(17,17,17,.16);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.985);transition:.18s var(--ease)}.account-popover.open{opacity:1;visibility:visible;transform:none}.account-head{padding:12px}.account-head strong{display:block;font-size:14px;margin-bottom:3px}.account-head span{color:var(--muted);font-size:12px}.account-action{width:100%;padding:10px 12px;border-radius:11px;background:transparent;text-align:left;font-size:13px}.account-action:hover{background:rgba(17,17,17,.045)}main{width:min(1220px,100%);margin:0 auto;padding-top:92px}.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:42px;align-items:end;margin-bottom:70px}.hero::after{content:"";position:absolute;z-index:-1;width:420px;height:420px;right:-120px;top:-118px;border-radius:50%;background:rgba(var(--accent-rgb),.12)}.eyebrow{margin:0 0 14px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;max-width:920px;font-size:clamp(58px,7.2vw,108px);line-height:.89;letter-spacing:-.068em;font-weight:630;overflow-wrap:anywhere}.identity-panel{justify-self:end;width:220px;min-height:220px;border-radius:32px;background:radial-gradient(circle at 75% 18%,rgba(255,255,255,.28),transparent 30%),var(--accent);box-shadow:var(--shadow);display:grid;place-items:center;color:#fff;overflow:hidden}.identity-panel img{max-width:72%;max-height:72%;object-fit:contain}.identity-fallback{font-size:64px;font-weight:760;letter-spacing:-.06em}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px;padding:0 4px}.section-head h2{margin:0;font-size:24px;font-weight:690;letter-spacing:-.04em}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.destinations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.destinations.single{grid-template-columns:minmax(0,680px)}.destination-card{position:relative;min-height:248px;border-radius:30px;padding:26px 26px 74px;text-align:left;background:rgba(255,255,255,.76);box-shadow:0 13px 36px rgba(17,17,17,.045);overflow:hidden;transition:transform .24s var(--ease),box-shadow .24s var(--ease),background .24s var(--ease)}.destination-card::after{content:"";position:absolute;width:200px;height:200px;right:-86px;top:-92px;border-radius:50%;background:rgba(var(--accent-rgb),.09)}.destination-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.96);box-shadow:0 26px 74px rgba(17,17,17,.12)}.destination-kicker{display:block;margin-bottom:46px;color:var(--muted);font-size:11px;font-weight:760;letter-spacing:.12em;text-transform:uppercase}.destination-title{display:block;margin:0 0 8px;font-size:31px;letter-spacing:-.05em;font-weight:700}.destination-copy{display:block;max-width:400px;color:var(--muted);font-size:14px;line-height:1.5}.destination-action{position:absolute;left:26px;bottom:24px;font-size:13px;font-weight:740}.state-panel{min-height:300px;border-radius:30px;background:rgba(255,255,255,.5);display:flex;align-items:flex-end;padding:30px}.state-panel strong{display:block;margin-bottom:8px;font-size:22px;letter-spacing:-.035em}.state-panel p,.state-panel span{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.skeleton{width:100%;height:240px;border-radius:28px;background:linear-gradient(105deg,rgba(255,255,255,.36) 18%,rgba(255,255,255,.82) 38%,rgba(255,255,255,.36) 58%);background-size:220% 100%;animation:skeleton 1.25s linear infinite}@keyframes skeleton{to{background-position-x:-220%}}.command-layer{position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.74);border-radius:20px;background:rgba(244,244,242,.48);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.9)}.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}.command-message{padding:0 12px;text-align:center;font-size:13px}.command-message strong{font-weight:720}.command-button{min-height:42px;padding:0 16px;border-radius:15px;background:transparent;font-size:13px;font-weight:690}.command-button:hover{background:rgba(255,255,255,.44)}.command-button.primary{background:#111;color:#fff}@media(max-width:860px){.shell{padding:14px 14px 130px}.topbar{top:10px;height:58px;padding-left:15px}.home-link{display:none}.brand-project{display:none}main{padding-top:72px}.hero{grid-template-columns:1fr;margin-bottom:50px}.identity-panel{justify-self:start;width:112px;min-height:112px;border-radius:26px}.identity-fallback{font-size:38px}.destinations,.destinations.single{grid-template-columns:1fr}h1{font-size:clamp(52px,15.5vw,80px)}.command-layer{bottom:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><strong>Storm</strong><span class="brand-project" id="brandProject">Projet</span></div>
  <div class="top-actions"><button class="home-link" id="homeLink" type="button">Storm Home</button><div class="avatar-wrap"><button class="avatar-btn" id="avatarBtn" type="button" aria-label="Compte" aria-expanded="false">VC</button><div class="account-popover" id="accountPopover" role="dialog" aria-label="Compte"><div class="account-head"><strong id="accountName">Utilisateur Storm</strong><span id="accountOrg">Storm</span></div><button class="account-action" id="accountHome" type="button">Storm Home</button></div></div></div>
</header>
<main>
  <section class="hero" aria-labelledby="projectTitle">
    <div><p class="eyebrow" id="projectEyebrow">Projet Storm</p><h1 id="projectTitle">Votre projet.</h1></div>
    <div class="identity-panel" id="identityPanel" aria-label="Identité du projet"><span class="identity-fallback" id="identityFallback">S</span></div>
  </section>
  <section aria-labelledby="workspaceTitle"><div class="section-head"><div><h2 id="workspaceTitle">Votre espace</h2><p id="workspaceCopy">Les surfaces de travail disponibles pour ce projet.</p></div></div><div id="workspaceContent"><div class="state-panel"><div class="skeleton"></div></div></div></section>
</main>
</div>
<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer"><div class="command-state" id="commandState" aria-live="polite"></div></div>
<script>
const CAP=Object.freeze({VIEW:'project.view',EDIT:'content.edit',PILOTAGE:'pilotage.view'});
const ROUTES=Object.freeze({home:'/',studio:id=>`/projects/${encodeURIComponent(id)}/studio`,pilotage:id=>`/projects/${encodeURIComponent(id)}/pilotage`});
const COPY={fr:{eyebrow:'Projet Storm',workspace:'Votre espace',workspaceCopy:'Les surfaces de travail disponibles pour ce projet.',studio:'Studio',studioCopy:'Construire et faire évoluer les contenus du projet.',pilotage:'Pilotage',pilotageCopy:'Comprendre les signaux et suivre le projet.',open:'Ouvrir',empty:'Aucune surface de travail disponible.',emptyCopy:'Votre accès au projet est valide, mais aucune surface métier ne correspond encore à vos permissions.',error:'Storm n’arrive pas à ouvrir ce projet.',retry:'Réessayer',opening:'Ouverture de'},en:{eyebrow:'Storm Project',workspace:'Your workspace',workspaceCopy:'The work surfaces available for this project.',studio:'Studio',studioCopy:'Build and evolve project content.',pilotage:'Pilotage',pilotageCopy:'Understand project signals and follow its progress.',open:'Open',empty:'No work surface available.',emptyCopy:'Your project access is valid, but no work surface currently matches your permissions.',error:'Storm can’t open this project.',retry:'Try again',opening:'Opening'},nl:{eyebrow:'Storm-project',workspace:'Uw werkruimte',workspaceCopy:'De werkruimtes die voor dit project beschikbaar zijn.',studio:'Studio',studioCopy:'Bouw en ontwikkel de inhoud van het project.',pilotage:'Pilotage',pilotageCopy:'Begrijp de signalen en volg het project.',open:'Openen',empty:'Geen werkruimte beschikbaar.',emptyCopy:'Uw toegang is geldig, maar geen werkruimte komt overeen met uw rechten.',error:'Storm kan dit project niet openen.',retry:'Opnieuw proberen',opening:'Openen van'},es:{eyebrow:'Proyecto Storm',workspace:'Tu espacio',workspaceCopy:'Los espacios de trabajo disponibles para este proyecto.',studio:'Studio',studioCopy:'Crear y hacer evolucionar los contenidos del proyecto.',pilotage:'Pilotage',pilotageCopy:'Comprender las señales y seguir el proyecto.',open:'Abrir',empty:'No hay ningún espacio de trabajo disponible.',emptyCopy:'Tu acceso es válido, pero ninguna superficie corresponde a tus permisos.',error:'Storm no puede abrir este proyecto.',retry:'Reintentar',opening:'Abriendo'},de:{eyebrow:'Storm-Projekt',workspace:'Ihr Arbeitsbereich',workspaceCopy:'Die für dieses Projekt verfügbaren Arbeitsbereiche.',studio:'Studio',studioCopy:'Projektinhalte erstellen und weiterentwickeln.',pilotage:'Pilotage',pilotageCopy:'Projektsignale verstehen und den Verlauf verfolgen.',open:'Öffnen',empty:'Kein Arbeitsbereich verfügbar.',emptyCopy:'Ihr Zugang ist gültig, aber kein Arbeitsbereich entspricht Ihren Berechtigungen.',error:'Storm kann dieses Projekt nicht öffnen.',retry:'Erneut versuchen',opening:'Öffnen von'},it:{eyebrow:'Progetto Storm',workspace:'Il tuo spazio',workspaceCopy:'Gli spazi di lavoro disponibili per questo progetto.',studio:'Studio',studioCopy:'Costruire e far evolvere i contenuti del progetto.',pilotage:'Pilotage',pilotageCopy:'Comprendere i segnali e seguire il progetto.',open:'Apri',empty:'Nessuno spazio di lavoro disponibile.',emptyCopy:'Il tuo accesso è valido, ma nessuna superficie corrisponde ai tuoi permessi.',error:'Storm non riesce ad aprire questo progetto.',retry:'Riprova',opening:'Apertura di'}};
const state={context:null,locale:'fr',destinations:[],status:'loading',commandLocked:false,logoObjectUrl:null};
const projectId=(()=>{const m=location.pathname.match(/^\/projects\/([^/]+)\/?$/);return m?decodeURIComponent(m[1]):''})();
const $=id=>document.getElementById(id),brandProject=$('brandProject'),projectTitle=$('projectTitle'),projectEyebrow=$('projectEyebrow'),identityPanel=$('identityPanel'),identityFallback=$('identityFallback'),workspaceTitle=$('workspaceTitle'),workspaceCopy=$('workspaceCopy'),workspaceContent=$('workspaceContent'),commandLayer=$('commandLayer'),commandState=$('commandState'),avatarBtn=$('avatarBtn'),accountPopover=$('accountPopover'),accountName=$('accountName'),accountOrg=$('accountOrg');
function devHeaders(){const u=new URLSearchParams(location.search).get('devUser');return u?{'X-Storm-Dev-User':u}:{}}
function preserveDev(url){const u=new URLSearchParams(location.search).get('devUser');if(!u)return url;return `${url}${url.includes('?')?'&':'?'}devUser=${encodeURIComponent(u)}`}
function initials(n='Storm User'){return n.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('')||'S'}
function projectInitial(n='Projet'){return(n.trim()[0]||'P').toUpperCase()}
function hasCap(c,cap){return Array.isArray(c?.membership?.capabilities)&&c.membership.capabilities.includes(cap)}
function safeAccent(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v:'#8a8a8d'}
function locale(v){return COPY[v]?v:'fr'}
function t(k){return COPY[state.locale]?.[k]||COPY.fr[k]||k}
async function getJson(url){const r=await fetch(url,{headers:{Accept:'application/json',...devHeaders()},credentials:'same-origin'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function getBlob(url){const r=await fetch(url,{headers:{...devHeaders()},credentials:'same-origin'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.blob()}
function destinations(c){const a=[];if(hasCap(c,CAP.EDIT))a.push({id:'studio',title:'studio',copy:'studioCopy',route:ROUTES.studio(c.project.id)});if(hasCap(c,CAP.PILOTAGE))a.push({id:'pilotage',title:'pilotage',copy:'pilotageCopy',route:ROUTES.pilotage(c.project.id)});return a}
function applyAccent(v){const h=safeAccent(v),x=h.slice(1),rgb=[0,2,4].map(i=>parseInt(x.slice(i,i+2),16));document.documentElement.style.setProperty('--accent',h);document.documentElement.style.setProperty('--accent-rgb',rgb.join(','))}
function renderIdentity(c){brandProject.textContent=c.project.name;projectTitle.textContent=c.project.name;projectEyebrow.textContent=t('eyebrow');workspaceTitle.textContent=t('workspace');workspaceCopy.textContent=t('workspaceCopy');identityFallback.textContent=projectInitial(c.project.name);applyAccent(c.identity?.primaryColor)}
async function loadLogo(c){const id=c.identity?.logoAssetId;if(!id)return;try{const b=await getBlob(`/api/assets/${encodeURIComponent(id)}`);if(state.logoObjectUrl)URL.revokeObjectURL(state.logoObjectUrl);state.logoObjectUrl=URL.createObjectURL(b);const img=document.createElement('img');img.alt=`Logo ${c.project.name}`;img.src=state.logoObjectUrl;img.onload=()=>identityFallback.hidden=true;img.onerror=()=>{img.remove();identityFallback.hidden=false};identityPanel.prepend(img)}catch(e){console.warn('[Storm Shell] logo unavailable',e)}}
function card(d){return `<button class="destination-card" type="button" data-destination="${d.id}"><span class="destination-kicker">Projet</span><span class="destination-title">${t(d.title)}</span><span class="destination-copy">${t(d.copy)}</span><span class="destination-action">${t('open')}</span></button>`}
// Une navigation simple doit être immédiate (doctrine Storm) : Studio
// existe réellement et ne nécessite aucune confirmation avant d'y
// entrer -- showIntent() reste réservée aux destinations qui ont
// vraiment besoin d'une étape intermédiaire (aujourd'hui, aucune
// réelle ; Pilotage la garde volontairement car c'est un stub, pas une
// route fonctionnelle -- ne pas la transformer ici).
function openDestination(d){
  if(!d) return;
  if(d.id==='studio'){ location.assign(preserveDev(d.route)); return; }
  showIntent(d);
}
function renderWorkspace(){if(!state.destinations.length){workspaceContent.innerHTML=`<div class="state-panel"><div><strong>${t('empty')}</strong><span>${t('emptyCopy')}</span></div></div>`;return}workspaceContent.innerHTML=`<div class="destinations${state.destinations.length===1?' single':''}">${state.destinations.map(card).join('')}</div>`;workspaceContent.querySelectorAll('[data-destination]').forEach(b=>b.onclick=()=>{const d=state.destinations.find(x=>x.id===b.dataset.destination);openDestination(d)})}
function setCommand(html){commandState.innerHTML=html;wireCommand()}
function normalCommand(){const name=state.context?.project?.name||'Storm';if(!state.destinations.length)return `<span class="command-message"><strong>${name}</strong></span>`;if(state.destinations.length===1){const d=state.destinations[0];return `<span class="command-message"><strong>${name}</strong> · ${t(d.title)}</span><button class="command-button primary" data-command="single">${t('open')}</button>`}return `<span class="command-message"><strong>${name}</strong></span>${state.destinations.map(d=>`<button class="command-button" data-command="destination" data-destination="${d.id}">${t(d.title)}</button>`).join('')}`}
function renderCommand(){if(state.commandLocked)return;if(state.status==='loading'){setCommand(`<span class="command-message">${t('opening')} <strong>${state.context?.project?.name||'Storm'}</strong>…</span>`);return}if(state.status==='error'){setCommand(`<span class="command-message">${t('error')}</span><button class="command-button primary" data-command="retry">${t('retry')}</button>`);return}setCommand(normalCommand())}
function showIntent(d){if(state.commandLocked)return;setCommand(`<span class="command-message"><strong>${t(d.title)}</strong> · ${state.context.project.name}</span><button class="command-button primary" data-command="confirm" data-destination="${d.id}">${t('open')}</button><button class="command-button" data-command="cancel">Fermer</button>`)}
function wireCommand(){commandState.querySelector('[data-command="retry"]')?.addEventListener('click',hydrate);commandState.querySelector('[data-command="single"]')?.addEventListener('click',()=>openDestination(state.destinations[0]));commandState.querySelectorAll('[data-command="destination"]').forEach(b=>b.onclick=()=>{const d=state.destinations.find(x=>x.id===b.dataset.destination);openDestination(d)});commandState.querySelector('[data-command="confirm"]')?.addEventListener('click',e=>{const d=state.destinations.find(x=>x.id===e.currentTarget.dataset.destination);if(!d)return;if(d.id==='studio'){location.assign(preserveDev(d.route));return}setCommand(`<span class="command-message"><strong>${t(d.title)}</strong> arrive dans la prochaine étape.</span><button class="command-button" data-command="cancel">Fermer</button>`)});commandState.querySelector('[data-command="cancel"]')?.addEventListener('click',renderCommand)}
commandLayer.addEventListener('focusin',()=>state.commandLocked=true);commandLayer.addEventListener('focusout',e=>{if(commandLayer.contains(e.relatedTarget))return;state.commandLocked=false;renderCommand()});
async function hydrate(){state.status='loading';renderCommand();try{const [c,me]=await Promise.all([getJson(`/api/projects/${encodeURIComponent(projectId)}/context`),getJson('/api/me')]);state.context=c;state.locale=locale(c.settings?.workspaceLocale);state.destinations=destinations(c);state.status='ready';document.documentElement.lang=state.locale;accountName.textContent=me.displayName||'Utilisateur Storm';accountOrg.textContent=`Storm · ${me.organization?.name||'Organisation'}`;avatarBtn.textContent=initials(me.displayName);renderIdentity(c);renderWorkspace();renderCommand();loadLogo(c)}catch(e){console.error('[Storm Shell] load failed',e);state.status='error';workspaceContent.innerHTML=`<div class="state-panel"><div><strong>${t('error')}</strong><p>Votre projet n’a pas été modifié.</p></div></div>`;renderCommand()}}
$('homeLink').onclick=()=>location.assign(preserveDev('/'));$('accountHome').onclick=()=>location.assign(preserveDev('/'));avatarBtn.onclick=e=>{e.stopPropagation();const o=accountPopover.classList.toggle('open');avatarBtn.setAttribute('aria-expanded',o)};document.addEventListener('click',e=>{if(!e.target.closest('.avatar-wrap')){accountPopover.classList.remove('open');avatarBtn.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&accountPopover.classList.contains('open')){accountPopover.classList.remove('open');avatarBtn.setAttribute('aria-expanded','false');avatarBtn.focus();return}if(e.key==='Escape'&&state.status==='ready')renderCommand()});window.addEventListener('beforeunload',()=>{if(state.logoObjectUrl)URL.revokeObjectURL(state.logoObjectUrl)});hydrate();
</script>
</body></html>
