<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Studio — Espaces · Orogeny</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{
  --canvas:#f6f6f3;--surface:#fff;--ink:#111;--graphite:#353539;--muted:#77777c;--quiet:#a2a2a7;
  --line:rgba(17,17,17,.08);--danger:#b42318;--glass:rgba(247,247,244,.50);
  --ease:cubic-bezier(.22,1,.36,1);--shadow:0 20px 58px rgba(17,17,17,.09)
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--canvas)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 10% -8%,rgba(255,255,255,.98),transparent 34%),
    radial-gradient(circle at 88% 3%,rgba(17,17,17,.035),transparent 25%),
    var(--canvas);
  -webkit-font-smoothing:antialiased
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.shell{min-height:100vh;padding:22px 28px 154px}
.topbar{
  position:sticky;top:16px;z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.75);border-radius:20px;
  background:rgba(255,255,255,.37);backdrop-filter:blur(24px) saturate(175%);
  box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.82)
}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:720;letter-spacing:-.035em}
.brand-project{color:var(--muted);font-weight:560}
.top-actions{display:flex;align-items:center;gap:6px}
.project-link{border:0;background:transparent;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:670}
.project-link:hover{background:rgba(255,255,255,.55)}
.avatar{width:38px;height:38px;border:0;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}
main{width:min(1280px,100%);margin:0 auto;padding-top:84px}
.studio-grid{display:grid;grid-template-columns:190px minmax(0,900px);gap:58px;align-items:start}
.studio-nav{
  position:sticky;top:102px;padding:7px;border:1px solid rgba(255,255,255,.72);border-radius:22px;
  background:rgba(247,247,244,.44);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:0 12px 38px rgba(17,17,17,.065),inset 0 1px 0 rgba(255,255,255,.82)
}
.nav-item{
  width:100%;min-height:43px;padding:0 13px;border:0;border-radius:15px;background:transparent;text-align:left;
  color:var(--muted);font-size:13px;font-weight:650
}
.nav-item:hover{color:var(--ink);background:rgba(255,255,255,.42)}
.nav-item.active{color:var(--ink);background:rgba(255,255,255,.86);box-shadow:0 7px 18px rgba(17,17,17,.055)}
.page-head{position:relative;margin-bottom:42px}
.page-head:after{content:"";position:absolute;z-index:-1;width:280px;height:280px;right:-50px;top:-110px;border-radius:50%;background:rgba(17,17,17,.028)}
.eyebrow{margin:0 0 13px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}
h1{margin:0;font-size:clamp(54px,6.2vw,88px);line-height:.9;letter-spacing:-.064em;font-weight:630}
.lead{max-width:620px;margin:19px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
.spaces-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}
.space-list{display:grid;gap:10px;align-content:start}
.space-chip,.add-space{border:0;border-radius:20px;text-align:left;transition:.2s var(--ease)}
.space-chip{padding:16px 17px;background:rgba(255,255,255,.58);box-shadow:0 1px 0 rgba(255,255,255,.86) inset}
.space-chip:hover{background:#fff;transform:translateY(-1px)}
.space-chip.active{background:#111;color:#fff;box-shadow:0 16px 38px rgba(17,17,17,.16)}
.space-chip small{display:block;margin-bottom:6px;opacity:.62;font-size:10px;font-weight:760;letter-spacing:.1em;text-transform:uppercase}
.space-chip strong{display:block;font-size:14px;line-height:1.28;letter-spacing:-.02em}
.space-chip span{display:block;margin-top:6px;font-size:11px;opacity:.62}
.add-space{min-height:58px;padding:0 16px;background:rgba(255,255,255,.23);color:var(--muted);font-weight:680}
.add-space:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.editor{
  border-radius:30px;background:rgba(255,255,255,.77);padding:32px;min-height:650px;
  box-shadow:0 1px 0 rgba(255,255,255,.88) inset,0 14px 38px rgba(17,17,17,.045)
}
.editor-head{position:relative;display:flex;justify-content:flex-end;margin-bottom:14px}
.more{width:40px;height:40px;border:0;border-radius:13px;background:transparent;font-size:20px;line-height:1}
.more:hover,.more[aria-expanded="true"]{background:rgba(17,17,17,.05)}
.popover{
  position:absolute;z-index:20;right:0;top:46px;width:180px;padding:5px;border:1px solid rgba(255,255,255,.8);
  border-radius:15px;background:rgba(248,248,246,.94);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:0 16px 42px rgba(17,17,17,.13)
}
.popover button{width:100%;min-height:40px;border:0;border-radius:11px;background:transparent;text-align:left;padding:0 11px;font-size:12px;font-weight:680}
.popover button:hover{background:#fff}.popover .danger{color:var(--danger)}
.space-title{
  min-height:44px;outline:0;font-size:42px;line-height:1.03;letter-spacing:-.055em;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere
}
.space-title:empty:before,.plain-edit:empty:before{content:attr(data-placeholder);color:#b2b2b6;pointer-events:none}
.meta-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.field-label{display:block;margin-bottom:6px;color:var(--quiet);font-size:10px;font-weight:760;letter-spacing:.1em;text-transform:uppercase}
.plain-edit{
  min-height:42px;padding:10px 12px;border-radius:14px;background:rgba(17,17,17,.035);outline:0;
  color:var(--graphite);font-size:14px;line-height:1.5
}
.plain-edit.description{min-height:92px}
.section{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.section-title-row{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}
.section-title-row h2{margin:0;font-size:18px;letter-spacing:-.025em}
.section-title-row p{margin:0;color:var(--muted);font-size:11px}
.status-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.status-btn{
  min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55);
  text-align:left;font-size:12px;font-weight:690
}
.status-btn:hover{background:#fff}.status-btn.active{background:#111;color:#fff;border-color:#111}
.status-help{
  min-height:54px;margin-top:10px;padding:13px 14px;border-radius:16px;background:rgba(17,17,17,.035);
  color:var(--muted);font-size:12px;line-height:1.5
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  min-height:36px;padding:0 12px;border:1px solid rgba(17,17,17,.08);border-radius:999px;background:rgba(255,255,255,.64);
  color:var(--graphite);font-size:12px;font-weight:660
}
.chip:hover{background:#fff}.chip.active{background:#111;color:#fff;border-color:#111}
.media-list{display:grid;gap:10px}
.media-card{
  display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;
  border-radius:20px;background:rgba(246,246,243,.75)
}
.preview{
  width:104px;height:78px;border-radius:14px;background:linear-gradient(145deg,#ecece8,#dddcd7);display:grid;place-items:center;
  overflow:hidden;color:var(--muted);font-size:10px;font-weight:760;letter-spacing:.07em;text-transform:uppercase
}
.preview.plan{background:linear-gradient(135deg,#f0f0ed 25%,#ddd 25% 27%,#f0f0ed 27% 50%,#ddd 50% 52%,#f0f0ed 52%)}
.preview.pdf{background:#fff;border:1px solid var(--line);color:#111}
.media-copy{min-width:0}.media-kind{color:var(--quiet);font-size:10px;font-weight:780;letter-spacing:.1em;text-transform:uppercase}
.media-copy strong{display:block;margin-top:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-copy small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.media-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:34px;height:34px;border:0;border-radius:11px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:#fff;color:var(--ink)}
.icon-btn:disabled{opacity:.28;cursor:default}
.add-media{
  margin-top:10px;width:100%;min-height:52px;border:0;border-radius:18px;background:rgba(255,255,255,.30);
  color:var(--muted);text-align:left;padding:0 16px;font-weight:680
}
.add-media:hover{background:rgba(255,255,255,.72);color:var(--ink)}
.kind-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;padding:10px;border-radius:18px;background:rgba(17,17,17,.035)}
.kind-picker button{min-height:42px;border:0;border-radius:13px;background:rgba(255,255,255,.55);font-size:12px;font-weight:700}
.kind-picker button:hover{background:#fff}
.uploading{margin-top:10px;padding:13px 14px;border-radius:16px;background:rgba(17,17,17,.035);font-size:12px;color:var(--muted)}
.command-layer{
  position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);
  width:min(640px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.74);
  border-radius:20px;background:var(--glass);backdrop-filter:blur(28px) saturate(190%);
  box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.9)
}
.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
.command-message{padding:0 12px;text-align:center;color:var(--graphite);font-size:13px}
.command-message strong{color:var(--ink);font-weight:720}
.command-button{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:transparent;font-size:13px;font-weight:690}
.command-button:hover{background:rgba(255,255,255,.44)}.command-button.primary{background:#111;color:#fff}
.sheet{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,10,12,.20);backdrop-filter:blur(7px)
}
.sheet-card{
  width:min(430px,100%);padding:24px;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(249,249,247,.96);
  box-shadow:0 28px 80px rgba(17,17,17,.18)
}
.sheet-card h2{margin:0;font-size:24px;letter-spacing:-.04em}.sheet-card p{margin:10px 0 22px;color:var(--muted);font-size:13px;line-height:1.55}
.sheet-actions{display:flex;justify-content:flex-end;gap:7px}.sheet-actions button{min-height:42px;padding:0 14px;border:0;border-radius:13px;font-weight:690}
.cancel{background:rgba(17,17,17,.05)}.delete{background:#111;color:#fff}
.loading{padding:24px;border-radius:22px;background:rgba(255,255,255,.45);color:var(--muted);font-size:13px}
@media(max-width:980px){.spaces-layout{grid-template-columns:1fr}.space-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .shell{padding:14px 14px 146px}.topbar{top:10px}.brand-project,.project-link{display:none}
  main{padding-top:66px}.studio-grid{grid-template-columns:1fr;gap:30px}
  .studio-nav{position:relative;top:auto;display:flex;gap:4px;overflow:auto;scrollbar-width:none}
  .studio-nav::-webkit-scrollbar{display:none}.nav-item{width:auto;flex:0 0 auto}
  .space-list{grid-template-columns:1fr}.editor{padding:24px}.space-title{font-size:34px}
  .status-options{grid-template-columns:1fr}.media-card{grid-template-columns:82px minmax(0,1fr);align-items:start}
  .preview{width:82px;height:70px}.media-actions{grid-column:2;justify-content:flex-start}
  .command-layer{bottom:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><strong>Storm</strong><span class="brand-project" id="brandProject">Projet</span></div>
    <div class="top-actions"><button class="project-link" id="projectLink" type="button">Projet</button><button class="avatar" id="avatarBtn" type="button" aria-label="Compte">VC</button></div>
  </header>

  <main>
    <div class="studio-grid">
      <nav class="studio-nav" aria-label="Studio">
        <button class="nav-item" data-domain="homepage" type="button">Homepage</button>
        <button class="nav-item" data-domain="project" type="button">Le projet</button>
        <button class="nav-item active" data-domain="spaces" type="button" aria-current="page">Espaces</button>
        <button class="nav-item" data-domain="news" type="button">Actualités</button>
        <button class="nav-item" data-domain="ambassadors" type="button">Ambassadeurs</button>
        <button class="nav-item" data-domain="questions" type="button">Questions</button>
      </nav>

      <section>
        <header class="page-head">
          <p class="eyebrow">Studio</p>
          <h1>Espaces</h1>
          <p class="lead">Présentez les espaces du projet, leurs usages et leur évolution.</p>
        </header>

        <div class="spaces-layout">
          <aside class="space-list" id="spaceList"></aside>
          <article class="editor" id="editor"></article>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer">
  <div class="command-state" id="commandState" aria-live="polite"></div>
</div>

<div class="sheet" id="deleteSheet" hidden role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
  <div class="sheet-card">
    <h2 id="deleteTitle">Supprimer cet espace ?</h2>
    <p>Cette action supprime l’espace de Studio.</p>
    <div class="sheet-actions">
      <button class="cancel" id="cancelDelete" type="button">Annuler</button>
      <button class="delete" id="confirmDelete" type="button">Supprimer</button>
    </div>
  </div>
</div>

<input id="fileInput" type="file" hidden />

<script>
/*
STORM STUDIO — ESPACES V2 · FRONT INTEGRATION HANDOFF
======================================================
This file is intentionally API-aware and must be compared against the real repo before integration.

Verified backend contract expected:
GET    /api/projects/:id/context
GET    /api/me
GET    /api/projects/:id/studio/spaces
POST   /api/projects/:id/studio/spaces
PATCH  /api/projects/:id/studio/spaces/:spaceId
DELETE /api/projects/:id/studio/spaces/:spaceId?version=N
POST   /api/projects/:id/studio/assets   multipart FormData with kind=space_media

Canonical Space:
{
  id, name, location, description,
  status: "designing" | "approved" | "delivered",
  usages: string[],
  position, version, updatedAt,
  media: [
    { id, kind:"view"|"plan"|"document", assetId, label, alt, position }
  ]
}

Core rules:
- Space is the optimistic-lock parent; media are transactional children.
- PATCH is full-resource style: always send the complete current state + version.
- Existing media ids must be preserved.
- New media have NO fake server id. A transient clientKey may exist only in memory/DOM.
- clientKey is never sent to API.
- Reconciliation must be by identity, never by array position.
- upload first -> create/update media only after successful asset response.
- view accepts image only; plan accepts image or PDF; document accepts PDF only.
- usages is closed to DEFAULT_USAGES.
- status is narrative; never expose raw enum to user.
*/

const DEFAULT_USAGES=[
  "Se concentrer","Collaborer","Se réunir","Échanger de façon informelle",
  "Faire une pause","Travailler autrement","Accueillir"
];

const STATUS={
  designing:{
    label:"En cours de conception",
    help:"Cet espace est encore en cours de conception. Son organisation et certains détails peuvent évoluer."
  },
  approved:{
    label:"Validé",
    help:"Les grands principes de cet espace sont validés. Les ajustements restants portent sur des détails de mise au point."
  },
  delivered:{
    label:"Livré",
    help:"Cet espace est livré et peut désormais être découvert tel qu'il sera utilisé au quotidien."
  }
};

const state={
  context:null,me:null,spaces:[],activeId:null,
  load:"loading",save:"saved",error:null,unpublished:false,
  timers:new Map(),inflight:new Map(),queued:new Set(),
  commandLocked:false,kindPicker:false,uploading:false,
  uploadError:null,deleteTarget:null,lastMenu:null
};

const spaceList=document.getElementById("spaceList");
const editor=document.getElementById("editor");
const commandLayer=document.getElementById("commandLayer");
const commandState=document.getElementById("commandState");
const deleteSheet=document.getElementById("deleteSheet");
const fileInput=document.getElementById("fileInput");

const projectId=(()=>{
  const m=location.pathname.match(/^\/projects\/([^/]+)\/studio(?:\/spaces)?\/?$/);
  return m?decodeURIComponent(m[1]):"";
})();

function devHeaders(){
  const d=new URLSearchParams(location.search).get("devUser");
  return d?{"X-Storm-Dev-User":d}:{};
}
function preserveDev(url){
  const d=new URLSearchParams(location.search).get("devUser");
  return d?url+(url.includes("?")?"&":"?")+"devUser="+encodeURIComponent(d):url;
}
function hasCap(cap){return state.context?.membership?.capabilities?.includes(cap)}
function esc(v=""){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
}
function active(){return state.spaces.find(s=>String(s.id)===String(state.activeId))}
function mediaKey(m){return m.id||m.clientKey}
function syncMediaPositions(s){(s.media||[]).forEach((m,i)=>m.position=i)}

async function api(url,options={}){
  const headers={Accept:"application/json",...devHeaders(),...(options.headers||{})};
  if(options.body && !(options.body instanceof FormData) && !headers["Content-Type"])headers["Content-Type"]="application/json";
  const res=await fetch(url,{...options,credentials:"same-origin",headers});
  const type=res.headers.get("content-type")||"";
  const body=res.status===204?null:(type.includes("application/json")?await res.json():await res.text());
  if(!res.ok){
    const e=new Error(body?.error?.message||body?.message||`HTTP ${res.status}`);
    e.status=res.status;e.body=body;throw e;
  }
  return body;
}

function normalizeSpace(s){
  return {
    ...s,
    name:s?.name??"",
    location:s?.location??"",
    description:s?.description??"",
    status:STATUS[s?.status]?s.status:"designing",
    usages:Array.isArray(s?.usages)?s.usages.filter(u=>DEFAULT_USAGES.includes(u)):[],
    media:Array.isArray(s?.media)?s.media.map(m=>({...m,clientKey:m.clientKey||null})):[],
  };
}

function renderList(){
  if(state.load==="loading"){
    spaceList.innerHTML='<div class="loading">Chargement des espaces…</div>';
    return;
  }
  spaceList.innerHTML=
    state.spaces.map(s=>`
      <button class="space-chip ${String(s.id)===String(state.activeId)?"active":""}" data-space="${esc(s.id)}" type="button">
        <small>${esc(STATUS[s.status]?.label||"En cours de conception")}</small>
        <strong>${esc(s.name||"Sans titre")}</strong>
        ${s.location?`<span>${esc(s.location)}</span>`:""}
      </button>`).join("")+
    `<button class="add-space" id="addSpace" type="button">+ Ajouter un espace</button>`;
  spaceList.querySelectorAll("[data-space]").forEach(b=>b.onclick=()=>{
    flushDomToState();
    state.activeId=b.dataset.space;
    state.kindPicker=false;
    state.uploadError=null;
    renderAll();
  });
  document.getElementById("addSpace").onclick=createSpace;
}

function mediaMarkup(m,index,total){
  const key=mediaKey(m);
  const kindLabel=m.kind==="view"?"Vue":m.kind==="plan"?"Plan":"Document";
  const previewClass=m.kind==="document"?"pdf":m.kind==="plan"?"plan":"";
  const fileLabel=m.label||m.fileName||"Média";
  const meta=[m.fileName,m.sizeLabel].filter(Boolean).join(" · ");
  return `<div class="media-card" data-media-key="${esc(key)}">
    <div class="preview ${previewClass}">${m.kind==="document"?"PDF":kindLabel}</div>
    <div class="media-copy">
      <span class="media-kind">${kindLabel}</span>
      <strong>${esc(fileLabel)}</strong>
      <small>${esc(meta)}</small>
    </div>
    <div class="media-actions">
      <button class="icon-btn" data-up="${esc(key)}" type="button" aria-label="Monter" ${index===0?"disabled":""}>↑</button>
      <button class="icon-btn" data-down="${esc(key)}" type="button" aria-label="Descendre" ${index===total-1?"disabled":""}>↓</button>
      <button class="icon-btn" data-replace="${esc(key)}" type="button" aria-label="Remplacer">↻</button>
      <button class="icon-btn" data-remove="${esc(key)}" type="button" aria-label="Supprimer">×</button>
    </div>
  </div>`;
}

function renderEditor(){
  if(state.load==="loading"){
    editor.innerHTML='<div class="loading">Storm ouvre les espaces…</div>';return;
  }
  if(state.load==="error"){
    editor.innerHTML='<div class="loading">Storm n’arrive pas à ouvrir Espaces.</div>';return;
  }
  const s=active();
  if(!s){
    editor.innerHTML='<p style="margin:0;color:var(--muted)">Sélectionnez un espace ou créez-en un nouveau.</p>';
    return;
  }

  editor.innerHTML=`
    <div class="editor-head">
      <button class="more" id="spaceMenu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Actions">•••</button>
      <div class="popover" id="spacePopover" hidden role="menu">
        <button class="danger" id="deleteSpace" role="menuitem" type="button">Supprimer</button>
      </div>
    </div>

    <div class="space-title" contenteditable="true" data-field="name" data-placeholder="Nom de l’espace">${esc(s.name||"")}</div>

    <div class="meta-grid">
      <label>
        <span class="field-label">Localisation</span>
        <div class="plain-edit" contenteditable="true" data-field="location" data-placeholder="Ex. Rez-de-chaussée">${esc(s.location||"")}</div>
      </label>
      <label>
        <span class="field-label">Description</span>
        <div class="plain-edit description" contenteditable="true" data-field="description" data-placeholder="Décrivez simplement cet espace…">${esc(s.description||"")}</div>
      </label>
    </div>

    <section class="section">
      <div class="section-title-row"><div><span class="field-label">Maturité</span><h2>Où en est cet espace ?</h2></div></div>
      <div class="status-options">
        ${Object.entries(STATUS).map(([key,v])=>`
          <button class="status-btn ${s.status===key?"active":""}" data-status="${key}" type="button">${esc(v.label)}</button>
        `).join("")}
      </div>
      <div class="status-help">${esc(STATUS[s.status]?.help||"")}</div>
    </section>

    <section class="section">
      <div class="section-title-row">
        <div><span class="field-label">Usages</span><h2>Que vient-on faire ici ?</h2></div>
        <p>Plusieurs choix possibles</p>
      </div>
      <div class="chips">
        ${DEFAULT_USAGES.map(u=>`
          <button class="chip ${s.usages.includes(u)?"active":""}" data-usage="${esc(u)}" type="button">${esc(u)}</button>
        `).join("")}
      </div>
    </section>

    <section class="section">
      <div class="section-title-row">
        <div><span class="field-label">Médias</span><h2>Montrer l’espace</h2></div>
        <p>${s.media.length} média${s.media.length>1?"s":""}</p>
      </div>
      <div class="media-list">${s.media.map((m,i)=>mediaMarkup(m,i,s.media.length)).join("")}</div>
      ${state.uploading?`<div class="uploading">Import du média…</div>`:""}
      ${state.uploadError?`<div class="uploading">${esc(state.uploadError)} <button id="retryUpload" type="button">Réessayer</button></div>`:""}
      <button class="add-media" id="addMedia" type="button">+ Ajouter un média</button>
      <div class="kind-picker" id="kindPicker" ${state.kindPicker?"":"hidden"}>
        <button data-kind="view" type="button">Vue</button>
        <button data-kind="plan" type="button">Plan</button>
        <button data-kind="document" type="button">Document</button>
      </div>
    </section>
  `;

  wireEditor();
}

function flushDomToState(){
  const s=active();if(!s||!editor.isConnected)return s;
  const n=editor.querySelector('[data-field="name"]');
  const l=editor.querySelector('[data-field="location"]');
  const d=editor.querySelector('[data-field="description"]');
  if(n)s.name=(n.textContent||"").replace(/\n+/g," ");
  if(l)s.location=l.textContent||"";
  if(d)s.description=d.textContent||"";
  return s;
}

function wirePlainText(el,{singleLine=false}={}){
  if(!el)return;
  el.addEventListener("input",()=>{flushDomToState();markDirty(active()?.id)});
  el.addEventListener("keydown",e=>{if(singleLine&&e.key==="Enter")e.preventDefault()});
  el.addEventListener("paste",e=>{
    e.preventDefault();
    let t=(e.clipboardData||window.clipboardData).getData("text/plain");
    if(singleLine)t=t.replace(/\n+/g," ");
    document.execCommand("insertText",false,t);
  });
}

function wireEditor(){
  const s=active();if(!s)return;

  const menu=document.getElementById("spaceMenu");
  const pop=document.getElementById("spacePopover");
  menu.onclick=()=>{
    const open=pop.hidden;pop.hidden=!open;menu.setAttribute("aria-expanded",String(open));state.lastMenu=menu;
  };
  document.getElementById("deleteSpace").onclick=()=>{
    pop.hidden=true;menu.setAttribute("aria-expanded","false");
    state.deleteTarget=s.id;deleteSheet.hidden=false;
    requestAnimationFrame(()=>document.getElementById("cancelDelete").focus());
  };

  wirePlainText(editor.querySelector('[data-field="name"]'),{singleLine:true});
  wirePlainText(editor.querySelector('[data-field="location"]'));
  wirePlainText(editor.querySelector('[data-field="description"]'));

  editor.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{
    flushDomToState();s.status=b.dataset.status;markDirty(s.id);renderEditor();
  });
  editor.querySelectorAll("[data-usage]").forEach(b=>b.onclick=()=>{
    flushDomToState();
    const u=b.dataset.usage;
    s.usages=s.usages.includes(u)?s.usages.filter(x=>x!==u):[...s.usages,u];
    markDirty(s.id);renderEditor();
  });

  document.getElementById("addMedia").onclick=()=>{
    flushDomToState();state.kindPicker=!state.kindPicker;renderEditor();
  };
  editor.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>chooseFile(b.dataset.kind,null));

  editor.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveMedia(b.dataset.up,-1));
  editor.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveMedia(b.dataset.down,1));
  editor.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeMedia(b.dataset.remove));
  editor.querySelectorAll("[data-replace]").forEach(b=>b.onclick=()=>{
    const m=s.media.find(x=>String(mediaKey(x))===String(b.dataset.replace));
    if(m)chooseFile(m.kind,mediaKey(m));
  });

  document.getElementById("retryUpload")?.addEventListener("click",()=>fileInput.click());
}

function readPayload(space){
  flushDomToState();
  syncMediaPositions(space);
  return {
    name:space.name||"",
    location:space.location||"",
    description:space.description||"",
    status:space.status||"designing",
    usages:(space.usages||[]).filter(u=>DEFAULT_USAGES.includes(u)),
    position:Number.isInteger(space.position)?space.position:Math.max(0,state.spaces.indexOf(space)),
    media:(space.media||[]).map((m,index)=>{
      const out={
        kind:m.kind,
        assetId:m.assetId,
        label:m.label??null,
        alt:m.alt??null,
        position:index
      };
      if(m.id)out.id=m.id;
      return out;
    })
  };
}

function markDirty(id){
  if(!id)return;
  state.save="dirty";state.unpublished=true;renderCommand();
  clearTimeout(state.timers.get(id));
  state.timers.set(id,setTimeout(()=>queueSave(id),800));
}

async function queueSave(id){
  if(!id)return;
  if(state.inflight.get(id)){state.queued.add(id);return}
  const s=state.spaces.find(x=>String(x.id)===String(id));
  if(!s||!s.version)return;

  state.inflight.set(id,true);
  state.save="saving";renderCommand();

  const sentSnapshot=readPayload(s);
  const clientKeyBySignature=(s.media||[])
    .filter(m=>!m.id&&m.clientKey)
    .map(m=>({clientKey:m.clientKey,kind:m.kind,assetId:m.assetId,position:m.position}));

  try{
    const updated=await api(`/api/projects/${encodeURIComponent(projectId)}/studio/spaces/${encodeURIComponent(id)}`,{
      method:"PATCH",
      body:JSON.stringify({version:s.version,...sentSnapshot})
    });

    reconcileSpaceFromServer(s,updated,clientKeyBySignature);
    state.save="saved";
    renderList();
    renderCommand();
  }catch(e){
    if(e.status===409){
      state.save="conflict";state.error=e;
    }else{
      state.save="error";state.error=e;
    }
    renderCommand();
  }finally{
    state.inflight.delete(id);
    if(state.queued.has(id)){
      state.queued.delete(id);
      queueMicrotask(()=>queueSave(id));
    }
  }
}

function reconcileSpaceFromServer(local,server,clientKeyBySignature){
  if(!server)return;

  // Never clobber newer in-progress DOM text with stale server text.
  // Adopt canonical non-editorial metadata and ids, preserving current local values.
  local.version=server.version;
  local.updatedAt=server.updatedAt;

  const serverMedia=Array.isArray(server.media)?server.media:[];
  const serverById=new Map(serverMedia.filter(sm=>sm.id).map(sm=>[String(sm.id),sm]));
  const serverByAssetSignature=new Map(serverMedia.filter(sm=>sm.id).map(sm=>[`${sm.assetId}::${sm.kind}`,sm]));

  // L'ORDRE LOCAL reste TOUJOURS la vérité — jamais celui renvoyé par
  // CETTE réponse précise. Si un réordonnancement local a eu lieu
  // pendant que cette requête était en vol, la réponse reflète l'état
  // AU MOMENT DE L'ENVOI, potentiellement déjà périmé par rapport au
  // réordonnancement qui a eu lieu depuis. Reconstruire `next` à
  // partir de l'ordre du SERVEUR (comme le faisait la version
  // précédente) écrasait silencieusement ce réordonnancement plus
  // récent — bug réel trouvé et prouvé par payload/réponse/DB
  // identiques mais résultat final incorrect après un enchaînement de
  // sauvegardes coalescées. Seule l'identité (id serveur, une fois
  // acquise) est adoptée ici ; la position ne l'est jamais depuis le
  // serveur, elle reste sous contrôle local exclusif.
  for(const lm of local.media||[]){
    let sm=null;
    if(lm.id)sm=serverById.get(String(lm.id));
    else sm=serverByAssetSignature.get(`${lm.assetId}::${lm.kind}`);
    if(sm){
      const{position,...rest}=sm;
      Object.assign(lm,rest);
      if(!lm.clientKey && !lm.id)lm.clientKey=crypto.randomUUID();
    }
  }

  syncMediaPositions(local);

  // Patch DOM media keys only when necessary; do not re-render the whole editor here.
  for(const m of local.media){
    if(!m.id||!m.clientKey)continue;
    const el=editor.querySelector(`[data-media-key="${CSS.escape(m.clientKey)}"]`);
    if(!el)continue;
    el.dataset.mediaKey=m.id;
    // Les boutons haut/bas/remplacer/supprimer portent chacun leur
    // propre référence à l'ancien clientKey — jamais mise à jour par
    // un simple changement de l'attribut du conteneur. Sans ça, un
    // clic sur l'un d'eux après réconciliation cherche une clé qui
    // n'existe plus dans state.spaces, échoue silencieusement
    // (findIndex renvoie -1), et l'action ne fait rien.
    el.querySelectorAll('[data-up],[data-down],[data-remove],[data-replace]').forEach(btn=>{
      ['up','down','remove','replace'].forEach(attr=>{
        if(btn.dataset[attr]===m.clientKey)btn.dataset[attr]=m.id;
      });
    });
  }
}

async function createSpace(){
  state.save="saving";renderCommand();
  try{
    const created=await api(`/api/projects/${encodeURIComponent(projectId)}/studio/spaces`,{
      method:"POST",
      body:JSON.stringify({
        name:"",location:"",description:"",
        status:"designing",usages:[],position:state.spaces.length,media:[]
      })
    });
    const normalized=normalizeSpace(created);
    state.spaces.push(normalized);
    state.activeId=normalized.id;
    state.unpublished=true;state.save="saved";
    renderAll();
    requestAnimationFrame(()=>editor.querySelector(".space-title")?.focus());
  }catch(e){
    state.save="error";state.error=e;renderCommand();
  }
}

function moveMedia(key,delta){
  flushDomToState();
  const s=active();if(!s)return;
  const i=s.media.findIndex(m=>String(mediaKey(m))===String(key));
  const j=i+delta;if(i<0||j<0||j>=s.media.length)return;
  [s.media[i],s.media[j]]=[s.media[j],s.media[i]];
  syncMediaPositions(s);markDirty(s.id);renderEditor();
}

function removeMedia(key){
  flushDomToState();
  const s=active();if(!s)return;
  s.media=s.media.filter(m=>String(mediaKey(m))!==String(key));
  syncMediaPositions(s);markDirty(s.id);renderEditor();
}

function chooseFile(kind,replaceKey){
  flushDomToState();
  state.uploadError=null;
  fileInput.accept=
    kind==="view"?"image/png,image/jpeg":
    kind==="document"?"application/pdf":
    "image/png,image/jpeg,application/pdf";
  fileInput.dataset.kind=kind;
  fileInput.dataset.replace=replaceKey||"";
  fileInput.value="";
  fileInput.click();
}

async function uploadSelectedFile(file,kind,replaceKey){
  const s=active();if(!s)return;
  // Preserve unsaved text before any render caused by upload state.
  flushDomToState();

  state.uploading=true;state.kindPicker=false;state.uploadError=null;
  renderEditor();renderCommand();

  try{
    const fd=new FormData();
    fd.append("kind","space_media");
    fd.append("file",file);

    const asset=await api(`/api/projects/${encodeURIComponent(projectId)}/studio/assets`,{
      method:"POST",
      body:fd
    });

    // Front restriction mirrors the UX contract. Backend signature remains authoritative.
    if(kind==="view" && file.type==="application/pdf")throw new Error("Une vue doit être une image.");
    if(kind==="document" && file.type!=="application/pdf")throw new Error("Un document doit être un PDF.");

    flushDomToState();
    if(replaceKey){
      const m=s.media.find(x=>String(mediaKey(x))===String(replaceKey));
      if(m){
        m.assetId=asset.assetId;
        m.fileName=file.name;
        m.sizeLabel=formatSize(file.size);
      }
    }else{
      s.media.push({
        clientKey:crypto.randomUUID(),
        kind,
        assetId:asset.assetId,
        label:null,
        alt:null,
        fileName:file.name,
        sizeLabel:formatSize(file.size),
        position:s.media.length
      });
    }
    syncMediaPositions(s);
    state.uploading=false;
    markDirty(s.id);
    renderEditor();
    renderCommand();
  }catch(e){
    state.uploading=false;
    state.uploadError=e.message||"Impossible d’importer le média.";
    renderEditor();renderCommand();
  }
}

function formatSize(n){
  if(!Number.isFinite(n))return "";
  if(n<1024)return `${n} o`;
  if(n<1024*1024)return `${Math.round(n/1024)} Ko`;
  return `${(n/(1024*1024)).toFixed(1).replace(".",",")} Mo`;
}

fileInput.addEventListener("change",()=>{
  const file=fileInput.files?.[0];if(!file)return;
  uploadSelectedFile(file,fileInput.dataset.kind,fileInput.dataset.replace||null);
});

function openDelete(){
  const s=active();if(!s)return;
  state.deleteTarget=s.id;
  deleteSheet.hidden=false;
  requestAnimationFrame(()=>document.getElementById("cancelDelete").focus());
}
function closeDelete(){
  deleteSheet.hidden=true;
  state.deleteTarget=null;
  state.lastMenu?.focus();
}
async function confirmDelete(){
  const id=state.deleteTarget;
  const s=state.spaces.find(x=>String(x.id)===String(id));
  if(!s)return closeDelete();

  state.save="saving";renderCommand();
  try{
    await api(`/api/projects/${encodeURIComponent(projectId)}/studio/spaces/${encodeURIComponent(id)}?version=${encodeURIComponent(s.version)}`,{method:"DELETE"});
    state.spaces=state.spaces.filter(x=>String(x.id)!==String(id));
    state.activeId=state.spaces[0]?.id||null;
    state.unpublished=true;state.save="saved";
    deleteSheet.hidden=true;state.deleteTarget=null;
    renderAll();
  }catch(e){
    deleteSheet.hidden=true;state.deleteTarget=null;
    state.save=e.status===409?"conflict":"error";state.error=e;
    renderCommand();
  }
}

function renderCommand(){
  if(state.commandLocked)return;
  if(state.load==="loading")return setCommand('<span class="command-message">Chargement…</span>');
  if(state.uploading)return setCommand('<span class="command-message">Import du média…</span>');
  if(state.save==="dirty"||state.save==="saving")return setCommand('<span class="command-message">Enregistrement…</span>');
  if(state.save==="conflict")return setCommand('<span class="command-message"><strong>Cet espace a changé ailleurs.</strong></span><button class="command-button primary" data-cmd="reload" type="button">Recharger</button>');
  if(state.save==="error")return setCommand('<span class="command-message">Impossible d’enregistrer.</span><button class="command-button primary" data-cmd="retry" type="button">Réessayer</button>');
  if(state.unpublished)return setCommand('<span class="command-message">Tout est enregistré</span><button class="command-button primary" data-cmd="publish" type="button">Publier</button>');
  return setCommand('<span class="command-message"><strong>Espaces</strong> · Tout est enregistré</span>');
}

function setCommand(html){
  commandState.innerHTML=html;
  commandState.querySelector('[data-cmd="reload"]')?.addEventListener("click",hydrate);
  commandState.querySelector('[data-cmd="retry"]')?.addEventListener("click",()=>active()&&queueSave(active().id));
  commandState.querySelector('[data-cmd="publish"]')?.addEventListener("click",()=>{
    setCommand('<span class="command-message"><strong>Publier</strong> sera branché avec le pipeline de publication.</span>');
  });
}

commandLayer.addEventListener("focusin",()=>state.commandLocked=true);
commandLayer.addEventListener("focusout",e=>{
  if(commandLayer.contains(e.relatedTarget))return;
  state.commandLocked=false;renderCommand();
});

async function hydrate(){
  state.load="loading";state.error=null;renderAll();
  try{
    const [ctx,me,spaces]=await Promise.all([
      api(`/api/projects/${encodeURIComponent(projectId)}/context`),
      api("/api/me"),
      api(`/api/projects/${encodeURIComponent(projectId)}/studio/spaces`)
    ]);

    state.context=ctx;state.me=me;
    if(!hasCap("content.edit"))throw Object.assign(new Error("Forbidden"),{status:403});

    document.getElementById("brandProject").textContent=ctx.project?.name||"Projet";
    document.getElementById("avatarBtn").textContent=(me.displayName||"SU").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();

    state.spaces=(Array.isArray(spaces)?spaces:[]).map(normalizeSpace);
    if(!state.spaces.some(s=>String(s.id)===String(state.activeId)))state.activeId=state.spaces[0]?.id||null;
    state.load="ready";state.save="saved";
    renderAll();
  }catch(e){
    state.load="error";state.save="error";state.error=e;
    renderAll();
  }
}

function renderAll(){renderList();renderEditor();renderCommand()}

document.getElementById("projectLink").onclick=()=>location.assign(preserveDev(`/projects/${encodeURIComponent(projectId)}`));
document.getElementById("cancelDelete").onclick=closeDelete;
document.getElementById("confirmDelete").onclick=confirmDelete;

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(!deleteSheet.hidden){closeDelete();return}
    document.querySelectorAll(".popover").forEach(p=>p.hidden=true);
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".editor-head"))document.querySelectorAll(".popover").forEach(p=>p.hidden=true);
});
document.querySelectorAll(".nav-item").forEach(btn=>btn.addEventListener("click",()=>{
  if(btn.dataset.domain==="spaces")return;
  setCommand(`<span class="command-message"><strong>${esc(btn.textContent)}</strong> arrive dans une prochaine vertical slice.</span>`);
}));

hydrate();
</script>
</body>
</html>
