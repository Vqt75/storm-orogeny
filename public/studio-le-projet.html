gba(17,17,17,.045)}.sect+.sect{margin-top:30px;padding-top:28px;border-top:1px solid var(--l)}.lab{display:block;margin-bottom:7px;color:var(--q);font-size:10px;font-weight:760;letter-spacing:.1em;text-transform:uppercase}.sect h2{margin:0;font-size:20px}.help{margin:6px 0 16px;color:var(--m);font-size:12px;line-height:1.5}.edit{min-height:44px;padding:11px 13px;border-radius:15px;background:rgba(17,17,17,.035);outline:0;line-height:1.5}.edit.body{min-height:100px}.cards{display:grid;gap:10px}.card{padding:16px;border-radius:20px;background:rgba(246,246,243,.75)}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.type{font-size:10px;font-weight:780;text-transform:uppercase;letter-spacing:.1em;color:var(--q)}.actions{display:flex;gap:4px}.icon{width:34px;height:34px;border:0;border-radius:11px;background:transparent;color:var(--m)}.icon:hover{background:#fff;color:#111}.danger{color:#b42318}.switch{position:relative;width:50px;height:30px;border:0;border-radius:999px;background:rgba(17,17,17,.12)}.switch:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(17,17,17,.18)}.switch.on{background:#111}.switch.on:before{transform:translateX(20px)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.add{width:100%;min-height:48px;border:0;border-radius:16px;background:rgba(255,255,255,.5);color:var(--m);text-align:left;padding:0 14px;font-weight:690;margin-top:10px}.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;padding:10px;border-radius:18px;background:rgba(17,17,17,.035)}.picker button{min-height:42px;border:0;border-radius:13px;background:#fff}.items{display:grid;gap:8px;margin-top:10px}.item{display:grid;grid-template-columns:120px 1fr auto;gap:8px}.media{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-top:8px;padding:9px;border-radius:15px;background:#fff}.thumb{width:70px;height:52px;border-radius:11px;background:#e8e8e4;display:grid;place-items:center;color:var(--m);font-size:10px}.pill{min-height:34px;padding:0 11px;border:0;border-radius:999px;background:#fff;font-size:11px}.pill.active{background:#111;color:#fff}.statuses{display:flex;gap:6px;margin:10px 0}.team{display:grid;grid-template-columns:68px 1fr auto;gap:12px}.photo{width:68px;height:68px;border-radius:18px;background:#e8e8e4;display:grid;place-items:center;color:var(--m);font-size:10px}.cmd{position:fixed;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,calc(100vw - 28px));min-height:58px;padding:6px;border-radius:20px;background:var(--g);backdrop-filter:blur(28px);box-shadow:0 18px 54px rgba(17,17,17,.16)}.cmdin{min-height:46px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px}.cb{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:#111;color:#fff}.note{padding:12px 14px;border-radius:15px;background:rgba(17,17,17,.035);color:var(--m);font-size:11px;line-height:1.5}

<body><div class="shell"><header class="top"><div class="brand"><strong>Storm</strong><span id="brandProject">Projet</span></div><div class="acts"><button class="project" id="projectLink">Projet</button><button class="avatar" id="avatarBtn">VC</button></div></header><main><div class="grid"><nav aria-label="Studio"><button data-domain="homepage">Homepage</button><button class="active" data-domain="project">Le projet</button><button data-domain="spaces">Espaces</button><button data-domain="news">Actualités</button><button data-domain="ambassadors">Ambassadeurs</button><button data-domain="questions">Questions</button></nav><section><p class="eyebrow">Studio</p><h1>Le projet</h1><p class="lead">Racontez le projet, structurez ses temps forts et présentez les personnes qui le portent.</p><div class="tabs"><button class="tab active" data-tab="story">Récit</button><button class="tab" data-tab="milestones">Jalons</button><button class="tab" data-tab="team">Équipe projet</button></div><article class="panel" id="panel"></article></section></div></main></div><div class="cmd" id="commandLayer"><div class="cmdin" id="commandState" aria-live="polite"></div></div><input id="mediaInput" type="file" accept="image/png,image/jpeg" hidden><input id="teamPhotoInput" type="file" accept="image/png,image/jpeg" hidden>
<script>
/*
LE PROJET — API-AWARE FRONT HANDOFF V2
Backend expected after 3c59b61...:
GET/PATCH section-content/le_projet (fields strictly title/body)
GET/POST/PATCH/DELETE narrative-sections
GET/POST/PATCH/DELETE milestones
GET/POST/PATCH/DELETE team-members
POST studio/assets kind=narrative_media|team_photo

Narrative section:
{id,sectionType,payload,enabled,position,version,updatedAt,media:[{id,assetId,alt,position}]}
Types: focus,keyFigures,text,image,gallery,timeline,quote,choices,team.
Canonical Tectonic payloads:
focus/text {title,body}; keyFigures {title,items:[{value,label}]}; quote {quote,attribution};
choices {title,items:[{title,body}]}; image {caption}+media; gallery {title}+media; timeline/team {}.
timeline/team are semantic markers only: content is authoritative in milestones/team-members.
enabled=false hides without deleting payload/media.
Existing media ids must survive PATCH. clientKey is local only. Never reconcile stale server ordering over newer local ordering.
Milestone semantic fields expected: status(done|current|future), date, label, description, position.
Team semantic fields expected from Tectonic: name,title,group,photoAssetId,position. VERIFY exact API field names in repo and adapt front if needed.
*/
const TYPES=[["focus","Focus"],["keyFigures","Chiffres clés"],["text","Texte"],["image","Image"],["gallery","Galerie"],["timeline","Jalons"],["quote","Citation"],["choices","Choix"],["team","Équipe projet"]];
const state={context:null,me:null,tab:"story",intro:{title:"",body:""},introVersion:null,sections:[],milestones:[],team:[],load:"loading",save:"saved",unpublished:false,typePicker:false,timers:new Map(),inflight:new Map(),queued:new Set()};
const panel=document.getElementById("panel"),commandState=document.getElementById("commandState"),mediaInput=document.getElementById("mediaInput"),teamPhotoInput=document.getElementById("teamPhotoInput");
const projectId=(()=>{const m=location.pathname.match(/^\/projects\/([^/]+)\/studio(?:\/project)?\/?$/);return m?decodeURIComponent(m[1]):""})();
function devHeaders(){const d=new URLSearchParams(location.search).get("devUser");return d?{"X-Storm-Dev-User":d}:{}}function preserve(u){const d=new URLSearchParams(location.search).get("devUser");return d?u+(u.includes("?")?"&":"?")+"devUser="+encodeURIComponent(d):u}function esc(v=""){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}function has(c){return state.context?.membership?.capabilities?.includes(c)}
async function api(url,opt={}){const h={Accept:"application/json",...devHeaders(),...(opt.headers||{})};if(opt.body&&!(opt.body instanceof FormData))h["Content-Type"]="application/json";const r=await fetch(url,{...opt,credentials:"same-origin",headers:h});const t=r.headers.get("content-type")||"";const b=r.status===204?null:(t.includes("application/json")?await r.json():await r.text());if(!r.ok){const e=new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);e.status=r.status;throw e}return b}
function cmd(h){commandState.innerHTML=h;commandState.querySelector('[data-reload]')?.addEventListener("click",hydrate)}function renderCmd(){if(state.load==="loading")return cmd("Chargement…");if(state.save==="dirty"||state.save==="saving")return cmd("Enregistrement…");if(state.save==="conflict")return cmd('<strong>Le projet a changé ailleurs.</strong><button class="cb" data-reload>Recharger</button>');if(state.save==="error")return cmd("Impossible d’enregistrer.");if(state.unpublished)return cmd('Tout est enregistré <button class="cb">Publier</button>');cmd("<strong>Le projet</strong> · Tout est enregistré")}
// state.inflight/state.queued étaient déclarés mais jamais utilisés —
// dirty() ne faisait qu'un debounce simple, sans savoir qu'un appel
// précédent pour la MÊME clé pouvait être encore en vol. Deux saves
// concurrents pour la même ressource (ex: modifier le titre PUIS
// réordonner un média avant que le premier PATCH n'ait répondu)
// envoyaient alors deux PATCH avec la même version -- le second
// essuyait un 409 et son contenu (le réordonnancement) était perdu.
// Complété avec le même pattern déjà éprouvé sur Espaces/Actualités :
// un seul PATCH en vol par clé, les appels suivants se coalescent.
async function runGuarded(key,fn){
  if(state.inflight.get(key)){state.queued.add(key);return}
  state.inflight.set(key,true);
  try{await fn()}
  finally{
    state.inflight.delete(key);
    if(state.queued.has(key)){state.queued.delete(key);runGuarded(key,fn)}
  }
}
function dirty(key,fn){state.save="dirty";state.unpublished=true;renderCmd();clearTimeout(state.timers.get(key));state.timers.set(key,setTimeout(()=>runGuarded(key,fn),800))}function render(){if(state.load==="loading"){panel.innerHTML="<p>Chargement…</p>";return}state.tab==="story"?renderStory():state.tab==="milestones"?renderMilestones():renderTeam();renderCmd()}
function renderStory(){panel.innerHTML=`<section class="sect"><span class="lab">Introduction</span><h2>Présenter le projet</h2><p class="help">Le titre et le texte d’ouverture.</p><div class="grid2"><div class="edit" contenteditable data-intro="title">${esc(state.intro.title)}</div><div class="edit body" contenteditable data-intro="body">${esc(state.intro.body)}</div></div></section><section class="sect"><span class="lab">Sections</span><h2>Construire le récit</h2><p class="help">Activez, ordonnez et enrichissez les sections publiées dans Ivory.</p><div class="cards">${state.sections.map(sectionCard).join("")}</div><button class="add" id="addSection">+ Ajouter une section</button><div class="picker" ${state.typePicker?"":"hidden"}>${TYPES.map(([k,l])=>`<button data-new="${k}">${l}</button>`).join("")}</div></section>`;wireStory()}
function sectionCard(s,i){const p=s.payload||{};let body="";if(["focus","text"].includes(s.sectionType))body=`<div class="grid2"><div class="edit" contenteditable data-p="title">${esc(p.title)}</div><div class="edit body" contenteditable data-p="body">${esc(p.body)}</div></div>`;else if(s.sectionType==="quote")body=`<div class="grid2"><div class="edit body" contenteditable data-p="quote">${esc(p.quote)}</div><div class="edit" contenteditable data-p="attribution">${esc(p.attribution)}</div></div>`;else if(["keyFigures","choices"].includes(s.sectionType)){const a=Array.isArray(p.items)?p.items:[];const k1=s.sectionType==="keyFigures"?"value":"title",k2=s.sectionType==="keyFigures"?"label":"body";body=`<div class="edit" contenteditable data-p="title">${esc(p.title)}</div><div class="items">${a.map((x,j)=>`<div class="item" data-item="${j}"><div class="edit" contenteditable data-k="${k1}">${esc(x[k1])}</div><div class="edit" contenteditable data-k="${k2}">${esc(x[k2])}</div><button class="icon danger" data-rm-item="${j}">×</button></div>`).join("")}</div><button class="add" data-add-item>+ Ajouter</button>`}else if(["image","gallery"].includes(s.sectionType)){body=`${s.sectionType==="gallery"?`<div class="edit" contenteditable data-p="title">${esc(p.title)}</div>`:`<div class="edit" contenteditable data-p="caption">${esc(p.caption)}</div>`}<div>${(s.media||[]).map((m,j)=>`<div class="media"><div class="thumb">Image</div><div>${esc(m.alt||"Média")}</div><div class="actions"><button class="icon" data-mup="${j}">↑</button><button class="icon" data-mdn="${j}">↓</button><button class="icon danger" data-mrm="${j}">×</button></div></div>`).join("")}</div><button class="add" data-upload>+ Ajouter un média</button>`}else body=`<div class="note">${s.sectionType==="timeline"?"Le contenu vient des Jalons.":"Le contenu vient de l’Équipe projet."}</div>`;return `<section class="card" data-section="${s.id}"><div class="cardhead"><div class="type">${esc(TYPES.find(x=>x[0]===s.sectionType)?.[1]||s.sectionType)}</div><div class="actions"><button class="switch ${s.enabled?"on":""}" data-enabled aria-label="Afficher cette section"></button><button class="icon" data-up ${i===0?"disabled":""}>↑</button><button class="icon" data-down ${i===state.sections.length-1?"disabled":""}>↓</button><button class="icon danger" data-del>×</button></div></div><div style="margin-top:12px">${body}</div></section>`}
function syncSection(el,s){const p={...(s.payload||{})};el.querySelectorAll('[data-p]').forEach(x=>p[x.dataset.p]=x.textContent||"");if(["keyFigures","choices"].includes(s.sectionType))p.items=[...el.querySelectorAll('[data-item]')].map(r=>{const o={};r.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.textContent||"");return o});s.payload=p}
function wireStory(){panel.querySelectorAll('[data-intro]').forEach(x=>x.addEventListener("input",()=>{state.intro[x.dataset.intro]=x.textContent||"";dirty("intro",saveIntro)}));document.getElementById("addSection").onclick=()=>{state.typePicker=!state.typePicker;renderStory()};panel.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>createSection(b.dataset.new));panel.querySelectorAll('[data-section]').forEach(el=>{const s=state.sections.find(x=>String(x.id)===String(el.dataset.section));el.querySelectorAll('[contenteditable]').forEach(x=>x.addEventListener("input",()=>{syncSection(el,s);dirty("s:"+s.id,()=>saveSection(s))}));el.querySelector('[data-enabled]').onclick=()=>{syncSection(el,s);s.enabled=!s.enabled;dirty("s:"+s.id,()=>saveSection(s));renderStory()};el.querySelector('[data-up]').onclick=()=>moveSection(s,-1);el.querySelector('[data-down]').onclick=()=>moveSection(s,1);el.querySelector('[data-del]').onclick=()=>deleteSection(s);el.querySelector('[data-add-item]')?.addEventListener("click",()=>{syncSection(el,s);s.payload.items=[...(s.payload.items||[]),s.sectionType==="keyFigures"?{value:"",label:""}:{title:"",body:""}];dirty("s:"+s.id,()=>saveSection(s));renderStory()});el.querySelectorAll('[data-rm-item]').forEach(b=>b.onclick=()=>{syncSection(el,s);s.payload.items.splice(Number(b.dataset.rmItem),1);dirty("s:"+s.id,()=>saveSection(s));renderStory()});el.querySelector('[data-upload]')?.addEventListener("click",()=>{mediaInput.dataset.section=s.id;mediaInput.value="";mediaInput.click()});el.querySelectorAll('[data-mup]').forEach(b=>b.onclick=()=>moveMedia(s,Number(b.dataset.mup),-1));el.querySelectorAll('[data-mdn]').forEach(b=>b.onclick=()=>moveMedia(s,Number(b.dataset.mdn),1));el.querySelectorAll('[data-mrm]').forEach(b=>b.onclick=()=>{s.media.splice(Number(b.dataset.mrm),1);dirty("s:"+s.id,()=>saveSection(s));renderStory()})})}
async function saveIntro(){state.save="saving";renderCmd();try{const body={fields:{title:state.intro.title||"",body:state.intro.body||""}};if(state.introVersion!=null)body.version=state.introVersion;const u=await api(`/api/projects/${projectId}/studio/section-content/le_projet`,{method:"PATCH",body:JSON.stringify(body)});state.introVersion=u.version;state.save="saved"}catch(e){state.save=e.status===409?"conflict":"error"}renderCmd()}
async function createSection(type){try{const c=await api(`/api/projects/${projectId}/studio/narrative-sections`,{method:"POST",body:JSON.stringify({sectionType:type,payload:{},enabled:true,position:state.sections.length,media:[]})});state.sections.push(c);state.typePicker=false;render()}catch(e){state.save="error";renderCmd()}}
async function saveSection(s){state.save="saving";renderCmd();try{const media=(s.media||[]).map((m,i)=>{const o={assetId:m.assetId,alt:m.alt??null,position:i};if(m.id)o.id=m.id;return o});const u=await api(`/api/projects/${projectId}/studio/narrative-sections/${s.id}`,{method:"PATCH",body:JSON.stringify({version:s.version,sectionType:s.sectionType,payload:s.payload||{},enabled:s.enabled!==false,position:s.position,media})});s.version=u.version;s.updatedAt=u.updatedAt;reconcileMedia(s,u.media||[]);state.save="saved"}catch(e){state.save=e.status===409?"conflict":"error"}renderCmd()}
function reconcileMedia(s,server){const local=s.media||[];for(const sm of server){let lm=local.find(x=>x.id===sm.id)||local.find(x=>!x.id&&x.assetId===sm.assetId);if(lm){const{position,...rest}=sm;Object.assign(lm,rest)}else local.push(sm)}s.media=local.filter(x=>!x.id||server.some(y=>y.id===x.id)||x.clientKey)}function moveSection(s,d){const i=state.sections.indexOf(s),j=i+d;if(j<0||j>=state.sections.length)return;[state.sections[i],state.sections[j]]=[state.sections[j],state.sections[i]];state.sections.forEach((x,k)=>x.position=k);dirty("s:"+state.sections[i].id,()=>saveSection(state.sections[i]));dirty("s:"+state.sections[j].id,()=>saveSection(state.sections[j]));renderStory()}async function deleteSection(s){await api(`/api/projects/${projectId}/studio/narrative-sections/${s.id}?version=${s.version}`,{method:"DELETE"});state.sections=state.sections.filter(x=>x!==s);renderStory()}function moveMedia(s,i,d){const j=i+d;if(j<0||j>=s.media.length)return;[s.media[i],s.media[j]]=[s.media[j],s.media[i]];dirty("s:"+s.id,()=>saveSection(s));renderStory()}
mediaInput.onchange=async()=>{const file=mediaInput.files?.[0],s=state.sections.find(x=>String(x.id)===String(mediaInput.dataset.section));if(!file||!s)return;const fd=new FormData();fd.append("kind","narrative_media");fd.append("file",file);try{const a=await api(`/api/projects/${projectId}/studio/assets`,{method:"POST",body:fd});s.media.push({clientKey:crypto.randomUUID(),assetId:a.assetId,alt:"",position:s.media.length});dirty("s:"+s.id,()=>saveSection(s));renderStory()}catch(e){state.save="error";renderCmd()}}
function renderMilestones(){panel.innerHTML=`<span class="lab">Jalons</span><h2>Les étapes du projet</h2><p class="help">Ces jalons alimentent aussi la Homepage lorsqu’elle affiche l’avancement.</p><div class="cards">${state.milestones.map((m,i)=>`<section class="card" data-ms="${m.id}"><div class="cardhead"><div class="type">Jalon ${i+1}</div><div class="actions"><button class="icon" data-up ${i===0?"disabled":""}>↑</button><button class="icon" data-down ${i===state.milestones.length-1?"disabled":""}>↓</button><button class="icon danger" data-del>×</button></div></div><div class="statuses">${["done","current","future"].map(x=>`<button class="pill ${m.status===x?"active":""}" data-status="${x}">${x==="done"?"Passé":x==="current"?"En cours":"À venir"}</button>`).join("")}</div><div class="grid2"><div class="edit" contenteditable data-f="dateLabel">${esc(m.dateLabel)}</div><div class="edit" contenteditable data-f="label">${esc(m.label)}</div></div><div class="edit body" contenteditable data-f="description" style="margin-top:8px">${esc(m.description)}</div></section>`).join("")}</div><button class="add" id="addMs">+ Ajouter un jalon</button>`;document.getElementById("addMs").onclick=createMilestone;panel.querySelectorAll('[data-ms]').forEach(el=>{const m=state.milestones.find(x=>String(x.id)===String(el.dataset.ms));el.querySelectorAll('[data-f]').forEach(x=>x.addEventListener("input",()=>{m[x.dataset.f]=x.textContent||"";dirty("m:"+m.id,()=>saveMilestone(m))}));el.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{m.status=b.dataset.status;dirty("m:"+m.id,()=>saveMilestone(m));renderMilestones()});el.querySelector('[data-up]').onclick=()=>moveMilestone(m,-1);el.querySelector('[data-down]').onclick=()=>moveMilestone(m,1);el.querySelector('[data-del]').onclick=()=>deleteMilestone(m)})}
async function createMilestone(){const c=await api(`/api/projects/${projectId}/studio/milestones`,{method:"POST",body:JSON.stringify({status:"future",dateLabel:"",label:"",description:"",position:state.milestones.length})});state.milestones.push(c);renderMilestones()}async function saveMilestone(m){try{const u=await api(`/api/projects/${projectId}/studio/milestones/${m.id}`,{method:"PATCH",body:JSON.stringify({version:m.version,status:m.status,dateLabel:m.dateLabel,label:m.label,description:m.description,position:m.position})});m.version=u.version;state.save="saved"}catch(e){state.save=e.status===409?"conflict":"error"}renderCmd()}function moveMilestone(m,d){const i=state.milestones.indexOf(m),j=i+d;if(j<0||j>=state.milestones.length)return;[state.milestones[i],state.milestones[j]]=[state.milestones[j],state.milestones[i]];state.milestones.forEach((x,k)=>x.position=k);dirty("m:"+state.milestones[i].id,()=>saveMilestone(state.milestones[i]));dirty("m:"+state.milestones[j].id,()=>saveMilestone(state.milestones[j]));renderMilestones()}async function deleteMilestone(m){await api(`/api/projects/${projectId}/studio/milestones/${m.id}?version=${m.version}`,{method:"DELETE"});state.milestones=state.milestones.filter(x=>x!==m);renderMilestones()}
function renderTeam(){panel.innerHTML=`<span class="lab">Équipe projet</span><h2>Les personnes qui portent le projet</h2><p class="help">Cette collection alimente la section « Équipe projet » du récit.</p><div class="cards">${state.team.map((m,i)=>`<section class="card team" data-t="${m.id}"><div class="photo">Photo</div><div><div class="edit" contenteditable data-f="name">${esc(m.name)}</div><div class="edit" contenteditable data-f="title" style="margin-top:7px">${esc(m.title??m.role)}</div><div class="edit" contenteditable data-f="badge" style="margin-top:7px">${esc(m.badge)}</div><button class="add" data-photo>Ajouter / remplacer la photo</button></div><div class="actions"><button class="icon" data-up ${i===0?"disabled":""}>↑</button><button class="icon" data-down ${i===state.team.length-1?"disabled":""}>↓</button><button class="icon danger" data-del>×</button></div></section>`).join("")}</div><button class="add" id="addTeam">+ Ajouter un membre</button>`;document.getElementById("addTeam").onclick=createTeam;panel.querySelectorAll('[data-t]').forEach(el=>{const m=state.team.find(x=>String(x.id)===String(el.dataset.t));el.querySelectorAll('[data-f]').forEach(x=>x.addEventListener("input",()=>{m[x.dataset.f]=x.textContent||"";dirty("t:"+m.id,()=>saveTeam(m))}));el.querySelector('[data-photo]').onclick=()=>{teamPhotoInput.dataset.member=m.id;teamPhotoInput.value="";teamPhotoInput.click()};el.querySelector('[data-up]').onclick=()=>moveTeam(m,-1);el.querySelector('[data-down]').onclick=()=>moveTeam(m,1);el.querySelector('[data-del]').onclick=()=>deleteTeam(m)})}
async function createTeam(){const c=await api(`/api/projects/${projectId}/studio/team-members`,{method:"POST",body:JSON.stringify({name:"",title:"",badge:"",photoAssetId:null,position:state.team.length})});state.team.push(c);renderTeam()}async function saveTeam(m){try{const u=await api(`/api/projects/${projectId}/studio/team-members/${m.id}`,{method:"PATCH",body:JSON.stringify({version:m.version,name:m.name||"",title:m.title??m.role??"",badge:m.badge||"",photoAssetId:m.photoAssetId??null,position:m.position})});m.version=u.version;state.save="saved"}catch(e){state.save=e.status===409?"conflict":"error"}renderCmd()}function moveTeam(m,d){const i=state.team.indexOf(m),j=i+d;if(j<0||j>=state.team.length)return;[state.team[i],state.team[j]]=[state.team[j],state.team[i]];state.team.forEach((x,k)=>x.position=k);dirty("t:"+state.team[i].id,()=>saveTeam(state.team[i]));dirty("t:"+state.team[j].id,()=>saveTeam(state.team[j]));renderTeam()}async function deleteTeam(m){await api(`/api/projects/${projectId}/studio/team-members/${m.id}?version=${m.version}`,{method:"DELETE"});state.team=state.team.filter(x=>x!==m);renderTeam()}
teamPhotoInput.onchange=async()=>{const f=teamPhotoInput.files?.[0],m=state.team.find(x=>String(x.id)===String(teamPhotoInput.dataset.member));if(!f||!m)return;const fd=new FormData();fd.append("kind","team_photo");fd.append("file",f);try{const a=await api(`/api/projects/${projectId}/studio/assets`,{method:"POST",body:fd});m.photoAssetId=a.assetId;dirty("t:"+m.id,()=>saveTeam(m));renderTeam()}catch(e){state.save="error";renderCmd()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle("active",x===b));render()});async function hydrate(){state.load="loading";render();try{const[ctx,me,intro,sections,milestones,team]=await Promise.all([api(`/api/projects/${projectId}/context`),api('/api/me'),api(`/api/projects/${projectId}/studio/section-content/le_projet`),api(`/api/projects/${projectId}/studio/narrative-sections`),api(`/api/projects/${projectId}/studio/milestones`),api(`/api/projects/${projectId}/studio/team-members`)]);state.context=ctx;state.me=me;if(!has("content.edit"))throw Object.assign(new Error("Forbidden"),{status:403});state.intro={title:intro?.fields?.title??"",body:intro?.fields?.body??""};state.introVersion=intro?.version??null;state.sections=Array.isArray(sections)?sections:[];state.milestones=Array.isArray(milestones)?milestones:[];state.team=Array.isArray(team)?team:[];document.getElementById("brandProject").textContent=ctx.project?.name||"Projet";document.getElementById("avatarBtn").textContent=(me.displayName||"SU").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();state.load="ready";state.save="saved";render()}catch(e){state.load="error";state.save="error";panel.innerHTML='<p>Storm n’arrive pas à ouvrir Le projet.</p>';renderCmd()}}document.getElementById("projectLink").onclick=()=>location.assign(preserve(`/projects/${projectId}`));hydrate();
</script></body></html>
