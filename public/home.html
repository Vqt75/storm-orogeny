<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Home — Orogeny · V4 integration-ready</title>
<style>
  :root{
    --canvas:#f6f6f3;
    --surface:#ffffff;
    --ink:#111111;
    --graphite:#3f3f42;
    --muted:#747478;
    --line:rgba(17,17,17,.09);
    --line-strong:rgba(17,17,17,.16);
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow:0 20px 54px rgba(17,17,17,.085);
    --radius-xl:30px;
  }

  *{box-sizing:border-box}

  html{
    background:var(--canvas);
    scroll-timeline-name:--storm-page;
    scroll-timeline-axis:block;
  }

  body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 12% -10%,rgba(255,255,255,.98),transparent 34%),
      var(--canvas);
    color:var(--ink);
    font-family:Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  button{font:inherit;color:inherit}

  .shell{
    min-height:100vh;
    padding:22px 28px 46px;
  }

  /* Functional glass only: navigation, never content. */
  .topbar{
    --glass-tint:255,255,255;
    position:sticky;
    top:16px;
    z-index:30;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 0 20px;
    border:1px solid rgba(255,255,255,.72);
    background:rgba(255,255,255,.36);
    backdrop-filter:blur(24px) saturate(175%) contrast(102%);
    -webkit-backdrop-filter:blur(24px) saturate(175%) contrast(102%);
    border-radius:20px;
    box-shadow:
      0 10px 34px rgba(17,17,17,.07),
      inset 0 1px 0 rgba(255,255,255,.78),
      inset 0 -1px 0 rgba(17,17,17,.04);
    overflow:hidden;
    isolation:isolate;
    transform-origin:top center;
  }

  .topbar::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    background:
      linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.22)),
      rgba(var(--glass-tint),.10);
    transition:background .36s var(--ease);
  }

  .topbar::after{
    content:"";
    position:absolute;
    z-index:-1;
    left:10%;
    right:10%;
    top:-48%;
    height:78%;
    border-radius:50%;
    background:rgba(255,255,255,.46);
    filter:blur(18px);
    opacity:.72;
    pointer-events:none;
  }

  @supports (animation-timeline:--storm-page){
    .topbar{
      animation:storm-topbar-scroll linear both;
      animation-timeline:--storm-page;
      animation-range:0 420px;
    }
  }

  @keyframes storm-topbar-scroll{
    0%{
      opacity:1;
      transform:translateY(0) scale(1);
      border-radius:20px;
    }
    44%{
      opacity:1;
      transform:translateY(-2px) scale(.985);
      border-radius:18px;
    }
    66%{
      opacity:1;
      transform:translateY(-4px) scale(.97);
    }
    100%{
      opacity:0;
      transform:translateY(-82px) scale(.94);
      pointer-events:none;
    }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.03em;
  }

  .top-actions{
    display:flex;
    align-items:center;
    gap:5px;
    padding:3px;
    border:1px solid rgba(255,255,255,.54);
    border-radius:15px;
    background:rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.62);
  }

  .control-link,
  .avatar-btn,
  .popover-action{
    border:0;
    cursor:pointer;
  }

  .control-link{
    background:transparent;
    padding:9px 12px;
    border-radius:11px;
    font-size:13px;
    font-weight:650;
    transition:background .18s var(--ease),transform .18s var(--ease);
  }

  .control-link:hover,
  .control-link:focus-visible{
    background:rgba(255,255,255,.48);
  }

  .avatar-wrap{position:relative}

  .avatar-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#111;
    color:#fff;
    font-size:12px;
    font-weight:750;
    letter-spacing:.02em;
  }

  .control-link:focus-visible,
  .avatar-btn:focus-visible,
  .popover-action:focus-visible,
  .card-select:focus-visible,
  .card-action:focus-visible{
    outline:3px solid rgba(17,17,17,.12);
    outline-offset:3px;
  }

  .account-popover{
    position:absolute;
    right:0;
    top:48px;
    width:254px;
    padding:9px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.64);
    background:rgba(249,249,247,.60);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    box-shadow:
      0 22px 54px rgba(17,17,17,.16),
      inset 0 1px 0 rgba(255,255,255,.82);
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px) scale(.985);
    transform-origin:top right;
    transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s;
  }

  .account-popover.open{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
  }

  .account-head{
    padding:12px 12px 11px;
    border-bottom:1px solid rgba(17,17,17,.07);
    margin-bottom:5px;
  }

  .account-head strong{
    display:block;
    font-size:14px;
    margin-bottom:3px;
  }

  .account-head span{
    color:var(--muted);
    font-size:12px;
  }

  .popover-action{
    width:100%;
    background:transparent;
    border-radius:11px;
    text-align:left;
    padding:10px 12px;
    font-size:13px;
  }

  .popover-action:hover{background:rgba(17,17,17,.05)}
  .popover-control{display:none}

  main{
    width:min(1380px,100%);
    margin:0 auto;
    padding:118px 2px 0;
  }

  .intro{
    margin-bottom:68px;
  }

  .eyebrow{
    margin:0 0 14px;
    color:var(--muted);
    font-size:12px;
    font-weight:750;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    font-size:clamp(58px,7.1vw,112px);
    line-height:.88;
    letter-spacing:-.068em;
    font-weight:620;
  }

  .home-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 318px;
    gap:24px;
    align-items:start;
  }

  .projects-zone,
  .companion-zone{
    min-width:0;
  }

  .section-title{
    margin:0 0 18px;
    font-size:14px;
    font-weight:700;
    letter-spacing:-.01em;
  }

  .project-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
  }

  .companion-grid{
    display:grid;
    gap:16px;
  }

  /* One interaction grammar. The object appears first; the action is revealed only after intent. */
  .interactive-card{
    --accent:#111;
    --accent-deep:#111;
    position:relative;
    min-width:0;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    overflow:hidden;
    background:var(--surface);
    transition:
      transform .26s var(--ease),
      box-shadow .26s var(--ease),
      border-color .26s var(--ease),
      background .26s var(--ease);
  }

  .project-card{min-height:344px}
  .utility-card{min-height:226px}

  .card-select{
    position:relative;
    z-index:2;
    width:100%;
    min-height:inherit;
    border:0;
    background:transparent;
    cursor:pointer;
    text-align:left;
    padding:26px 26px 78px;
    display:block;
  }

  .interactive-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
    border-color:var(--line-strong);
  }

  .interactive-card.is-selected{
    border-color:rgba(17,17,17,.24);
    box-shadow:0 0 0 3px rgba(17,17,17,.045),var(--shadow);
  }

  .project-card::before{
    content:"";
    position:absolute;
    width:290px;
    height:290px;
    border-radius:50%;
    right:-112px;
    top:-122px;
    background:var(--accent);
    opacity:.14;
    transform:scale(.93);
    transition:transform .50s var(--ease),opacity .50s var(--ease);
    pointer-events:none;
  }

  .project-card:hover::before,
  .project-card.is-selected::before{
    transform:scale(1.05);
    opacity:.19;
  }

  .project-kicker{
    position:relative;
    z-index:2;
    color:var(--muted);
    font-size:13px;
    font-weight:650;
  }

  .identity-mark{
    position:absolute;
    right:26px;
    top:26px;
    width:74px;
    height:74px;
    display:grid;
    place-items:center;
    border-radius:22px;
    background:var(--accent-deep);
    color:#fff;
    font-size:24px;
    font-weight:760;
    box-shadow:0 14px 30px rgba(17,17,17,.12);
    transform:rotate(3deg);
    transition:transform .38s var(--ease);
  }

  .project-card.is-selected .identity-mark{transform:rotate(0)}

  .project-body{
    position:absolute;
    z-index:2;
    left:26px;
    right:26px;
    bottom:78px;
  }

  .project-name{
    margin:0;
    max-width:76%;
    font-size:clamp(34px,3.7vw,54px);
    line-height:.96;
    letter-spacing:-.058em;
    font-weight:640;
    overflow-wrap:anywhere;
  }

  .project-meta{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }

  .action-slot{
    position:absolute;
    z-index:5;
    left:26px;
    bottom:22px;
    height:34px;
    display:flex;
    align-items:center;
  }

  .card-action{
    border:0;
    background:transparent;
    padding:7px 0;
    color:var(--ink);
    font-size:14px;
    font-weight:750;
    cursor:pointer;
    opacity:0;
    visibility:hidden;
    transform:translateY(4px);
    pointer-events:none;
    transition:opacity .16s var(--ease),transform .16s var(--ease),visibility .16s;
  }

  .card-action:hover{
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .interactive-card.is-selected .card-action{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
  }

  /* Creation is a possibility, not a project. */
  .create-card{
    background:rgba(255,255,255,.18);
    border:1px dashed rgba(17,17,17,.20);
  }

  .create-card:hover,
  .create-card.is-selected{
    background:rgba(255,255,255,.56);
  }

  .utility-card .card-select{
    padding:24px 24px 72px;
  }

  .utility-symbol{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:50%;
    margin-bottom:30px;
    background:#111;
    color:#fff;
    font-size:24px;
    font-weight:400;
  }

  .utility-title{
    margin:0 0 8px;
    font-size:22px;
    line-height:1.05;
    letter-spacing:-.035em;
    font-weight:680;
  }

  .utility-copy{
    margin:0;
    max-width:250px;
    color:var(--muted);
    font-size:13px;
    line-height:1.45;
  }

  /* Meet Storm is editorial and persistent: deliberately not styled as a project. */
  .discover-card{
    --discover-ink:#f5f5f2;
    border-color:rgba(255,255,255,.08);
    background:
      radial-gradient(circle at 85% 8%,rgba(255,255,255,.13),transparent 32%),
      linear-gradient(145deg,#111 0%,#1b1b1e 100%);
    color:var(--discover-ink);
    box-shadow:0 22px 58px rgba(17,17,17,.13);
  }

  .discover-card:hover,
  .discover-card.is-selected{
    border-color:rgba(255,255,255,.20);
    box-shadow:0 24px 66px rgba(17,17,17,.20);
  }

  .discover-card .utility-copy{color:rgba(245,245,242,.62)}
  .discover-card .card-action{color:var(--discover-ink)}

  .discover-kicker{
    display:block;
    margin-bottom:30px;
    color:rgba(245,245,242,.52);
    font-size:11px;
    font-weight:760;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .discover-card::after{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    right:-62px;
    bottom:-84px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
      0 0 0 26px rgba(255,255,255,.025),
      0 0 0 56px rgba(255,255,255,.018);
    pointer-events:none;
  }

  .empty-projects{
    min-height:344px;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    background:rgba(255,255,255,.28);
    display:flex;
    align-items:flex-end;
    padding:28px;
  }

  .empty-projects strong{
    display:block;
    margin-bottom:7px;
    font-size:22px;
    letter-spacing:-.035em;
  }

  .empty-projects span{
    display:block;
    max-width:390px;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }

  .home-status{
    margin-top:16px;
  }

  .status-panel{
    min-height:220px;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    background:rgba(255,255,255,.42);
    padding:28px;
    display:flex;
    align-items:flex-end;
  }

  .status-panel strong{
    display:block;
    margin-bottom:7px;
    font-size:22px;
    letter-spacing:-.035em;
  }

  .status-panel p{
    margin:0;
    max-width:440px;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }

  .retry-action{
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:#111;
    color:#fff;
    padding:10px 14px;
    font-weight:700;
    cursor:pointer;
  }

  .skeleton-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
  }

  .skeleton-card{
    min-height:344px;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    background:linear-gradient(105deg,rgba(255,255,255,.34) 18%,rgba(255,255,255,.76) 38%,rgba(255,255,255,.34) 58%);
    background-size:220% 100%;
    animation:storm-skeleton 1.25s linear infinite;
  }

  @keyframes storm-skeleton{
    to{background-position-x:-220%}
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    z-index:60;
    transform:translate(-50%,10px);
    padding:11px 15px;
    border-radius:13px;
    background:#111;
    color:#fff;
    box-shadow:0 16px 40px rgba(17,17,17,.24);
    font-size:13px;
    opacity:0;
    visibility:hidden;
    transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s;
  }

  .toast.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
  }

  @media(max-width:1120px){
    .home-layout{grid-template-columns:1fr}
    .companion-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .utility-card{min-height:238px}
  }

  @media(max-width:780px){
    .shell{padding:14px 14px 36px}

    .topbar{
      top:10px;
      height:58px;
      padding-left:15px;
      border-radius:18px;
    }

    @supports (animation-timeline:--storm-page){
      .topbar{
        position:fixed;
        left:50%;
        width:calc(100vw - 28px);
        transform:translateX(-50%);
        animation:storm-mobile-topbar-scroll linear both;
        animation-timeline:--storm-page;
        animation-range:0 300px;
      }
    }

    @keyframes storm-mobile-topbar-scroll{
      0%{
        width:calc(100vw - 28px);
        opacity:1;
        transform:translateX(-50%) translateY(0) scale(1);
      }
      45%{
        width:148px;
        opacity:1;
        transform:translateX(-50%) translateY(0) scale(.985);
      }
      68%{
        width:148px;
        opacity:1;
        transform:translateX(-50%) translateY(-2px) scale(.98);
      }
      100%{
        width:148px;
        opacity:0;
        transform:translateX(-50%) translateY(-76px) scale(.94);
        pointer-events:none;
      }
    }

    .control-link{display:none}
    .popover-control{display:block}

    main{padding-top:114px}

    .intro{margin-bottom:46px}

    h1{font-size:clamp(48px,15vw,74px)}

    .project-grid{grid-template-columns:1fr}
    .skeleton-grid{grid-template-columns:1fr}
    .companion-grid{grid-template-columns:1fr}
    .project-card{min-height:302px}
    .utility-card{min-height:218px}
    .project-name{max-width:70%}

  }

  @media(max-width:430px){
    .top-actions{background:transparent;border:0;box-shadow:none}
    .project-name{font-size:36px}
    .identity-mark{width:68px;height:68px;right:22px;top:22px;border-radius:20px}
    .card-select{padding-left:22px;padding-right:22px}
    .project-body{left:22px;right:22px}
    .action-slot{left:22px}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      transition:none!important;
      animation:none!important;
      scroll-behavior:auto!important;
    }

    .topbar{
      position:sticky!important;
      left:auto!important;
      width:auto!important;
      transform:none!important;
      opacity:1!important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar">
    <div class="brand" aria-label="Storm Home">Storm</div>

    <div class="top-actions">
      <button class="control-link" id="controlLink" type="button" hidden>Storm Control</button>
      <div class="avatar-wrap">
        <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Compte" aria-expanded="false">VC</button>
        <div class="account-popover" id="accountPopover" role="dialog" aria-label="Compte">
          <div class="account-head">
            <strong id="accountName">Vivien Cocquet-Huard</strong>
            <span id="accountOrg">Storm · Parella</span>
          </div>
          <button class="popover-action popover-control" id="controlMenuItem" type="button" hidden>Storm Control</button>
          <button class="popover-action" type="button">Mon compte</button>
          <button class="popover-action" type="button">Préférences</button>
          <button class="popover-action" type="button">Se déconnecter</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="homeTitle">
      <div>
        <p class="eyebrow">Storm Home</p>
        <h1 id="homeTitle">Bonjour <span id="firstName">Vivien</span>.</h1>
      </div>
    </section>

    <div class="home-layout">
      <section class="projects-zone" aria-labelledby="projectsTitle">
        <h2 class="section-title" id="projectsTitle">Vos projets</h2>
        <div class="project-grid" id="projectGrid"></div>
        <div class="empty-projects" id="emptyProjects" hidden>
          <div>
            <strong>Aucun projet pour le moment.</strong>
            <span>Les projets auxquels vous avez accès apparaîtront ici.</span>
          </div>
        </div>
        <div class="home-status" id="homeStatus" aria-live="polite"></div>
      </section>

      <aside class="companion-zone" aria-label="Actions et découverte">
        <h2 class="section-title">À portée de main</h2>
        <div class="companion-grid">
          <article class="interactive-card utility-card create-card" id="createCard" hidden>
            <button class="card-select" type="button" aria-expanded="false" aria-label="Nouveau projet">
              <span class="utility-symbol" aria-hidden="true">+</span>
              <h3 class="utility-title">Nouveau projet</h3>
              <p class="utility-copy">Un nouveau projet, guidé dès le départ.</p>
            </button>
            <div class="action-slot">
              <button class="card-action" type="button" data-action="create">Créer</button>
            </div>
          </article>

          <article class="interactive-card utility-card discover-card" id="discoverCard">
            <button class="card-select" type="button" aria-expanded="false" aria-label="Découvrez Storm">
              <span class="discover-kicker" aria-hidden="true">Meet Storm</span>
              <h3 class="utility-title">Découvrez Storm</h3>
              <p class="utility-copy">Pensé pour les projets en mouvement.</p>
            </button>
            <div class="action-slot">
              <button class="card-action" type="button" data-action="discover">Découvrir</button>
            </div>
          </article>
        </div>
      </aside>
    </div>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  /*
    Storm Home — integration-ready front slice.

    Production contract:
      GET /api/me
        -> { id, displayName, organization?: { id, name, capabilities: string[] } }
      GET /api/projects
        -> [{ id, name, identity?: { accent?: string } }]

    Capabilities are organization-scoped only — never an aggregate of
    project-level rights. A right does not exist by name alone; it
    exists in a context (see docs/contracts/permissions.md).
    Safe default: if capabilities are absent, privileged UI stays hidden.
    Development only: ?devUser=<uuid> forwards X-Storm-Dev-User.
  */

  // createProject (Phase 1B), control (Phase 1C) et project (Phase 2A)
  // mènent désormais à de vraies routes. meetStorm reste en attente de
  // sa construction — cette destination affiche un feedback discret
  // plutôt que de naviguer vers une route qui n'existe pas encore
  // côté serveur (voir showComingSoon plus bas).
  const ROUTES = Object.freeze({
    project: id => `/projects/${encodeURIComponent(id)}`,
    createProject: '/projects/new',
    meetStorm: '/meet',
    control: '/control'
  });

  const projectGrid = document.getElementById('projectGrid');
  const emptyProjects = document.getElementById('emptyProjects');
  const homeStatus = document.getElementById('homeStatus');
  const createCard = document.getElementById('createCard');
  const controlLink = document.getElementById('controlLink');
  const controlMenuItem = document.getElementById('controlMenuItem');
  const firstName = document.getElementById('firstName');
  const accountName = document.getElementById('accountName');
  const accountOrg = document.getElementById('accountOrg');
  const avatarBtn = document.getElementById('avatarBtn');
  const discoverCard = document.getElementById('discoverCard');
  const accountPopover = document.getElementById('accountPopover');
  const toast = document.getElementById('toast');

  let selectedCard = null;
  let currentContext = null;

  function initials(name='Storm User'){
    return name
      .trim()
      .split(/\s+/)
      .slice(0,2)
      .map(part => part[0]?.toUpperCase() || '')
      .join('') || 'S';
  }

  function firstNameOf(name=''){
    return name.trim().split(/\s+/)[0] || 'bonjour';
  }

  function projectInitial(name='Projet'){
    return (name.trim()[0] || 'P').toUpperCase();
  }

  function escapeHtml(value=''){
    return String(value).replace(/[&<>'"]/g, char => ({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    })[char]);
  }

  function safeAccent(project){
    const accent = project?.identity?.accent;
    return /^#[0-9a-f]{6}$/i.test(accent || '') ? accent : '#8a8a8d';
  }

  function hasCapability(me, capability){
    return Array.isArray(me?.organization?.capabilities) && me.organization.capabilities.includes(capability);
  }

  // Amorçage d'identité pour l'instance de démonstration — jamais un
  // nouveau mécanisme d'authentification, seulement la même identité
  // ?devUser= que le développement, résolue une fois via le serveur
  // quand DEMO_ALLOW_HEADER_IDENTITY_IN_PRODUCTION est explicitement
  // actif (voir src/http/routes/demoIdentity.js). Un ?devUser= déjà
  // présent dans l'URL garde toujours la priorité — jamais écrasé.
  let resolvedDemoUserId = null;

  async function resolveDemoIdentity(){
    if (new URLSearchParams(location.search).get('devUser')) return;
    try{
      const response = await fetch('/api/demo-identity', {headers:{'Accept':'application/json'}});
      if (!response.ok) return;
      const body = await response.json();
      if (body && typeof body.userId === 'string') resolvedDemoUserId = body.userId;
    }catch(error){
      // Silencieux — absence de mode démo actif, comportement normal.
    }
  }

  function currentDevUser(){
    return new URLSearchParams(location.search).get('devUser') || resolvedDemoUserId;
  }

  function devHeaders(){
    const devUser = currentDevUser();
    return devUser ? {'X-Storm-Dev-User':devUser} : {};
  }

  // Préserve ?devUser= (explicite ou résolu via le mode démo) lors
  // d'une navigation vers une autre page Storm — mécanisme de
  // développement/démonstration uniquement, jamais une convention
  // d'authentification Orogeny (voir docs/contracts/privacy-and-data-governance.md).
  function navigateWithDevUser(path){
    const devUser = currentDevUser();
    location.assign(devUser ? `${path}?devUser=${encodeURIComponent(devUser)}` : path);
  }

  async function getJson(url){
    const response = await fetch(url, {
      headers:{'Accept':'application/json', ...devHeaders()},
      credentials:'same-origin'
    });

    if (!response.ok) {
      const error = new Error(`HTTP ${response.status}`);
      error.status = response.status;
      throw error;
    }

    return response.json();
  }

  async function loadHomeContext(){
    const [me, projects] = await Promise.all([
      getJson('/api/me'),
      getJson('/api/projects')
    ]);

    return {me, projects:Array.isArray(projects) ? projects : []};
  }

  function renderLoading(){
    projectGrid.hidden = true;
    emptyProjects.hidden = true;
    homeStatus.innerHTML = `
      <div class="skeleton-grid" aria-label="Chargement des projets">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>`;
  }

  function renderError(){
    projectGrid.hidden = true;
    emptyProjects.hidden = true;
    homeStatus.innerHTML = `
      <div class="status-panel" role="alert">
        <div>
          <strong>Storm n’arrive pas à charger vos projets.</strong>
          <p>Votre espace n’a pas été modifié. Vous pouvez réessayer.</p>
          <button class="retry-action" id="retryHome" type="button">Réessayer</button>
        </div>
      </div>`;
    document.getElementById('retryHome')?.addEventListener('click', hydrate);
  }

  function projectMarkup(project){
    const id = escapeHtml(project.id);
    const name = escapeHtml(project.name || 'Projet');
    const accent = safeAccent(project);
    const initial = escapeHtml(projectInitial(project.name));

    return `
      <article
        class="interactive-card project-card"
        data-project-id="${id}"
        style="--accent:${accent};--accent-deep:${accent}"
      >
        <button
          class="card-select"
          type="button"
          aria-expanded="false"
          aria-label="Projet ${name}"
        >
          <span class="project-kicker">Projet</span>
          <span class="identity-mark" aria-hidden="true">${initial}</span>
          <span class="project-body">
            <span class="project-name">${name}</span>
          </span>
        </button>
        <span class="action-slot">
          <button class="card-action" type="button" data-action="open" data-project-id="${id}">Ouvrir</button>
        </span>
      </article>`;
  }

  function clearSelected({restoreFocus=false} = {}){
    if (!selectedCard) return;
    const previous = selectedCard;
    previous.classList.remove('is-selected');
    previous.querySelector('.card-select')?.setAttribute('aria-expanded','false');
    selectedCard = null;
    if (restoreFocus) previous.querySelector('.card-select')?.focus();
  }

  function setSelected(card, {focusAction=false} = {}){
    if (selectedCard && selectedCard !== card) clearSelected();
    selectedCard = card;
    card.classList.add('is-selected');
    card.querySelector('.card-select')?.setAttribute('aria-expanded','true');
    if (focusAction) requestAnimationFrame(() => card.querySelector('.card-action')?.focus());
  }

  // Destinations pas encore construites côté serveur (Project Setup,
  // Meet Storm, Storm Control, Project Shell) : jamais de navigation
  // vers une route qui n'existe pas encore. L'interaction validée
  // (sélection -> révélation de l'action) reste intacte ; seul le
  // clic sur l'action affiche un feedback discret dans Home, sans
  // navigation, sans changement de layout, sans déplacer le focus.
  let toastTimer = null;
  function showComingSoon(){
    clearTimeout(toastTimer);
    toast.textContent = 'Cette partie de Storm arrive dans la prochaine étape.';
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function wireCard(card){
    if (!card || card.dataset.wired === 'true') return;
    const select = card.querySelector('.card-select');
    const action = card.querySelector('.card-action');
    if (!select || !action) return;
    card.dataset.wired = 'true';

    select.addEventListener('click', event => {
      setSelected(card, {focusAction:event.detail === 0});
    });

    action.addEventListener('click', event => {
      event.stopPropagation();
      if (action.dataset.action === 'create') {
        navigateWithDevUser(ROUTES.createProject);
        return;
      }
      if (action.dataset.action === 'open') {
        navigateWithDevUser(ROUTES.project(action.dataset.projectId));
        return;
      }
      showComingSoon();
    });
  }

  function wireCards(){
    document.querySelectorAll('.interactive-card:not([hidden])').forEach(wireCard);
  }

  function renderContext({me,projects}){
    currentContext = {me,projects};
    homeStatus.innerHTML = '';

    const displayName = me?.displayName || 'Utilisateur Storm';
    const organizationName = me?.organization?.name || 'Organisation';

    firstName.textContent = firstNameOf(displayName);
    accountName.textContent = displayName;
    accountOrg.textContent = `Storm · ${organizationName}`;
    avatarBtn.textContent = initials(displayName);

    const canCreate = hasCapability(me,'projects.create');
    const canControl = hasCapability(me,'control.access');

    createCard.hidden = !canCreate;
    controlLink.hidden = !canControl;
    controlMenuItem.hidden = !canControl;

    const list = Array.isArray(projects) ? projects : [];
    projectGrid.innerHTML = list.map(projectMarkup).join('');
    projectGrid.hidden = list.length === 0;
    emptyProjects.hidden = list.length !== 0;

    wireCards();
  }

  async function hydrate(){
    clearSelected();
    renderLoading();

    try{
      await resolveDemoIdentity();
      const context = await loadHomeContext();
      renderContext(context);
    }catch(error){
      console.error('[Storm Home] load failed', error);
      renderError();
    }
  }

  document.addEventListener('click', event => {
    if (!event.target.closest('.interactive-card')) clearSelected();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && selectedCard) clearSelected({restoreFocus:true});
  });

  controlLink.addEventListener('click', () => navigateWithDevUser(ROUTES.control));
  controlMenuItem.addEventListener('click', () => navigateWithDevUser(ROUTES.control));

  const avatarBtnEl = document.getElementById('avatarBtn');
  avatarBtnEl.addEventListener('click', event => {
    event.stopPropagation();
    const isOpen = accountPopover.classList.toggle('open');
    avatarBtnEl.setAttribute('aria-expanded', String(isOpen));
  });

  document.addEventListener('click', event => {
    if (!event.target.closest('.avatar-wrap')) {
      accountPopover.classList.remove('open');
      avatarBtnEl.setAttribute('aria-expanded','false');
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && accountPopover.classList.contains('open')) {
      accountPopover.classList.remove('open');
      avatarBtnEl.setAttribute('aria-expanded','false');
      avatarBtnEl.focus();
    }
  });

  // Utility cards are static product surfaces and can be wired before API hydration.
  wireCard(createCard);
  wireCard(discoverCard);

  hydrate();
</script>
</body>
</html>
