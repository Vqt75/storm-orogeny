<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm Studio — Questions · Orogeny</title>
<link rel="stylesheet" href="/fonts/roboto.css" />
<style>
:root{--canvas:#f6f6f3;--ink:#111;--muted:#77777c;--quiet:#9a9a9f;--project-accent:#8a8a8d;--project-accent-rgb:138,138,141;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 24px 68px rgba(17,17,17,.105)}
*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--canvas)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -10%,#fff,transparent 34%),radial-gradient(circle at 86% 2%,rgba(var(--project-accent-rgb),.07),transparent 25%),var(--canvas);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif}button,input{font:inherit;color:inherit}
.shell{min-height:100vh;padding:22px 28px 150px}.topbar{z-index:40;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.36);backdrop-filter:blur(24px) saturate(175%);-webkit-backdrop-filter:blur(24px) saturate(175%);border-radius:20px;box-shadow:0 10px 34px rgba(17,17,17,.07),inset 0 1px 0 rgba(255,255,255,.78)}
.brand{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:720;letter-spacing:-.035em}.brand-project{color:var(--muted);font-weight:560;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;gap:6px;align-items:center}.shell-link,.avatar-btn{border:0;cursor:pointer}.shell-link{padding:9px 12px;border-radius:12px;background:transparent;font-size:13px;font-weight:670}.avatar-btn{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;font-size:12px;font-weight:760}
main{width:min(1280px,100%);margin:0 auto;padding-top:84px}.studio-grid{display:grid;grid-template-columns:190px minmax(0,860px);gap:58px;align-items:start}.studio-nav{padding:7px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(247,247,244,.44);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 12px 38px rgba(17,17,17,.065),inset 0 1px 0 rgba(255,255,255,.82)}.nav-item{width:100%;min-height:43px;padding:0 13px;border:0;border-radius:15px;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-size:13px;font-weight:650}.nav-item:hover{color:var(--ink);background:rgba(255,255,255,.38)}.nav-item.active{color:var(--ink);background:rgba(255,255,255,.82);box-shadow:0 7px 18px rgba(17,17,17,.055),inset 0 1px 0 rgba(255,255,255,.96)}
.page-head{position:relative;margin-bottom:48px}.page-head:after{content:"";position:absolute;z-index:-1;width:270px;height:270px;right:-40px;top:-110px;border-radius:50%;background:rgba(var(--project-accent-rgb),.08)}.eyebrow{margin:0 0 13px;color:var(--muted);font-size:11px;font-weight:780;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(54px,6.2vw,88px);line-height:.9;letter-spacing:-.064em;font-weight:630}.lead{margin:19px 0 0;max-width:600px;color:var(--muted);font-size:15px;line-height:1.55}
.questions{display:grid;gap:16px}.question{position:relative;border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 1px 0 rgba(255,255,255,.84) inset,0 11px 30px rgba(17,17,17,.035);padding:26px 28px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease)}.question:focus-within,.question.is-active{background:rgba(255,255,255,.96);box-shadow:var(--shadow);transform:translateY(-2px)}.question-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}.question-title{width:100%;border:0;outline:0;background:transparent;padding:0;font-size:24px;line-height:1.18;font-weight:690;letter-spacing:-.035em;white-space:pre-wrap;word-break:break-word;min-height:1.18em}.question-title:empty:before{content:attr(data-placeholder);color:#b1b1b5}.question-menu{width:36px;height:36px;border:0;border-radius:12px;background:transparent;cursor:pointer;color:var(--muted);font-size:20px}.answer{margin-top:18px;min-height:74px;outline:0;color:#343438;font-size:15px;line-height:1.62;white-space:pre-wrap}.answer:empty:before{content:attr(data-placeholder);color:#a7a7ac}.question-meta{margin-top:18px;color:var(--quiet);font-size:11px;min-height:15px}.question-popover{position:absolute;z-index:20;right:24px;top:62px;min-width:150px;padding:7px;border-radius:16px;background:rgba(248,248,246,.9);border:1px solid rgba(255,255,255,.74);backdrop-filter:blur(22px);box-shadow:0 18px 46px rgba(17,17,17,.14)}.question-popover button{width:100%;border:0;border-radius:11px;background:transparent;padding:10px 11px;text-align:left;cursor:pointer;font-size:13px}.question-popover .danger{color:#b42318}.add-question{min-height:78px;border:0;border-radius:24px;background:rgba(255,255,255,.25);color:var(--muted);cursor:pointer;text-align:left;padding:0 24px;font-size:14px;font-weight:680}.add-question:hover{background:rgba(255,255,255,.70);color:var(--ink)}
.loading,.error{min-height:300px;border-radius:30px;background:rgba(255,255,255,.48);display:flex;align-items:flex-end;padding:30px}.skeleton{width:100%;height:220px;border-radius:28px;background:linear-gradient(105deg,rgba(255,255,255,.34) 18%,rgba(255,255,255,.82) 38%,rgba(255,255,255,.34) 58%);background-size:220% 100%;animation:skeleton 1.25s linear infinite}@keyframes skeleton{to{background-position-x:-220%}}.error strong{display:block;margin-bottom:8px;font-size:22px}.error p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.format-popover{position:fixed;z-index:80;display:flex;gap:3px;padding:5px;border:1px solid rgba(255,255,255,.75);border-radius:15px;background:rgba(244,244,242,.72);backdrop-filter:blur(22px) saturate(185%);box-shadow:0 15px 42px rgba(17,17,17,.16)}.format-button{width:35px;height:35px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:720}.format-button:hover{background:rgba(255,255,255,.7)}.format-button[data-format="italic"]{font-style:italic}.format-button[data-format="underline"]{text-decoration:underline}
.command-layer{position:fixed;z-index:70;left:50%;bottom:22px;transform:translateX(-50%);width:min(620px,calc(100vw - 28px));min-height:58px;padding:6px;border:1px solid rgba(255,255,255,.74);border-radius:20px;background:rgba(244,244,242,.48);backdrop-filter:blur(28px) saturate(190%);box-shadow:0 18px 54px rgba(17,17,17,.16),inset 0 1px 0 rgba(255,255,255,.90)}.command-state{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}.command-message{padding:0 12px;text-align:center;color:#343438;font-size:13px}.command-message strong{color:var(--ink);font-weight:720}.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}.state-dot-success{background:#1f8a52}.state-dot-warning{background:#b57a12}.state-dot-error{background:#c23a2e}.command-button{min-height:42px;padding:0 16px;border:0;border-radius:15px;background:transparent;cursor:pointer;font-size:13px;font-weight:690}.command-button:hover{background:rgba(255,255,255,.44)}.command-button.primary{background:#111;color:#fff}.command-link{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:15px;color:#343438;font-size:13px;font-weight:690;text-decoration:none}.command-link:hover{background:rgba(255,255,255,.44)}
.confirm-sheet{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;background:rgba(17,17,17,.12);backdrop-filter:blur(8px)}.confirm-card{width:min(420px,100%);padding:24px;border-radius:26px;background:rgba(250,250,248,.94);box-shadow:0 28px 80px rgba(17,17,17,.20)}.confirm-card h2{margin:0 0 8px;font-size:22px}.confirm-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.confirm-actions button{border:0;border-radius:13px;padding:10px 14px;cursor:pointer;font-weight:690}.confirm-cancel{background:rgba(17,17,17,.06)}.confirm-delete{background:#111;color:#fff}
@media(max-width:900px){.shell{padding:14px 14px 136px}.topbar{top:10px;height:58px;padding-left:15px}.brand-project,.shell-link{display:none}main{padding-top:66px}.studio-grid{grid-template-columns:1fr;gap:30px}.studio-nav{position:relative;top:auto;display:flex;gap:4px;overflow:auto;padding:6px}.nav-item{width:auto;flex:0 0 auto;padding:0 13px}.page-head{margin-bottom:36px}h1{font-size:clamp(50px,15vw,76px)}.question{padding:22px}.question-title{font-size:21px}.command-layer{bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><strong>Storm</strong><span class="brand-project" id="brandProject">Projet</span></div><div class="top-actions"><button class="shell-link" id="projectLink" type="button">Projet</button><button class="avatar-btn" id="avatarBtn" type="button" aria-label="Compte">VC</button></div></header>
<main><div class="studio-grid">
<nav class="studio-nav" aria-label="Studio"><button class="nav-item" data-domain="homepage">Homepage</button><button class="nav-item" data-domain="project">Le projet</button><button class="nav-item" data-domain="spaces">Espaces</button><button class="nav-item" data-domain="news">Actualités</button><button class="nav-item" data-domain="ambassadors">Ambassadeurs</button><button class="nav-item active" data-domain="questions" aria-current="page">Questions</button><button class="nav-item" data-domain="identity" type="button">Identité</button></nav>
<section class="content" aria-labelledby="pageTitle"><header class="page-head"><p class="eyebrow">Studio</p><h1 id="pageTitle">Questions</h1><p class="lead">Les réponses que les collaborateurs peuvent retrouver dans Storm.</p></header><div id="contentRoot"><div class="loading"><div class="skeleton"></div></div></div></section>
</div></main>
</div>
<div class="format-popover" id="formatPopover" hidden role="toolbar" aria-label="Mise en forme"><button class="format-button" data-format="bold">B</button><button class="format-button" data-format="italic">I</button><button class="format-button" data-format="underline">U</button></div>
<div class="command-layer" id="commandLayer" role="region" aria-label="Command Layer"><div class="command-state" id="commandState" aria-live="polite"></div></div>
<div class="confirm-sheet" id="confirmSheet" hidden><div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><h2 id="confirmTitle">Supprimer cette question ?</h2><p>Cette suppression retire la question du brouillon Studio. Elle ne modifie pas la version publique tant que vous ne publiez pas.</p><div class="confirm-actions"><button class="confirm-cancel" id="confirmCancel">Annuler</button><button class="confirm-delete" id="confirmDelete">Supprimer</button></div></div></div>
<script>
const CAP={EDIT:'content.edit',PUBLISH:'publication.publish'};const state={me:null,context:null,questions:[],loadStatus:'loading',saveStatus:'saved',saveError:null,hasUnpublishedChanges:false,pendingSaves:new Map(),timers:new Map(),activeQuestionId:null,deleteQuestionId:null,commandLocked:false};const projectId=(location.pathname.match(/^\/projects\/([^/]+)\/studio\/?$/)||[])[1]||'';const contentRoot=document.getElementById('contentRoot'),commandLayer=document.getElementById('commandLayer'),commandState=document.getElementById('commandState'),formatPopover=document.getElementById('formatPopover'),brandProject=document.getElementById('brandProject'),confirmSheet=document.getElementById('confirmSheet');
function devHeaders(){const u=new URLSearchParams(location.search).get('devUser');return u?{'X-Storm-Dev-User':u}:{}}function preserveDev(url){const u=new URLSearchParams(location.search).get('devUser');return u?`${url}${url.includes('?')?'&':'?'}devUser=${encodeURIComponent(u)}`:url}function hasCap(c){return Array.isArray(state.context?.membership?.capabilities)&&state.context.membership.capabilities.includes(c)}function safeAccent(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v:'#8a8a8d'}function setAccent(v){const h=safeAccent(v).slice(1);const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));document.documentElement.style.setProperty('--project-accent',`#${h}`);document.documentElement.style.setProperty('--project-accent-rgb',rgb.join(','))}
async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:'same-origin',headers:{Accept:'application/json',...devHeaders(),...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});let b=null;if(r.status!==204){const t=r.headers.get('content-type')||'';b=t.includes('application/json')?await r.json():await r.text()}if(!r.ok){const e=new Error(b?.message||b?.error?.message||`HTTP ${r.status}`);e.status=r.status;e.body=b;throw e}return b}
function esc(v=''){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function runsToHtml(r=[]){return r.map(x=>{let t=esc(x.text||'');if(x.bold)t=`<strong>${t}</strong>`;if(x.italic)t=`<em>${t}</em>`;if(x.underline)t=`<u>${t}</u>`;return t}).join('')}function formatting(node,root){let b=false,i=false,u=false,c=node?.nodeType===3?node.parentElement:node;while(c&&c!==root){const t=c.tagName?.toLowerCase();if(t==='strong'||t==='b')b=true;if(t==='em'||t==='i')i=true;if(t==='u')u=true;c=c.parentElement}return{bold:b,italic:i,underline:u}}function answerRuns(root){const out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const text=n.nodeValue||'';if(!text)continue;const f=formatting(n,root),p=out[out.length-1];if(p&&!!p.bold===f.bold&&!!p.italic===f.italic&&!!p.underline===f.underline)p.text+=text;else out.push({text,...f})}return out}
function markup(q){return `<article class="question" data-question-id="${q.id}"><div class="question-header"><div class="question-title" contenteditable="true" role="textbox" aria-multiline="false" aria-label="Question" data-placeholder="Votre question">${esc(q.question||'')}</div><button class="question-menu" aria-label="Actions">•••</button></div><div class="answer" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Écrivez la réponse…">${runsToHtml(q.answerRuns||[])}</div><div class="question-meta">${q.updatedAt?'Brouillon enregistré':''}</div><div class="question-popover" hidden><button class="danger" data-action="delete">Supprimer</button></div></article>`}
function renderQuestions(){if(state.loadStatus==='loading'){contentRoot.innerHTML='<div class="loading"><div class="skeleton"></div></div>';return}if(state.loadStatus==='error'){contentRoot.innerHTML='<div class="error"><div><strong>Storm n’arrive pas à ouvrir Questions.</strong><p>Le brouillon n’a pas été modifié.</p></div></div>';return}contentRoot.innerHTML=`<div class="questions">${state.questions.map(markup).join('')}<button class="add-question" id="addQuestion">+ Ajouter une question</button></div>`;wireEditors();document.getElementById('addQuestion').onclick=createQuestion}
function getQ(id){return state.questions.find(q=>String(q.id)===String(id))}function readQ(id){const a=contentRoot.querySelector(`[data-question-id="${CSS.escape(String(id))}"]`);if(!a)return null;return{question:a.querySelector('.question-title').textContent||'',answerRuns:answerRuns(a.querySelector('.answer'))}}
function markDirty(id){state.saveStatus='dirty';state.hasUnpublishedChanges=true;renderCommand();clearTimeout(state.timers.get(id));state.timers.set(id,setTimeout(()=>saveQuestion(id),800))}
async function saveQuestion(id){const item=getQ(id),draft=readQ(id);if(!item||!draft)return;if(state.pendingSaves.has(id)){state.pendingSaves.set(id,draft);return}state.saveStatus='saving';renderCommand();state.pendingSaves.set(id,null);try{const updated=await api(`/api/projects/${projectId}/studio/questions/${id}`,{method:'PATCH',body:JSON.stringify({version:item.version,...draft})});Object.assign(item,updated||{},draft);state.pendingSaves.delete(id);state.saveStatus=state.pendingSaves.size?'saving':'saved';renderCommand()}catch(e){state.pendingSaves.delete(id);state.saveStatus=e.status===409?'conflict':'error';state.saveError={id,error:e};renderCommand()}}
async function createQuestion(){try{state.saveStatus='saving';renderCommand();const created=await api(`/api/projects/${projectId}/studio/questions`,{method:'POST',body:JSON.stringify({question:'',answerRuns:[],position:state.questions.length})});state.questions.push(created);state.hasUnpublishedChanges=true;state.saveStatus='saved';renderQuestions();renderCommand();requestAnimationFrame(()=>contentRoot.querySelector(`[data-question-id="${created.id}"] .question-title`)?.focus())}catch(e){state.saveStatus='error';state.saveError={id:null,error:e};renderCommand()}}
function openDelete(id){state.deleteQuestionId=id;confirmSheet.hidden=false;document.getElementById('confirmDelete').focus()}function closeDelete(){confirmSheet.hidden=true;state.deleteQuestionId=null}function cancelDelete(){const id=state.deleteQuestionId;closeDelete();const menuBtn=id?contentRoot.querySelector(`[data-question-id="${CSS.escape(String(id))}"] .question-menu`):null;menuBtn?.focus()}async function deleteQuestion(){const id=state.deleteQuestionId,item=getQ(id);if(!id||!item)return;try{await api(`/api/projects/${projectId}/studio/questions/${id}?version=${encodeURIComponent(item.version)}`,{method:'DELETE'});state.questions=state.questions.filter(q=>String(q.id)!==String(id));state.hasUnpublishedChanges=true;closeDelete();renderQuestions();renderCommand()}catch(e){closeDelete();state.saveStatus=e.status===409?'conflict':'error';state.saveError={id,error:e};renderCommand()}}
function wireEditors(){contentRoot.querySelectorAll('.question').forEach(a=>{const id=a.dataset.questionId,title=a.querySelector('.question-title'),answer=a.querySelector('.answer'),menu=a.querySelector('.question-menu'),pop=a.querySelector('.question-popover');title.oninput=()=>markDirty(id);answer.oninput=()=>markDirty(id);title.onkeydown=e=>{if(e.key==='Enter')e.preventDefault()};title.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain').replace(/[\r\n]+/g,' '))};[title,answer].forEach(el=>{el.onfocus=()=>{state.activeQuestionId=id;a.classList.add('is-active')};el.onblur=()=>a.classList.remove('is-active')});menu.onclick=e=>{e.stopPropagation();document.querySelectorAll('.question-popover').forEach(o=>{if(o!==pop)o.hidden=true});pop.hidden=!pop.hidden};pop.querySelector('[data-action="delete"]').onclick=()=>openDelete(id)})}
function setCommand(html){commandState.innerHTML=html;wireCommand()}function renderCommand(){if(state.commandLocked)return;if(state.loadStatus==='loading'){setCommand('<span class="command-message">Ouverture de <strong>Studio</strong>…</span>');return}if(state.loadStatus==='error'){setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Impossible d’ouvrir Studio.</span><button class="command-button primary" data-command="reload">Réessayer</button>');return}if(state.saveStatus==='saving'||state.saveStatus==='dirty'){setCommand('<span class="command-message">Enregistrement…</span>');return}if(state.saveStatus==='error'){setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Impossible d’enregistrer.</span><button class="command-button primary" data-command="retry">Réessayer</button>');return}if(state.saveStatus==='conflict'){setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span><strong>Cette question a changé ailleurs.</strong></span><button class="command-button primary" data-command="reload">Recharger</button>');return}if(state.hasUnpublishedChanges&&hasCap(CAP.PUBLISH)){setCommand('<span class="command-message"><span class="state-dot state-dot-warning"></span>Tout est enregistré</span><button class="command-button primary" data-command="publish">Publier</button>');return}setCommand(`<span class="command-message"><span class="state-dot state-dot-success"></span><strong>${state.context?.project?.name||'Studio'}</strong> · Tout est enregistré</span>${state.publishedUrl?` <a class="command-link" href="${esc(state.publishedUrl)}" target="_blank" rel="noopener">Voir le site publié</a>`:''}`)}
function wireCommand(){commandState.querySelector('[data-command="reload"]')?.addEventListener('click',hydrate);commandState.querySelector('[data-command="retry"]')?.addEventListener('click',()=>{const id=state.saveError?.id||state.activeQuestionId;if(id)saveQuestion(id);else hydrate()});commandState.querySelector('[data-command="publish"]')?.addEventListener('click',doPublish);commandState.querySelector('[data-command="close"]')?.addEventListener('click',renderCommand)}
async function doPublish(){
  setCommand('<span class="command-message">Publication…</span>');
  let res,data;
  try{res=await fetch(`/api/projects/${projectId}/publications`,{method:'POST',headers:devHeaders()});data=await res.json().catch(()=>({}))}
  catch(e){setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Connexion impossible. Le brouillon reste enregistré.</span><button class="command-button" data-command="close">Fermer</button>');return}
  if(res.status===201){
    state.hasUnpublishedChanges=false;
    state.publishedUrl=`/public/projects/${projectId}`;
    const warn=(data.warnings||[]).map(w=>`<br><span class="command-message"><span class="state-dot state-dot-warning"></span>${esc(w.message)}</span>`).join('');
    setCommand(`<span class="command-message"><span class="state-dot state-dot-success"></span><strong>Publication n°${data.revision}</strong> publiée.</span>${warn}<a class="command-link" href="${esc(state.publishedUrl)}" target="_blank" rel="noopener">Voir le site publié</a><button class="command-button" data-command="close">Fermer</button>`);
    return
  }
  if(res.status===422){setCommand(`<span class="command-message"><span class="state-dot state-dot-error"></span>Compilation impossible : ${esc(data.failureDetail||'erreur inconnue')}. Le brouillon reste enregistré.</span><button class="command-button" data-command="close">Fermer</button>`);return}
  if(res.status===403){setCommand(`<span class="command-message"><span class="state-dot state-dot-error"></span>${esc(data.error?.message||"Cette action nécessite une capability que vous n'avez pas.")}</span><button class="command-button" data-command="close">Fermer</button>`);return}
  setCommand('<span class="command-message"><span class="state-dot state-dot-error"></span>Publication impossible pour le moment. Le brouillon reste enregistré.</span><button class="command-button" data-command="close">Fermer</button>')
}
commandLayer.addEventListener('focusin',()=>state.commandLocked=true);commandLayer.addEventListener('focusout',e=>{if(commandLayer.contains(e.relatedTarget))return;state.commandLocked=false;renderCommand()})
function selectedAnswer(){const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;const r=s.getRangeAt(0),el=r.commonAncestorContainer.nodeType===3?r.commonAncestorContainer.parentElement:r.commonAncestorContainer;const answer=el.closest?.('.answer');return answer?{s,r,answer}:null}function showFormat(){const a=selectedAnswer();if(!a){formatPopover.hidden=true;return}const rect=a.r.getBoundingClientRect();if(!rect.width&&!rect.height){formatPopover.hidden=true;return}formatPopover.hidden=false;const w=formatPopover.offsetWidth;formatPopover.style.left=`${Math.max(8,Math.min(innerWidth-w-8,rect.left+rect.width/2-w/2))}px`;formatPopover.style.top=`${Math.max(8,rect.top-formatPopover.offsetHeight-10)}px`}document.addEventListener('selectionchange',()=>requestAnimationFrame(showFormat));formatPopover.querySelectorAll('[data-format]').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();const a=selectedAnswer();if(!a)return;document.execCommand(b.dataset.format,false,null);const q=a.answer.closest('.question');if(q)markDirty(q.dataset.questionId);requestAnimationFrame(showFormat)}))
document.addEventListener('click',e=>{if(!e.target.closest('.question-menu')&&!e.target.closest('.question-popover'))document.querySelectorAll('.question-popover').forEach(p=>p.hidden=true)});const STUDIO_DOMAIN_PATHS={homepage:'homepage',project:'project',spaces:'spaces',news:'news',ambassadors:'ambassadors',questions:'',identity:'identity'};document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{if(b.dataset.domain==='questions')return;const seg=STUDIO_DOMAIN_PATHS[b.dataset.domain];location.assign(preserveDev(`/projects/${projectId}/studio${seg?'/'+seg:''}`))})
async function hydrate(){state.loadStatus='loading';renderQuestions();renderCommand();try{const[context,me,questions]=await Promise.all([api(`/api/projects/${projectId}/context`),api('/api/me'),api(`/api/projects/${projectId}/studio/questions`)]);state.context=context;state.me=me;if(!hasCap(CAP.EDIT))throw Object.assign(new Error('Forbidden'),{status:403});state.questions=Array.isArray(questions)?questions:[];state.loadStatus='ready';state.saveStatus='saved';brandProject.textContent=context.project?.name||'Projet';setAccent(context.identity?.primaryColor);try{const pub=await api(`/api/projects/${projectId}/publications/active`);state.publishedUrl=pub?`/public/projects/${projectId}`:null}catch(e){state.publishedUrl=null}renderQuestions();renderCommand()}catch(e){console.error('[Storm Studio] load failed',e);state.loadStatus='error';renderQuestions();renderCommand()}}
document.getElementById('projectLink').onclick=()=>location.assign(preserveDev(`/projects/${projectId}`));document.getElementById('confirmCancel').onclick=cancelDelete;document.getElementById('confirmDelete').onclick=deleteQuestion;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!confirmSheet.hidden){cancelDelete();return}formatPopover.hidden=true;renderCommand()}});hydrate();
</script>
